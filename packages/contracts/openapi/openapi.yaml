openapi: 3.1.0

info:
  title: Open Analytics API
  version: 0.1.0
  summary: Versioned HTTP contract between the Open Analytics backend and its clients.
  description: |
    Milestone 0 skeleton. This document is the machine-readable source of truth
    for the frontend generated client (docs snapshot 05, D-215); hand-copied type
    files are not a contract.

    Rules that hold for every operation added later:

    - Business routes live under `/v1`. Unversioned business endpoints are not allowed.
    - Every timestamp is ISO-8601 UTC. Every range is half-open `[from, to)`.
    - Errors always use the `ErrorEnvelope` shape and a stable `code`.
    - Large collections are cursor-paginated, never offset-paginated.
    - Money crosses the wire as a minor-unit integer plus an ISO-4217 currency.
    - The public tracking key is write-only and is never accepted as read auth.
  contact:
    name: Open Analytics backend
  license:
    name: UNLICENSED

servers:
  - url: https://api.example.invalid
    description: Placeholder. The real host comes from typed config (docs snapshot 03 §2).

tags:
  - name: system
    description: Health, readiness and contract metadata.
  - name: account
    description: |
      The signed-in user's own account settings. Addressed by the session — there
      is no user id in any of these paths, so a caller can only ever act on
      themselves.
  - name: sites
    description: Site identifiers, membership and API keys.
  - name: ingest
    description: |
      Public event intake and tracker configuration, served by the collector.
      Authenticated by the write-only public tracking key in the request body —
      never a session, never a read credential.
  - name: analytics
    description: |
      Authenticated dashboard reads. Every operation authorizes membership and
      billing entitlement server-side, then reads through the signed query
      gateway — never raw SQL, never the raw event table (docs snapshot 02 §15,
      §18, §19; docs snapshot 05 D-208).
  - name: read-key
    description: |
      Reads authenticated by a `private_read` API key instead of a session
      (docs snapshot 02 §20, [ADR-0042]). The key names the site — there is no
      `site_id` in any of these paths, so a caller cannot address a site its
      credential is not bound to — and what it may read is decided by the key's
      scopes, not by a membership role.

      Built for unattended integrations, the WordPress plugin first. The billing
      and lifecycle gates are the site's, not the door's: a `suspended`
      site closes these reads exactly as it closes the dashboard's.
  - name: imports
    description: |
      Bringing a site's history over from another analytics provider. The archive
      never passes through this API: a create mints a signed upload URL with the
      content type and exact length bound into the signature, the browser uploads
      straight to private object storage, and `complete` is the only look the API
      takes at what arrived. Mounted only where object storage is configured.
  - name: exports
    description: |
      Taking a site's own data back out. The bytes never pass through this API
      either: a job writes gzipped NDJSON chunks to private object storage at a
      pinned cutoff, and a download mints short-lived signed URLs for them.
      Status and download are separate operations on purpose - polling the first
      costs nothing, and only the second is audited. Mounted only where object
      storage is configured.
  - name: revenue
    description: |
      Connecting a site to a payment provider so the dashboard can report real
      money. The customer creates a **restricted, read-only key** in their own
      provider dashboard plus a webhook endpoint pointing at the per-site URL
      this API hands back; both are verified live before anything is stored, and
      the secrets are never returned by any operation. The connection surface is
      mounted only where the credential keyring is configured, and it stays
      reachable while a site is `suspended` — a blocked site must still be
      able to disconnect.
  - name: public
    description: |
      Unauthenticated public-dashboard reads, addressed by an opaque share slug
      (never an internal `site_id`). A narrower allowlist of metrics and fields,
      rate-limited, with city data coarsened for privacy. Closed while a site is
      `suspended` (docs snapshot 02 §20).
  - name: widgets
    description: |
      Embeddable single-answer views of a site's own analytics, rendered on pages
      that are not ours (ADR-0045; docs snapshot 02 §20 "Widgets").

      A widget is `(surface, range, limit, title)` stored in Postgres and
      addressed by an **opaque widget id** — its whole credential, and never an
      internal `site_id`. The public read carries **no query parameters at all**:
      the configuration is the request, so there is nothing for a caller to ask
      for. Every payload is one of the public share surfaces' own aggregate
      responses, read from rollups; no private key ever reaches a browser.

      Each widget carries its own origin allowlist, its own rate limit and its
      own cache lifetime, and a `suspended` site closes its widgets in the
      backend — indistinguishably from an id that never existed.
  - name: assistant
    description: |
      The AI analytics assistant (ADR-0046; docs snapshot 02 §21). A
      session-authenticated consumer of the read surface — never a SQL generator
      and never an authorization bypass.

      The assistant answers by **calling the same `/v1/read/*` routes the caller
      could call themselves**, with the caller's own session, so every tool call
      re-checks live membership, the site's billing gate, the declared-range
      ceiling and the query-cost budget. Its tool catalogue is the MCP tool
      table, filtered to the analytics and revenue reads: `list_sites`, the seven
      aggregate analytics reads, and — since ADR-0049 D3 — `revenue_summary` and
      `revenue_timeseries`, which are owner-only and carry no per-customer
      dimension. **Realtime is still deliberately absent** (ADR-0046 D3), and so
      is every management read and every write on that table: a session carries
      `site:read`, `analytics:read` and `revenue:read` and nothing else, so
      `team_members`, `billing_usage` and the event-definition tools are not
      merely unhelpful here — they would answer `403` on every call.

      The answer is an SSE stream, and a failure is a named `error` event inside
      it rather than prose inside a `200`. Usage is a per-user rolling-24-hour
      ledger, reportable at `GET /v1/assistant/usage`; over the limit is `429`
      with `Retry-After`, never a payment status — the assistant is included in
      the plan (F-306, 8 August 2026).

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness and dependency health.
      description: |
        Unauthenticated. Reports process liveness plus per-dependency status.
        Never returns host names, credentials or connection strings.
      security: []
      responses:
        '200':
          description: Service is live. `status` may still be `degraded`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is live but cannot serve requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/auth/providers:
    get:
      operationId: listAuthProviders
      tags: [system]
      summary: The sign-in methods this deployment offers.
      description: |
        Unauthenticated: it is asked before anyone is signed in, and it discloses
        only which doors exist — no client ids, no URLs, no secrets.

        The login screen renders from this list rather than hard-coding buttons,
        so a deployment with no GitHub OAuth app does not offer a GitHub button
        that can only end on a provider error page.

        `setup_required` answers the other question the same screen has to ask:
        whether this deployment has anybody in it yet. When it is true the screen
        offers to create the first account instead of asking for one that cannot
        exist, and `POST /v1/auth/setup` is open. It goes false the moment an
        account exists and never goes true again.
      security: []
      responses:
        '200':
          description: The enabled sign-in methods, in the order they should be offered.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, setup_required]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthProvider'
                  setup_required:
                    type: boolean
                    description: |
                      True when this deployment has no accounts at all. Always
                      false where the api has no auth database to ask.

  /v1/auth/setup:
    post:
      operationId: createFirstAccount
      tags: [system]
      summary: Create the first account on a deployment that has none.
      description: |
        The way into a fresh self-hosted install, and the only route on this api
        that both writes and accepts no credential.

        **The guard is the emptiness of the users table.** With one account in
        existence this answers `409` and keeps answering it forever, so the route
        closes itself — there is no flag to turn off afterwards and no window a
        misconfiguration can re-open.

        The address is marked verified, because the account exists precisely
        because no mail transport is configured and there is nothing to verify it
        with. That is also what makes it the same account later: configure OAuth
        or SMTP, sign in with the same address, and you land on this account
        rather than a second one.

        A successful call returns the session cookie, so the caller is signed in
        and goes straight to creating their first site.

        **Known window.** Between the first successful boot and this call, anyone
        who can reach the api can claim the deployment. It is rate-limited and
        logged with the claiming address, and SELF-HOSTING says to do it first.
        A setup token printed to the log was considered and rejected: it puts the
        operator back to reading logs, which is the step this route exists to
        remove.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                name:
                  type: string
                  description: Optional. Defaults to the local part of the address.
      responses:
        '200':
          description: The account was created and the caller is signed in.
        '400':
          description: The address or the password was rejected.
        '409':
          description: |
            This deployment already has an account (`SETUP_COMPLETE`). Answered
            only when the users table is non-empty — including when a race made
            it so between the guard and the write.
        '429':
          description: Too many attempts from this address.
        '503':
          description: |
            This deployment cannot create an account this way. `NOT_CONFIGURED`
            — no auth database; `PASSWORD_SIGNIN_DISABLED` — the account this
            route writes signs in with a password and `AUTH_PASSWORD_SIGNIN` is
            not `enabled`, so those endpoints are not mounted;
            `SETUP_FAILED` — the write was refused and the deployment still has
            no account, with the reason in the api log.

  /v1/deployment/settings:
    get:
      operationId: getDeploymentSettings
      tags: [system]
      summary: What this deployment is configured with, and whether it can be changed here.
      description: |
        The settings an operator supplies from a third party — a mail relay, a
        model provider — stored in the deployment rather than in an env file on
        the host.

        **`editable` decides whether the screen exists at all.** It is false, with
        a `reason`, when the deployment is configured from its environment
        (`disabled`), when there is no `OA_CREDENTIAL_KEYRING` to encrypt a secret
        with (`no_keyring`), or when the caller is not the operator
        (`not_operator`). A closed response carries no values: a deployment that
        turned this off has not agreed to disclose its relay to anybody.

        **The operator is the account that claimed the deployment** — the oldest
        one. There is no role above a site membership, and this is the same
        sentence the first-run screen makes to the person creating that account.

        **A stored secret is never returned.** Each scope reports `secret_set` and
        `secret_last4`, and nothing else about it.

        The mail block reports only what this service can see. `SMTP_*` and
        `RESEND_API_KEY` are forbidden on the api — the worker delivers mail, so
        the worker holds the relay credential — so the api genuinely cannot tell
        whether mail already works from the environment, and does not guess. Send
        a test to find out.
      responses:
        '200':
          description: The deployment's settings, or the reason they cannot be edited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentSettings'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/deployment/settings/email:
    put:
      operationId: setDeploymentEmailSettings
      tags: [system]
      summary: Store the mail transport this deployment sends through.
      description: |
        A whole-row replace: what is submitted is the complete state of the
        setting, so a field left out is a field cleared.

        **The password is the one exception**, because a form cannot resend a
        value it was never given. Omit `password` to keep the stored one, send a
        string to replace it, and send `null` to remove it — a relay on the same
        host often wants no credential at all.

        The stored transport wins over the worker's `SMTP_*` and `RESEND_API_KEY`,
        and takes effect on the worker's next drain — a few seconds, no restart.
        Removing it (`DELETE`) falls back to the environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentEmailSettingsRequest'
      responses:
        '200':
          description: The stored settings, without the password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentStoredSetting'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            The surface is closed (`FORBIDDEN`, with `details.reason` one of
            `disabled`, `no_keyring`, `not_operator`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: clearDeploymentEmailSettings
      tags: [system]
      summary: Remove the stored mail transport, falling back to the environment.
      description: |
        `204` whether or not a row was stored: the state the caller asked for is
        the state that now holds.
      responses:
        '204':
          description: No stored mail transport remains.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The surface is closed (`FORBIDDEN`, with `details.reason`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/deployment/settings/email/test:
    post:
      operationId: sendDeploymentTestEmail
      tags: [system]
      summary: Send a test message to the operator's own address.
      description: |
        **Queued, not sent.** The api holds no mail credential — the worker is the
        only process that delivers — so this writes an outbox row and answers
        `202`. Poll `GET /v1/deployment/settings/email/test/{delivery_id}` for the
        outcome. What it proves is that the transport *the worker* resolved works,
        which is the thing that was in doubt.

        The recipient is the caller's own address and there is no field for it: a
        deployment-wide send button that took an address would be an open relay
        for one message.
      responses:
        '202':
          description: The test message is queued.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [delivery_id, to]
                properties:
                  delivery_id:
                    type: [string, 'null']
                    description: |
                      Null only if an identical send was already queued, which the
                      fresh idempotency key makes unreachable in practice.
                  to:
                    type: string
                    format: email
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The surface is closed (`FORBIDDEN`, with `details.reason`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many tests from this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/deployment/settings/email/test/{delivery_id}:
    get:
      operationId: getDeploymentTestEmailStatus
      tags: [system]
      summary: What became of a queued test message.
      description: |
        `pending` while the worker has not finished with it — including between a
        failed attempt and its retry, which is why `reason` is populated on a
        pending row too. `reason` is the transport's own categorized outcome
        (`unauthorized`, `unavailable`, `invalid`), never a raw relay reply.
      parameters:
        - name: delivery_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The delivery's current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentTestEmailStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The surface is closed (`FORBIDDEN`, with `details.reason`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No test send with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/deployment/settings/assistant:
    put:
      operationId: setDeploymentAssistantSettings
      tags: [system]
      summary: Store the model provider the assistant talks to.
      description: |
        Same rules as the mail transport, with one difference: `api_key` is
        required the first time, because a provider with no key is not a
        configuration — storing one would make the assistant report itself
        available and then fail on the first question.

        The stored key wins over `OPENAI_API_KEY` and takes effect on the next
        request, with no restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentAssistantSettingsRequest'
      responses:
        '200':
          description: The stored settings, without the key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentStoredSetting'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The surface is closed (`FORBIDDEN`, with `details.reason`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: clearDeploymentAssistantSettings
      tags: [system]
      summary: Remove the stored model provider, falling back to the environment.
      responses:
        '204':
          description: No stored model provider remains.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The surface is closed (`FORBIDDEN`, with `details.reason`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/me:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Delete the signed-in user's own account.
      description: |
        Starts the account erasure (ADR-0030, decision 8). Self only, and
        structurally so: the subject is the session, and no path segment or body
        field can name another user.

        Guards, in order: a recent re-authentication (`REAUTH_REQUIRED`), and a
        `confirm` field that must equal the signed-in account's own email address,
        exactly.

        **Sites must be dealt with first.** The account cannot be deleted while
        it still holds sites that would be orphaned by its removal, and there are
        two such holds:

        - the user is the **billing owner** of a live site — someone has to keep
          paying for it, so either hand billing over
          (`POST /v1/sites/{site_id}/billing-owner/offer`, accepted by the
          successor) or delete the site;
        - the user is the **sole owner** of a live site — removing their
          membership would leave a site with no owner at all, so add another
          owner or delete the site.

        Either hold answers `409 ACCOUNT_DELETION_BLOCKED` with
        `details.blocking_sites`, each entry naming the site and which of the two
        reasons applies. A site that is already `deleting` or `deleted` never
        blocks.

        **A third hold exists only on a self-hosted deployment.** Where
        `DEPLOYMENT_SETTINGS` is enabled, the account that administers the
        deployment — the oldest live one, which is what the deployment settings
        surface authorizes against — cannot delete itself. The role is derived
        rather than granted, so it cannot be handed over, and deleting it would
        not move it: an erasure scrubs the `users` row into a tombstone rather
        than removing it and leaves `created_at` alone, so the role would stick
        to an identity that can never sign in again and the stored SMTP password
        and model-provider key could never be edited or cleared from the
        dashboard. The refusal is `409 ACCOUNT_DELETION_BLOCKED` carrying
        `details.reason: 'deployment_operator'` and **no** `blocking_sites`. It
        is checked ahead of the re-authentication and the confirmation, because
        proving intent does not change the answer.

        **There is no API remedy, and the refusal does not claim one.** This hold
        compares identities and never reads `deployment_settings`, so clearing
        the stored settings does not lift it. Moving an owner account is a
        database edit on the host that runs the deployment.

        This hold does not exist where `DEPLOYMENT_SETTINGS` is disabled. There
        the oldest account is only the first that signed up, nothing is stored
        against it, and its erasure is unaffected.

        The answer is `202`, never `200`: the erasure is a background state
        machine. It waits for those site deletions to finish, cancels the Stripe
        subscription (verified against Stripe, not assumed), then removes
        sessions, credentials, memberships, invitations, transfer offers and the
        subscription row, and finally scrubs the account itself.

        **The session stays valid for the few seconds until the job removes it.**
        Nothing about this response is a sign-out; clients should treat the `202`
        as final and stop using the session.

        **What survives, deliberately:** the `users` row itself remains as a
        non-identifying tombstone (its email becomes
        `deleted-{id}@tombstone.invalid`, its name empty, image and timezone
        `null`), because billing history on sites that were handed over belongs
        to those sites' owners and references it. The one-time-trial tombstone
        also survives — unlinked from the account, but still keyed on the email
        HMAC, so deleting an account does not mint a second free trial. Signing
        in again with the same address creates a **new, empty account**.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '202':
          description: The account deletion has started, or was already running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionAccepted'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            The session is not recent enough for this sensitive action
            (`REAUTH_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            Either sites still depend on this account
            (`ACCOUNT_DELETION_BLOCKED`, carrying `details.blocking_sites` — an
            array of `AccountDeletionBlockingSite`); or, on a self-hosted
            deployment, the account administers the deployment itself
            (`ACCOUNT_DELETION_BLOCKED`, carrying
            `details.reason: 'deployment_operator'` and no `blocking_sites`); or
            the supplied `Idempotency-Key` was already used with a different
            payload or is still in flight (`IDEMPOTENCY_CONFLICT`).

            The two `ACCOUNT_DELETION_BLOCKED` shapes are told apart by which
            detail is present, so a client that only understands
            `blocking_sites` renders the message and is not wrong about it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/me/preferences:
    get:
      operationId: getUserPreferences
      tags: [account]
      summary: The signed-in user's own account preferences.
      description: |
        Self only, and structurally so: the subject is the session, and no path
        segment or body field can name another user.

        This is the explicit read. The dashboard does not need it on load — the
        same `timezone` is on the Better Auth session response
        (`user.timezone`) that the app already fetches to know who is signed in,
        so the first chart can be drawn in the right clock with no extra round
        trip. Use this endpoint for a settings screen and after a write.
      responses:
        '200':
          description: The caller's preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      operationId: updateUserPreferences
      tags: [account]
      summary: Set or clear the signed-in user's timezone.
      description: |
        `timezone` must be present. Send an IANA identifier to store one, or
        `null` to clear the preference and return the account to the
        browser-detected default — clearing is a deliberate choice and is not the
        same as omitting the field, which is `VALIDATION_FAILED`.

        The identifier is validated against the runtime's own timezone database,
        not a pattern, so a well-formed but unknown zone is rejected here rather
        than stored and then failing every analytics read afterwards.

        This changes no analytics behaviour. Timezone remains a per-request query
        parameter on every analytics operation (docs snapshot 02 §18); this is
        the value the frontend sends there, not a server-side default applied
        behind the frontend's back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPreferencesRequest'
      responses:
        '200':
          description: The preferences as they now stand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/me/connected-apps:
    get:
      operationId: listConnectedApps
      tags: [account]
      summary: The OAuth clients the signed-in user has connected.
      description: |
        Self only, session-authenticated (ADR-0048 D4). Enumerated from the
        user's live grants — a client appears while any of its tokens has a
        refresh token that has not expired — grouped by client, with the scopes
        it holds rendered as human sentences. First-party clients (the CLI, the
        MCP server) and dynamically registered ones alike resolve to a display
        name rather than a raw id.

        Listed from tokens, not consents: the device flow (the CLI's login)
        writes a token and no consent row, so a consent-based list would miss
        every CLI grant.
      responses:
        '200':
          description: The caller's connected applications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAppList'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/me/connected-apps/{client_id}:
    parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
        description: The client to revoke, as listed by `GET /v1/me/connected-apps`.
    delete:
      operationId: revokeConnectedApp
      tags: [account]
      summary: Revoke the signed-in user's access for one OAuth client.
      description: |
        Deletes the caller's tokens **and** standing consents for the client, so
        the client cannot silently re-issue a token on its next authorize
        (ADR-0048 D4). Self only. `404` when the user has no such connection —
        a no-op reported as success would claim a connection was severed that
        never existed.
      responses:
        '204':
          description: The client's access was revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The user has no connection to that client (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: Sites the authenticated user is a member of.
      description: |
        Each entry carries the internal `site_id` used by every other operation,
        the public `slug`, the caller's `role` and whether the caller is this
        site's billing owner (docs snapshot 03 §8, §16).
      responses:
        '200':
          description: The caller's sites.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SiteSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createSite
      tags: [sites]
      summary: Create a site. No entitlement required; an unfunded site cannot ingest.
      description: |
        The caller becomes the site's first `owner` member and its
        `owner_user_id` (docs snapshot 05, D-008/D-009), and a
        `tracking_write` key is minted in the same transaction so onboarding can
        render the snippet without a second call.

        **A site is born `active`**, with a real tracking key and a real
        snippet, and it ingests from that instant. Nothing in this contract gates
        creation on anything but the caller's own session: how many sites a caller
        may hold, and what makes one stop ingesting, are questions a deployment
        that sells plans answers for itself — and such a deployment documents its
        own refusals on this path in its own document.

        `suspended` remains a state a site can be in, and the whole surface
        respects it: `POST /v1/events` refuses with `SITE_NOT_FOUND`, every
        analytics read answers `403 SITE_SUSPENDED`, and no public share surface
        will serve it. Nothing here *sets* it.

        Domains are not set here; configure the origin allowlist with
        `PATCH /v1/sites/{site_id}`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      # A grant needs `sites:write`. The site it creates is owned by the token's own user.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['sites:write']
      responses:
        '201':
          description: The site, and the tracking key minted with it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedSite'
        '400':
          description: |
            The slug or name failed validation, or the slug is already taken
            (`VALIDATION_FAILED`, with `details.issues` naming the field — a taken
            slug is reported as `{ field: 'slug', code: 'taken' }`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: |
            The supplied `Idempotency-Key` was already used with a different
            payload or is still in flight (`IDEMPOTENCY_CONFLICT`, the in-flight
            case carrying `details.reason = 'in_progress'`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites/resolve:
    get:
      operationId: resolveSiteSlug
      tags: [sites]
      summary: Resolve a public slug to an internal site id.
      description: |
        The one place a public `slug` becomes a `site_id`. Frontend routes use
        slugs; every resource operation uses the id (docs snapshot 03 §8).
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/SiteSlug'
      responses:
        '200':
          description: The resolved identifier pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteResolution'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No site with that slug is visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites/{site_id}:
    parameters:
      - name: site_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SiteId'
    get:
      operationId: getSite
      tags: [sites]
      summary: A single site by its internal id.
      responses:
        '200':
          description: The site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such site is visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateSite
      tags: [sites]
      summary: Update a site's name or origin allowlist. Requires `site:settings`.
      description: |
        A partial update: send `name`, `domains`, or both. An empty object is
        `VALIDATION_FAILED`. The slug is not editable here.

        `domains` has replace-set semantics — the list sent becomes the site's
        exact origin allowlist, which the collector enforces on every batch
        (docs snapshot 02 §7.1 item 4). An empty list means "unconfigured", which
        the collector reads as "accept any origin", not as a deny-all. A domain
        change bumps the site's config version, invalidating the tracker-config
        ETag and the collector's ingest-config cache; a name-only change does not.

        Authorized by the `site:settings` capability, which `owner` and `admin`
        hold and `viewer` does not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteRequest'
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      # A grant needs `sites:write`, and may send **only** `name` and `reporting_timezone`.
      # Any other key — `domains` above all — refuses the whole request with `FORBIDDEN`
      # before the handler runs, so a prompt injection cannot open a site's origin
      # allowlist (ADR-0048 D2).
      security:
        - sessionCookie: []
        - oauthAccessToken: ['sites:write']
      responses:
        '200':
          description: The updated site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SiteNotFound'
    delete:
      operationId: deleteSite
      tags: [sites]
      summary: Delete a site and everything stored for it. Requires `site:delete`.
      description: |
        Starts the fenced deletion (ADR-0030): the site immediately stops
        accepting events, every API key it holds is revoked, every cached read of
        it becomes unreachable and every open realtime stream is cut. The stores
        behind it — ClickHouse, Redis and the site-scoped Postgres rows — are
        purged by a resumable background job that verifies each target before the
        site becomes a tombstone.

        Guards, in order: membership, the owner-only `site:delete` capability, a
        recent re-authentication (`REAUTH_REQUIRED`), and a `confirm` field that
        must equal the site's current name.

        The response is `202`, never `200`: deletion is a state machine, not a
        request/response. Poll `GET /v1/sites/{site_id}` — the site reports
        `status: "deleting"` until the purge is verified, after which it is gone
        from `GET /v1/sites` and its id `404`s forever (a deleted site id is
        never reused).

        Idempotent in both halves. Sending `Idempotency-Key` replays the original
        answer; without one, a second call on a site already `deleting` still
        returns `202` with the *same* `deletion_request_id` rather than starting a
        second deletion.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSiteRequest'
      responses:
        '202':
          description: The deletion has started, or was already running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDeletionAccepted'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            The caller does not hold `site:delete` (`FORBIDDEN`) or the session is
            not recent enough for this sensitive action (`REAUTH_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/SiteNotFound'
        '409':
          description: |
            The supplied `Idempotency-Key` was already used with a different
            payload or is still in flight (`IDEMPOTENCY_CONFLICT`, the in-flight
            case carrying `details.reason = 'in_progress'`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites/{site_id}/keys:
    parameters:
      - name: site_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SiteId'
    get:
      operationId: listSiteApiKeys
      tags: [sites]
      summary: A site's API keys.
      description: |
        Never returns a private key's secret or any key's hash. A public tracking
        key exposes its full token (it is not a secret); a private key exposes
        only its prefix (docs snapshot 02 §20).
      responses:
        '200':
          description: The site's keys.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKeySummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createSiteApiKey
      tags: [sites]
      summary: Mint an API key. Requires the `credentials:manage` capability.
      description: |
        The response is the only time a private key's raw token is returned; it
        is stored hashed and never retrievable again (docs snapshot 02 §20).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: The created key, including its one-time raw token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiKey'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/sites/{site_id}/keys/{key_id}:
    parameters:
      - name: site_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SiteId'
      - name: key_id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeSiteApiKey
      tags: [sites]
      summary: Revoke an API key. Requires the `credentials:manage` capability.
      responses:
        '204':
          description: The key is revoked and no longer resolves.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such key on this site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/read/sites:
    parameters:
      - $ref: '#/components/parameters/SiteSelector'
    get:
      operationId: readSelectableSites
      tags: [read-key]
      summary: The sites this credential may select.
      description: |
        The one route M16 adds, and deliberately the same route for both
        credential kinds (ADR-0043, D3) — "which sites may you select" is the
        same question whether a person or a machine is asking, and a parallel
        OAuth-only endpoint is what ADR-0042 D9 forbids.

        - **An OAuth token** lists the user's live memberships. This is the exact
          set `X-OA-Site` will accept on the next request: the list and the check
          read the same table, so they cannot disagree.
        - **A private key** lists the one site it is bound to, as a one-element
          list — not an error and not an empty list, so a caller writes one code
          path for both. A key whose site has been torn down lists nothing.

        It exists because a human types `oa stats --site my-blog` and something
        has to turn a slug into an id. Served under `site:read`, the minimum both
        credentials have. Sites being deleted are omitted.
      security:
        - privateApiKey: []
        - oauthAccessToken: ['site:read']
      responses:
        '200':
          description: The selectable sites.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectableSiteList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/MissingScope'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/oauth/device/token:
    post:
      operationId: exchangeDeviceCode
      tags: [read-key]
      summary: Exchange an approved device code for an access token (RFC 8628 §3.4).
      description: |
        The one edge of the device flow the authorization-server library does not
        provide (ADR-0043, D13). Its own device token endpoint issues a **session**
        — a credential for the entire dashboard — so it is not mounted, and this
        issues a scoped OAuth token instead.

        Unauthenticated by construction: the device code *is* the credential.

        **This endpoint answers RFC 8628's error shape, not this API's error
        envelope**, and it is the only endpoint under `/v1` that does. A client
        written against the RFC has to branch on `authorization_pending` versus
        `slow_down`, and both arrive as `400` with `{ error, error_description }`.
        `authorization_pending` is the normal case and arrives once every five
        seconds until a human approves.

        The granted scope is re-read through the server's vocabulary on the way
        out: a device code carrying a scope this build cannot name yields the
        minimum rather than authority.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '200':
          description: An access token, its refresh token and the granted scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '400':
          description: |
            RFC 8628's typed refusal. Not this API's error envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenError'
        '429':
          description: |
            Polled far past the interval. Carries `Retry-After`, and the body's
            `error` is `slow_down` so a client that reads only the body still
            does the right thing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenError'

  /v1/oauth/register:
    post:
      operationId: registerOAuthClient
      tags: [read-key]
      summary: Register an OAuth client dynamically (RFC 7591).
      description: |
        The client-introduction step every MCP host performs against an unknown
        server (ADR-0047). Anonymous by design — RFC 7591's open registration:
        the clients that need this are exactly the ones with no prior
        relationship to this server — and rate-limited per address.

        **Public clients only.** `token_endpoint_auth_method` must be `none`;
        no registration ever receives a secret, and the authorization-code flow
        the registered client runs requires PKCE (S256). Redirect URIs must be
        `https`, or `http` on a loopback host (RFC 8252 §7.3), with no
        wildcards and no fragments.

        Registration introduces a client; it never widens scopes. The `scope`
        echoed back is the request intersected with what the server supports,
        and the ceiling that matters is the authorization server's own scope
        list, enforced at authorize time.

        **This endpoint answers RFC 7591's error shape, not this API's error
        envelope** — the same exception the device token exchange makes, for
        the same reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegistrationRequest'
      responses:
        '201':
          description: The registered client. No secret — the client is public.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRegistrationResponse'
        '400':
          description: RFC 7591 §3.2.2's typed refusal. Not this API's error envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRegistrationError'
        '429':
          description: |
            Too many registrations from one address. Carries `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRegistrationError'

  /v1/read/site:
    parameters:
      - $ref: '#/components/parameters/SiteSelector'
    get:
      operationId: readSiteContext
      tags: [read-key]
      summary: The site a private read key belongs to, and how to install its tracker.
      description: |
        Authenticated by a private read key (bearer), not a session. A public
        tracking key is write-only and is rejected here — the tracking key is
        accepted on no read endpoint (docs snapshot 02 §20).

        This is the site-selection contract for an unattended integration: the
        plugin asks which site its key belongs to and renders the name, rather
        than being configured with a site id it could get wrong. `install`
        carries what it needs to inject the tracker without a dashboard session
        (ADR-0042, D8).

        Served under the minimum scope, `site:read`, which every private key
        has — including keys minted before scopes existed.
      security:
        - privateApiKey: []
        - oauthAccessToken: ['site:read']
      responses:
        '200':
          description: The selected site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteReadContext'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/SiteNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/read/revenue/summary:
    parameters:
      - $ref: '#/components/parameters/SiteSelector'
      - $ref: '#/components/parameters/RangeFrom'
      - $ref: '#/components/parameters/RangeTo'
      - $ref: '#/components/parameters/QueryTimezone'
      - $ref: '#/components/parameters/Compare'
      - $ref: '#/components/parameters/RevenueResolution'
    get:
      operationId: readRevenueSummary
      tags: [read-key]
      summary: Revenue totals for the selected site. Session or OAuth, and owner-only.
      description: |
        The same numbers, in the same shape, as
        `GET /v1/sites/{site_id}/revenue/summary`.

        **Two checks, and neither substitutes for the other** (ADR-0043, D4/D5).
        The `revenue:read` *scope* says the token's holder agreed to let this
        client ask about revenue at all. The `revenue:read` *capability* — a role
        on a membership, owner-only since ADR-0036 CP7 — says whether this person
        may see it. A token carrying the scope whose user is an `admin` on the
        selected site therefore reads nothing: the scope did not grant it, it only
        failed to forbid it. **A scope is a ceiling, never a floor.**

        Closed to private keys **permanently**, and `403` names the reason: a key
        resolves to a site and has no membership, so there is no role to check,
        and a capability check with nothing behind it is what ADR-0042 D3 refused
        when it declined to define this scope at all.
      # ADR-0049 D3 widened `SESSION_SCOPES` by exactly one string, so the
      # dashboard's own session reads revenue here too. A private read key is
      # still not among the credentials below, and permanently: a key resolves
      # to a site and carries no membership, so the owner-only capability that
      # decides this route would have nothing to check (ADR-0042 D3).
      security:
        - sessionCookie: []
        - oauthAccessToken: ['revenue:read']
      responses:
        '200':
          description: Range totals, the comparison period, and the unconverted remainder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueSummaryResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRange'
          # RANGE_TOO_LARGE shares this status; see ADR-0043 D7.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrSuspended'
        '404':
          $ref: '#/components/responses/SiteNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /v1/read/revenue/timeseries:
    parameters:
      - $ref: '#/components/parameters/SiteSelector'
      - $ref: '#/components/parameters/RangeFrom'
      - $ref: '#/components/parameters/RangeTo'
      - $ref: '#/components/parameters/QueryTimezone'
      - $ref: '#/components/parameters/RevenueResolution'
    get:
      operationId: readRevenueTimeseries
      tags: [read-key]
      summary: Revenue per bucket for the selected site. Session or OAuth, and owner-only.
      description: |
        The same shape as `GET /v1/sites/{site_id}/revenue/timeseries`, behind the
        same two checks as `/v1/read/revenue/summary`.

        **`transactions` and its `journey` are deliberately absent from this
        surface.** They return per-customer rows — an email, a customer id, an
        order id — and this surface's callers are an assistant's tool loop and a
        terminal that may be logged or shared on a screen. Docs snapshot 02 §21
        puts PII redaction on the assistant's own list; handing it customer rows
        through a different door would be the same exposure one milestone early.
        The row-level reads stay where a human is looking at them.
      # ADR-0049 D3 widened `SESSION_SCOPES` by exactly one string, so the
      # dashboard's own session reads revenue here too. A private read key is
      # still not among the credentials below, and permanently: a key resolves
      # to a site and carries no membership, so the owner-only capability that
      # decides this route would have nothing to check (ADR-0042 D3).
      security:
        - sessionCookie: []
        - oauthAccessToken: ['revenue:read']
      responses:
        '200':
          description: Revenue per bucket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueTimeseriesResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRange'
          # RANGE_TOO_LARGE shares this status; see ADR-0043 D7.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrSuspended'
        '404':
          $ref: '#/components/responses/SiteNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /v1/read/realtime/token:
    parameters:
      - $ref: '#/components/parameters/SiteSelector'
    post:
      operationId: readRealtimeToken
      tags: [read-key]
      summary: Mint a realtime stream token for the selected site. OAuth only.
      description: |
        The same token `POST /v1/sites/{site_id}/realtime/token` mints, from the
        same subject and anchored to the same access epoch — because it *is* the
        same mechanism (ADR-0043, D5). The token is minted for the OAuth user, so
        `removeMember`'s existing `realtime.access_revoked` outbox event revokes
        it exactly as it revokes a dashboard session's, and nothing new was
        invented to make that true.

        Closed to private keys **permanently**. A key has no subject to mint
        under and no membership to revoke against, so granting it realtime would
        mean a second revocation system for a credential whose revocation is
        already "delete the row".

        Not registered at all on a deployment with no realtime signing key or
        cache, so the path answers `404` there — which is true, rather than a
        `503` that suggests waiting.
      security:
        - oauthAccessToken: ['realtime:read']
      responses:
        '200':
          description: A freshly minted realtime token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTokenResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/MissingScopeOrSuspended'
        '404':
          $ref: '#/components/responses/SiteNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: |
            The realtime cache could not seed the access epoch, so no token was
            minted. A token without its epoch is one the gateway fails closed on.
          content:
            application/json:
              schema:
