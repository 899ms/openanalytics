        '404':
          $ref: '#/components/responses/SiteNotFound'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /v1/sites/{site_id}/analytics/funnel:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/RangeFrom'
      - $ref: '#/components/parameters/RangeTo'
      - $ref: '#/components/parameters/QueryTimezone'
      - $ref: '#/components/parameters/FunnelSteps'
      - $ref: '#/components/parameters/FunnelWindowMs'
      - $ref: '#/components/parameters/FunnelScope'
    get:
      operationId: getAnalyticsFunnel
      tags: [analytics]
      summary: An ordered multi-step funnel over the canonical event facts.
      description: |
        Ordered steps matched per unit within a window (docs snapshot 02 §15, plan
        Milestone 8 item 7). The unit is the resolved visitor identity (`scope=
        visitor`) or that identity paired with the client session hint (`scope=
        session`). Each event's funnel key is the page path for a pageview and the
        event name otherwise. Steps are ordered by `(occurred_at, event_id)` — a
        deterministic tie-break. The synchronous range is bounded; a larger range
        is an async job (a documented follow-up).
      responses:
        '200':
          description: Per-step unit counts and conversion rates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsFunnelResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRange'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SiteSuspended'
        '404':
          $ref: '#/components/responses/SiteNotFound'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /v1/sites/{site_id}/analytics/recent-visitors:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/RecentWindowHours'
      - $ref: '#/components/parameters/QueryTimezone'
      - $ref: '#/components/parameters/RecentVisitorsLimit'
    get:
      operationId: getAnalyticsRecentVisitors
      tags: [analytics]
      summary: Individual visitors seen in a short recent window.
      description: |
        The hours-deep companion to the realtime stream's live feed (ADR-0024).
        The stream shows what is happening and forgets it; this shows who was
        here in the last `hours` hours, one row per visitor, newest last-seen
        first.

        `visitor` is the D-102 anonymous hash (ADR-0036), which **rotates at
        UTC midnight** — a window spanning midnight therefore lists a single
        person twice, once under each hash, and the two cannot be linked. A
        visitor who called `identify()` is still **one row**, keyed on the same
        anonymous hash: the identify event carries both ids, so it folds onto
        the person's row instead of minting a second one.

        Read from the event facts at the leading edge of ingest, so the result is
        provisional: sessions are not finalized and late events can still land.
        `meta.provisional` is always true and `meta.freshness` says how current
        the underlying data is. Never served on the public dashboard.

        For a caller holding `revenue:read` (owner-only) each row may carry a
        `revenue` marker — attributed revenue within this same window. For any
        other member the field is absent, never zero (see `VisitorRevenue`).
      responses:
        '200':
          description: Recent visitors, newest last-seen first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsRecentVisitorsResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRange'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SiteSuspended'
        '404':
          $ref: '#/components/responses/SiteNotFound'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /v1/sites/{site_id}/analytics/visitor:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/VisitorHash'
      - $ref: '#/components/parameters/RecentWindowHours'
      - $ref: '#/components/parameters/QueryTimezone'
    get:
      operationId: getAnalyticsVisitor
      tags: [analytics]
      summary: One visitor’s page-by-page trail over the same recent window.
      description: |
        The detail behind a row of `recent-visitors` (ADR-0024): every page view
        the visitor made inside the window, split into sessions and ordered
        oldest-first within each session, sessions newest-first.

        Sessions are grouped by the client session hint — the same key
        `scope=session` funnels aggregate by — so "a session" means one thing
        across the API. That hint is not the canonical analytics session the
        sessionizer rebuilds; it is the client-side grouping, which is what a
        live trail can honestly show.

        An unknown or expired `hash` is not an error: it is a visitor with no
        sessions in the window, and answers 200 with an empty list. Provisional,
        for the same reason `recent-visitors` is. Never served on the public
        dashboard.

        For a caller holding `revenue:read` (owner-only) the response also
        carries `revenue` and `revenue_events` — the visitor's attributed money
        within the same window, in the journey vocabulary the transaction view
        renders. Absent, never zero or empty, for any other member.
      responses:
        '200':
          description: The visitor’s sessions and the pages in each.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsVisitorResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRange'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SiteSuspended'
        '404':
          $ref: '#/components/responses/SiteNotFound'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /v1/public/{share_slug}/overview:
    parameters:
      - $ref: '#/components/parameters/ShareSlugPath'
      - $ref: '#/components/parameters/RangeFrom'
      - $ref: '#/components/parameters/RangeTo'
      - $ref: '#/components/parameters/QueryTimezone'
    get:
      operationId: getPublicOverview
      tags: [public]
      summary: Public range totals for an opted-in shared dashboard.
      description: |
        Unauthenticated, addressed by an opaque share slug. Served only when the
        site has opted the overview into public sharing and is not
        `suspended`. Rate-limited per (IP, slug).

        Carries `PublicOverviewTotals`, not the private `OverviewTotals`: the
        billable-event count is a billing quantity and never crosses this
        boundary (ADR-0039, decision 4 as amended 2026-08-04).
      security: []
      responses:
        '200':
          description: Public range totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOverviewResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRange'
        '404':
          $ref: '#/components/responses/ShareNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /v1/public/{share_slug}/geography:
    parameters:
      - $ref: '#/components/parameters/ShareSlugPath'
      - $ref: '#/components/parameters/RangeFrom'
      - $ref: '#/components/parameters/RangeTo'
      - $ref: '#/components/parameters/QueryTimezone'
      - $ref: '#/components/parameters/TopNLimit'
    get:
      operationId: getPublicGeography
      tags: [public]
      summary: Public geography with cities coarsened for privacy.
      description: |
        City labels are withheld for cities below the privacy threshold; their
        counts fold into a country-level bucket with `city: null`. Applied after
        authorization, so a country/city query parameter cannot bypass it
        (docs snapshot 02 §20).
      security: []
      responses:
        '200':
          description: Public geography, city-coarsened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicGeographyResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRange'
        '404':
          $ref: '#/components/responses/ShareNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /v1/public/{share_slug}/timeseries:
    parameters:
      - $ref: '#/components/parameters/ShareSlugPath'
      - $ref: '#/components/parameters/RangeFrom'
      - $ref: '#/components/parameters/RangeTo'
      - $ref: '#/components/parameters/QueryTimezone'
      - $ref: '#/components/parameters/TimeseriesResolution'
    get:
      operationId: getPublicTimeseries
      tags: [public]
      summary: Public traffic chart for an opted-in shared dashboard.
      description: |
        The same shape and the same numbers as
        `GET /v1/sites/{site_id}/analytics/timeseries`; nothing on that response
        is withheld here (ADR-0039, D4). Served only when the site has opted
        `share_timeseries` in and is not `suspended`.

        **`resolution` is accepted here** (ADR-0039, D8) with exactly the private
        endpoint's validation, and it is the only public read that takes it.
        Without it a "Today" range — a full 24 hours — resolved to `minute`
        grain and returned ~1 440 buckets, because automatic selection takes
        `minute` for any span up to and including 24 hours. Naming the grain
        exposes nothing new: these buckets were already being served, only at a
        grain the caller could not ask for. It also unlocks `week`, which
        automatic selection never picks at any span, so a shared 12-month view
        can match what the owner sees.

        A value outside `minute|hour|day|week` is `400 VALIDATION_FAILED`; one of
        those four that this range or timezone cannot honestly serve is
        `400 RESOLUTION_NOT_AVAILABLE`. `meta.resolution` always reports what was
        actually served, so a client never has to assume.

        **`compare` is still not accepted** — the public board draws no deltas.
        This response keeps the `comparison` field of the shared timeseries
        shape, and it is **always `null`** here, as is `meta.comparison_range`.
        (The public *overview* is the surface that dropped its `comparison`
        field outright, in this ADR's 2026-08-04 amendment; the timeseries did
        not.)
      security: []
      responses:
        '200':
          description: Public traffic series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTimeseriesResponse'
        '400':
          description: |
            The range failed validation (`VALIDATION_FAILED`), `resolution` was
            not one of the four grains (`VALIDATION_FAILED`), or the requested
            grain cannot be served for this range/timezone
            (`RESOLUTION_NOT_AVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/ShareNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /v1/public/{share_slug}/sessions:
    parameters:
      - $ref: '#/components/parameters/ShareSlugPath'
      - $ref: '#/components/parameters/RangeFrom'
      - $ref: '#/components/parameters/RangeTo'
      - $ref: '#/components/parameters/QueryTimezone'
    get:
      operationId: getPublicSessions
      tags: [public]
      summary: Public bounce rate and visit duration for an opted-in shared dashboard.
      description: |
        `PublicSessionsResponse` is `AnalyticsSessionsResponse` **without
        `layering`** — the finalizer's revisable-window bounds are our
        infrastructure's state, not the site's (ADR-0039, D4). The totals and the
        series are identical to the private surface's. Served only when the site
        has opted `share_sessions` in and is not `suspended`.
      security: []
      responses:
        '200':
          description: Public session metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSessionsResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRange'
        '404':
          $ref: '#/components/responses/ShareNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /v1/public/{share_slug}/pages:
    parameters:
      - $ref: '#/components/parameters/ShareSlugPath'
      - $ref: '#/components/parameters/RangeFrom'
      - $ref: '#/components/parameters/RangeTo'
      - $ref: '#/components/parameters/QueryTimezone'
      - $ref: '#/components/parameters/TopNLimit'
    get:
      operationId: getPublicPages
      tags: [public]
      summary: Public top pages for an opted-in shared dashboard.
      description: |
        The same shape and the same numbers as the private pages report
        (ADR-0039, D4). Served only when the site has opted `share_pages` in and
        is not `suspended`.

        **There is no low-count suppression here, deliberately** (ADR-0039, D3).
        The geography rule exists because a city plus a small count narrows
        toward a person; a path is not a person — it is a URL the site owner
        published. What this surface does disclose is the site's URL inventory,
        and the instrument for that is the `share_pages` opt-in itself: a
        threshold would hide a quiet private path while leaving a busy one in
        plain sight, which is worse than not pretending.
      security: []
      responses:
        '200':
          description: Public top pages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPagesResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRange'
        '404':
          $ref: '#/components/responses/ShareNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /v1/public/{share_slug}/sources:
    parameters:
      - $ref: '#/components/parameters/ShareSlugPath'
      - $ref: '#/components/parameters/RangeFrom'
      - $ref: '#/components/parameters/RangeTo'
      - $ref: '#/components/parameters/QueryTimezone'
      - $ref: '#/components/parameters/TopNLimit'
    get:
      operationId: getPublicSources
      tags: [public]
      summary: Public traffic sources for an opted-in shared dashboard.
      description: |
        The same shape and the same numbers as the private sources report
        (ADR-0039, D4). Served only when the site has opted `share_sources` in
        and is not `suspended`.

        No low-count suppression (ADR-0039, D3): `referrer_domain` is a site that
        linked here and published that link, and the UTM triple is a tag the
        owner or their partner put in a URL they handed out. Both describe a
        campaign, not a visitor.
      security: []
      responses:
        '200':
          description: Public traffic sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSourcesResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRange'
        '404':
          $ref: '#/components/responses/ShareNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /v1/public/{share_slug}/devices:
    parameters:
      - $ref: '#/components/parameters/ShareSlugPath'
      - $ref: '#/components/parameters/RangeFrom'
      - $ref: '#/components/parameters/RangeTo'
      - $ref: '#/components/parameters/QueryTimezone'
      - $ref: '#/components/parameters/TopNLimit'
    get:
      operationId: getPublicDevices
      tags: [public]
      summary: Public device, browser and OS breakdown for an opted-in shared dashboard.
      description: |
        The same shape and the same numbers as the private devices report
        (ADR-0039, D4). Served only when the site has opted `share_devices` in
        and is not `suspended`.

        No low-count suppression (ADR-0039, D3): `device_type` is a four-value
        enum and `browser`/`os` are classifier families (`chrome`, `macos`), not
        versions or user-agent text, and the row carries no location, path or
        time to join them against.
      security: []
      responses:
        '200':
          description: Public device breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDevicesResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRange'
        '404':
          $ref: '#/components/responses/ShareNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /v1/public/{share_slug}/site:
    parameters:
      - $ref: '#/components/parameters/ShareSlugPath'
    get:
      operationId: getPublicSiteIdentity
      tags: [public]
      summary: What a shared board needs to name and draw itself.
      description: |
        The public site-identity read (ADR-0044). Not an analytics read: it takes
        no range, no timezone and no limit, runs no query, and carries no `meta`.

        **Two fields are always present and two are conditional**, and the
        condition is *absence*, never `null`:

        - `reporting_timezone` and `first_event_at` are **rendering facts**, not
          identity, and are served to any live slug. Without the first, two
          viewers in two zones cut different buckets behind one link and neither
          sees what the owner sees; without the second, "All time" has no anchor
          a visitor can reach.
        - `display_name` and `favicon_domain` are **identity** and appear only
          when the owner has opted `share_identity` in. When the flag is off the
          two keys are **absent from the response entirely** — not `null`.
          Present-and-null would say "this site has no name", which is false and
          is a different statement from "you may not know" (the owner-only
          by-absence idiom of ADR-0036 CP7).

        **Live** means the share is enabled, the site is not `suspended`,
        and at least one *publishing* surface is on (`share_identity` itself does
        not count — a share whose board renders nothing has nothing for this read
        to describe). Anything else is the same `404` a wrong slug gets, byte for
        byte apart from `request_id`, so this read cannot be used to confirm that
        a slug exists.

        **Cache it hard and do not poll it.** The answer changes when an owner
        renames their site or changes its clock, which is roughly never, and it
        counts against the same per-(IP, slug) budget as the seven analytics
        reads.
      security: []
      responses:
        '200':
          description: The shared site's render facts, plus its identity if published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSiteIdentity'
        '404':
          $ref: '#/components/responses/ShareNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/widget/{widget_id}:
    parameters:
      - $ref: '#/components/parameters/WidgetIdPath'
    get:
      operationId: getPublicWidget
      tags: [widgets]
      summary: The one answer a widget publishes, and what to draw it as.
      description: |
        Unauthenticated, addressed by an opaque widget id (ADR-0045). Served only
        while the widget is `enabled` and its site is `active`.

        **This operation takes no query parameters.** Surface, range, row limit
        and timezone are all stored configuration, so there is nothing for a
        caller to supply and nothing to validate — no `400` can name the
        caller's input. (One server-derived refusal exists: an `all` widget on
        a site that has never ingested an event answers the underlying read's
        `400 RESOLUTION_NOT_AVAILABLE` until the first event lands — ADR-0045
        D10's dated correction; embeds render any non-`200` as the empty
        state.) Docs
        snapshot 02 §20's "read widgets can see only an explicit public metric
        and date range" in its strongest form: not an allowlist checked per
        request, but a request with no room to carry anything.

        **The response is a two-key envelope, and `data` is a public share
        response unchanged.** `widget.surface` says which of the eight shapes
        `data` is, because three of them (`pages`, `sources`, `devices`) are
        `{meta, items}` and are not distinguishable by shape — an opaque id is
        opaque to a renderer too. Everything under `data` is byte-identical to
        what `/v1/public/{share_slug}/…` serves, so one component renders a share
        card and a widget from one code path (ADR-0045, D3).

        **The range is resolved server-side, in the site's reporting zone**
        (`sites.reporting_timezone`, which every site has) — a widget has no viewer
        whose clock could be asked, and the same embed must show two readers the
        same numbers. `meta.timezone` reports what was used. `all` is anchored at
        the site's first event, never at its creation date (ADR-0044, D7). The
        grain is a fixed function of the range and is never a parameter
        (ADR-0045, D10).

        **Origin policy.** `Access-Control-Allow-Origin` is echoed only for an
        origin on this widget's allowlist, with `Vary: Origin` and never
        `Access-Control-Allow-Credentials` — there is no credential to send. An
        unlisted origin gets the same body with **no** CORS header, which the
        browser discards. Stated plainly because it is easy to over-read: an
        origin allowlist is a browser-enforced rendering policy, not an
        authentication boundary. Whoever holds the id can read this from
        anywhere; the allowlist decides where a *browser* will paint it.

        **Cache and revocation.** `Cache-Control: public, max-age=60`
        (`10` on `realtime`, where a minute-old "now" is a wrong number rather
        than a stale one). Revocation is immediate at the origin — the row is read
        on every request that reaches us — and honoured **within `max-age`** at
        any browser or shared cache. That bound is the honest answer to "I
        disabled it, is it gone?" (ADR-0045, D12; the ADR-0022 form).
      security: []
      responses:
        '200':
          description: The widget's descriptor and its public payload.
          headers:
            Cache-Control:
              description: |
                `public, max-age=60` on the seven historical surfaces,
                `public, max-age=10` on `realtime`. Also the stated staleness
                bound on revocation.
              schema:
                type: string
            Access-Control-Allow-Origin:
              description: |
                The request's own `Origin`, echoed, and present only when that
                origin is on this widget's allowlist. Never `*` as a response
                value, even when the widget's list is `["*"]` — the echo is what
                keeps a shared cache from handing one origin's header to another.
              schema:
                type: string
            Vary:
              description: Always contains `Origin`, matched or not.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWidgetResponse'
        '404':
          $ref: '#/components/responses/WidgetNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /v1/sites/{site_id}/public-dashboard:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
    get:
      operationId: getPublicDashboardSettings
      tags: [analytics]
      summary: A site's public-dashboard sharing settings.
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['analytics:read']
      responses:
        '200':
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDashboardSettings'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SiteNotFound'
    put:
      operationId: updatePublicDashboardSettings
      tags: [analytics]
      summary: Enable, disable or reconfigure public sharing (owner only).
      description: |
        Public sharing is off by default and opts in per surface (overview,
        geography). Enabling mints an opaque share slug distinct from the internal
        `site_id`; the slug can be rotated (docs snapshot 02 §20).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublicDashboardRequest'
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      # Rotating the slug revokes the old link — the safe direction.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['share:write']
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDashboardSettings'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SiteNotFound'

  /v1/sites/{site_id}/ingest-settings:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
    get:
      operationId: getSiteIngestSettings
      tags: [sites]
      summary: What the site's browsers are configured to do (owner or admin).
      description: |
        The stored half of `GET /v1/tracker/config`: the site timezone, the
        query keys stripped in the browser, the heatmap sampling fraction, the
        realtime interval, the signal feature flags and `attributed_revenue`.

        A site that has never written these has no settings row at all, and this
        endpoint answers with the product defaults rather than a 404 — that is
        the state most sites are in, and it is not an error.

        Session only, deliberately: an OAuth grant cannot reach it, so shipping
        this writer adds no scope to the MCP surface (ADR-0048).
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current settings, or the defaults when no row exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteIngestSettings'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SiteNotFound'
    patch:
      operationId: updateSiteIngestSettings
      tags: [sites]
      summary: Change what the site's browsers do (owner or admin).
      description: |
        Every field is optional and absent means "leave it alone"; an empty body
        is a `400` rather than a no-op, matching `PATCH /v1/sites/{site_id}`.

        **Any accepted write bumps `sites.config_version`**, which is what
        invalidates the tracker-config ETag, the CDN copy, the browser's own
        cached copy and the collector's ingest-config cache together (ADR-0008).
        The new `config_version` is in the response, so a caller can tell that
        its change is the one browsers will now fetch.

        `attributed_revenue` is the switch ADR-0064 D4a describes: with it off,
        no browser sends the `order_id` linking hint, from anybody. It is off by
        default for every site created after 2026-08-13; sites that had already
        connected a revenue provider were backfilled to `true` (Postgres 0045).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteIngestSettingsRequest'
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The settings as stored, with the bumped `config_version`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteIngestSettings'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SiteNotFound'

  /v1/sites/{site_id}/widgets:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
    get:
      operationId: listSiteWidgets
      tags: [widgets]
      summary: A site's widgets. Readable by every member.
      description: |
        Configuration only; this endpoint computes nothing and returns no
        numbers. What a widget publishes is read anonymously at
        `GET /v1/widget/{widget_id}`.

        Every member may read the list: knowing what a site publishes is not a
        privilege, and a viewer who cannot see the widgets cannot tell that a
        number is on a public page.
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['analytics:read']
      responses:
        '200':
          description: The site's widgets, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Widget'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/SiteNotFound'
    post:
      operationId: createSiteWidget
      tags: [widgets]
      summary: Create a widget. Requires the `site:settings` capability.
      description: |
        Mints an opaque widget id — 96 random bits, never an encoding of the
        `site_id` — and returns the embed URL and snippet built from it.

        `allowed_origins` is **required and has no default**, because an embed's
        allowlist must be a choice rather than an omission: `[]` is an explicit
        "nowhere yet" and renders in no browser, and `["*"]` is an explicit
        "anywhere" (accepted only alone). See `WidgetOrigin`.

        Bounds are the ones the read enforces, so a widget that saves is a widget
        that renders: `range` is required for the seven historical surfaces and
        refused for `realtime`; `limit` is accepted only on `pages`, `sources`,
        `devices` and `geography`. Over the flat per-site cap of 50 is
        `400 VALIDATION_FAILED` with `details.reason: widget_budget_exceeded` —
        one cap for every plan, because it bounds a settings screen rather than
        pricing anything (ADR-0045, D9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWidgetRequest'
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['widgets:write']
      responses:
        '201':
          description: The created widget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SiteNotFound'

  /v1/sites/{site_id}/widgets/{widget_id}:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/WidgetIdPath'
    get:
      operationId: getSiteWidget
      tags: [widgets]
      summary: One widget's configuration. Readable by every member.
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['analytics:read']
      responses:
        '200':
          description: The widget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No widget with this id on this site (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateSiteWidget
      tags: [widgets]
      summary: Change a widget. Requires the `site:settings` capability.
      description: |
        A partial update; an empty body is refused. Setting `enabled: false` is
        the reversible revoke — the widget stops answering at the origin
        immediately and within its `max-age` at any cache that holds a copy.

        **`surface` cannot be changed**, and is not a field of this request. It is
        the one property whose change alters *what is published* rather than how
        much of it: a widget created as `overview` and edited into `pages` would
        start publishing the site's URL inventory on a page that already carries
        the old embed, without anyone touching that page. Changing a surface means
        creating a widget, which costs a new id — the correct price, since the
        snippet has to be re-pasted for the renderer to draw the right thing
        (ADR-0045, D2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWidgetRequest'
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      # `enabled: false` is the reversible take-down; widget deletion has no grant row,
      # because a widget id is never reissued.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['widgets:write']
      responses:
        '200':
          description: The updated widget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No widget with this id on this site (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteSiteWidget
      tags: [widgets]
      summary: Delete a widget permanently. Requires the `site:settings` capability.
      description: |
        The permanent revoke, and it is a hard delete: the row is gone, the id is
        never reissued, and every embed carrying it answers the same `404` an
        invented id gets. Use `enabled: false` for a pause you intend to undo.

        **Not idempotent**, unlike the funnel archive: a repeat is `404`. That
        endpoint's own reasoning drew the line — archiving is soft and a linked
        chart must not dangle, "unlike an API-key or invite revocation". This *is*
        a revocation of a public credential, and a `204` for an id that no longer
        exists tells an operator checking whether they revoked the right thing
        nothing at all.
      responses:
        '204':
          description: The widget is gone and its id resolves to nothing.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No widget with this id on this site (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites/{site_id}/funnels:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
    get:
      operationId: listSiteFunnels
      tags: [analytics]
      summary: A site's saved funnel definitions. Readable by every member.
      description: |
        Definitions only; this endpoint computes nothing and returns no counts.
        **Computing a stored funnel is a call to
        `GET /v1/sites/{site_id}/analytics/funnel` with the definition's `steps`,
        `scope` and `window_ms`**, plus the range you want — that endpoint is
        unchanged and remains the only way a funnel is calculated.

        Archived definitions are excluded unless `include_archived=true`. A live
        definition has `archived_at: null`.
      parameters:
        - name: include_archived
          in: query
          required: false
          description: Include archived definitions alongside the live ones.
          schema:
            type: boolean
            default: false
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['analytics:read']
      responses:
        '200':
          description: The site's funnel definitions, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FunnelDefinition'
