      operationId: getAnalyticsTimeseries
      tags: [analytics]
      summary: Events, pageviews and unique visitors bucketed over time.
      description: |
        The bucket grain (`minute`/`hour`/`day`) is chosen from the span. Every
        timezone is served: the rollups compose from a fifteen-minute atom, and
        every IANA offset in force is a whole number of those (docs snapshot 02
        §15, ADR-0079). A range whose offset is not — the last zone on such an
        offset left it in 1979 — returns `RESOLUTION_NOT_AVAILABLE` rather than
        a misattributed answer.

        `resolution` overrides that choice and additionally offers `week` — the
        ISO week, Monday start, in the request timezone — which automatic
        selection never picks on its own. A forced grain the range or timezone
        cannot honestly serve is refused with `RESOLUTION_NOT_AVAILABLE` rather
        than silently downgraded. `meta.resolution` always reports the grain the
        answer was actually served at.
      responses:
        '200':
          description: A time series, with freshness and (optionally) a comparison series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsTimeseriesResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRange'
        '401':
