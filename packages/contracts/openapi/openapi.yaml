  /v1/sites/{site_id}/members:
    parameters:
      - name: site_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SiteId'
    get:
      operationId: listSiteMembers
      tags: [sites]
      summary: A site's members. Any member may view the team.
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      # `team:read` rather than `site:read`, because this body carries email addresses.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['team:read']
      responses:
        '200':
          description: The site's members.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SiteMember'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No such site is visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites/{site_id}/members/{user_id}:
    parameters:
      - name: site_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SiteId'
      - name: user_id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateSiteMemberRole
      tags: [sites]
      summary: Change a member's role. Requires the `team:manage` capability.
      description: |
        Setting the role a member already holds is a no-op success and writes no
        audit row.

        Beyond `team:manage`, one extra rule is enforced: **only a member whose
        own role is `owner` may grant or revoke the `owner` role**. Without it an
        `admin` — who holds `team:manage` — could promote themselves to owner,
        which is a privilege escalation. An `admin` attempting either answers
        `403 FORBIDDEN`.

        Two site invariants are enforced by deferred database triggers, so they
        hold under concurrency: a site must keep at least one owner
        (`400 VALIDATION_FAILED`), and the billing owner cannot be demoted below
        `owner` (`409 BILLING_OWNER_SUCCESSOR_REQUIRED` — transfer billing first,
        the same successor-or-delete flow as removing the billing owner; docs
        snapshot 05, D-008…D-011).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: The member's role after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMember'
        '400':
          description: |
            The role is not a valid site role, or the change would leave the site
            without an owner (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            The caller lacks `team:manage`, or is an `admin` trying to grant or
            revoke the `owner` role (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: |
            No such site is visible to the caller (`SITE_NOT_FOUND`), or the
            target user is not a member of this site (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            The target is this site's billing owner and cannot be demoted below
            `owner` until billing is transferred
            (`BILLING_OWNER_SUCCESSOR_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: removeSiteMember
      tags: [sites]
      summary: Remove a member. Requires the `team:manage` capability.
      description: |
        The last owner and the billing owner cannot be removed
        (`VALIDATION_FAILED` / `BILLING_OWNER_SUCCESSOR_REQUIRED`); the
        billing-owner cutover is Milestone 3.
      responses:
        '204':
          description: The member is removed.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The billing owner cannot be removed without a successor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites/{site_id}/invites:
    parameters:
      - name: site_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SiteId'
    get:
      operationId: listSiteInvites
      tags: [sites]
      summary: A site's actionable invites. Requires the `team:manage` capability.
      description: |
        Every invitation there is still something to do about: `pending` ones,
        and `expired` ones whose expiry fell within the last 30 days. Both can be
        revoked, and both can be resent — an expired row is resent by
        `resendSiteInvite`, which revives it with a fresh token.

        Expired rows are returned rather than hidden because hiding them made a
        dead end: the row still held the "one live invite per address" slot, so
        `createSiteInvite` answered 409 about an invitation the manager could
        not see, revoke or resend.

        Accepted and revoked invitations are settled history and are not
        returned. Lapsed invitations are settled to `expired` before the list
        is read, so a `pending` row past its `expires_at` can only appear in
        the one-statement window between the sweep and the read.

        The invited email is returned because a team manager legitimately needs to
        see who was invited; it is still never written to the audit trail or to a
        log line (AGENTS.md).
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      # Reading invites only; creating or revoking one has no grant row.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['team:read']
      responses:
        '200':
          description: The site's pending and recently expired invites.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SiteInvite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SiteNotFound'
    post:
      operationId: createSiteInvite
      tags: [sites]
      summary: Invite a user. Requires the `team:manage` capability.
      description: |
        The acceptance token is emailed, never returned here. Acceptance is at
        `POST /v1/invites/accept`.

        An invitation that has lapsed no longer blocks a new one: the server
        settles expired invitations before inserting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: The invite was created and the email enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCreated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            Two distinct refusals, told apart by `error.code`:

            - `IDEMPOTENCY_CONFLICT` — a live invitation for this address already
              exists. Revoke or resend the one in `listSiteInvites`.
            - `ALREADY_MEMBER` — the address already belongs to a member of this
              site. There is nothing to send.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'

  /v1/sites/{site_id}/invites/{invite_id}:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - name: invite_id
        in: path
        required: true
        description: The invite to revoke, as returned by `listSiteInvites`.
        schema:
          type: string
    delete:
      operationId: revokeSiteInvite
      tags: [sites]
      summary: Revoke a pending or expired invite. Requires the `team:manage` capability.
      description: |
        Marks the invitation `revoked`, after which its emailed token can no
        longer be redeemed at `POST /v1/invites/accept`. An `expired` invite
        can be revoked too - the list shows expired rows, and a row on screen
        must not carry a button that always 404s.

        Revocation is not idempotent by replay: an invite that does not exist on
        this site, or is already settled (`accepted`, `revoked`), answers
        `404 NOT_FOUND`, so a second DELETE 404s rather than reporting a
        revocation that did not happen.
      responses:
        '204':
          description: The invite is revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No pending invite with this id exists on this site (`NOT_FOUND`), or
            no such site is visible to the caller (`SITE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites/{site_id}/invites/{invite_id}/resend:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - name: invite_id
        in: path
        required: true
        description: The invite to resend, as returned by `listSiteInvites`.
        schema:
          type: string
    post:
      operationId: resendSiteInvite
      tags: [sites]
      summary: Send an invitation again. Requires the `team:manage` capability.
      description: |
        Mints a **new** acceptance token, extends the expiry and enqueues a fresh
        email. Works on a `pending` invitation whose mail was lost, and on an
        `expired` one — which it revives, returning it to `pending`.

        The previous link stops working the moment this succeeds: an invitation
        has exactly one live token, so resending replaces it rather than issuing
        a second key to the same door.

        Not a replay of the original send: each resend enqueues its own
        notification, so a manager who clicks twice sends two emails, each
        carrying the one live link.
      responses:
        '200':
          description: A new link was minted and the email enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No resendable invite with this id exists on this site — unknown,
            belonging to another site, or already accepted or revoked
            (`NOT_FOUND`) — or no such site is visible to the caller
            (`SITE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            `ALREADY_MEMBER` — the invited address has since joined the site, so
            there is nothing to resend. `IDEMPOTENCY_CONFLICT` — reviving this
            expired invitation would collide with a newer live invitation to the
            same address; act on that one instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/invites/accept:
    post:
      operationId: acceptSiteInvite
      tags: [sites]
      summary: Accept an invitation with its emailed token.
      description: |
        Account-scoped: the caller's session must belong to the invited email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '200':
          description: The membership the invite granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedInvite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The invite was issued to a different email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The invite is invalid, used or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            `ALREADY_MEMBER` — the caller already belongs to this site, so the
            invitation grants nothing. The membership they already have stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/events:
    post:
      operationId: ingestEvents
      tags: [ingest]
      summary: Historical analytics event batch.
      description: |
        The canonical historical contract (docs snapshot 02 §7.3). Accepted only
        after the durable queue write succeeded — a queue failure is a retryable
        `503`, never a fake success (§7.2).

        Acceptance is all-or-nothing: one invalid event or one
        same-id/different-payload conflict enqueues nothing from the request. A
        retry of an already-accepted event is not an error; it counts as
        `duplicate` under the same `202`.

        `heartbeat` is not a member of this contract. Realtime presence has its
        own endpoint and never becomes a historical row.

        Every event carries a client-minted UUIDv7 `event_id`, created before the
        first send attempt so a lost response can still deduplicate (§7.1).

        The client cannot state `site_id`, geo, `billing_user_id`,
        `billing_assignment_version`, `usage_window_id`, `billable`,
        `accepted_at` or `ingest_generation`: those fields are absent from this
        schema and the request object is strict, so sending one is a
        `VALIDATION_FAILED` rather than an ignored field.

        Request bodies may be `gzip` or `deflate` encoded. Limits are checked on
        the decoded body; the compressed body has its own smaller ceiling.
      security: []
      parameters:
        - name: Content-Encoding
          in: header
          required: false
          description: '`identity`, `gzip` or `deflate`.'
          schema:
            type: string
            enum: [identity, gzip, deflate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
          # `navigator.sendBeacon` cannot set headers, and an `application/json`
          # cross-origin POST would preflight every batch. The body is the same
          # JSON either way; the collector reads it as text.
          text/plain:
            schema:
              $ref: '#/components/schemas/EventBatch'
      responses:
        '202':
          description: |
            Durably queued. Returned both for first acceptance and for a
            duplicate retry inside the dedup window (docs snapshot 05, D-209).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBatchAccepted'
        '400':
          description: |
            Schema, time-boundary or encoding failure (`VALIDATION_FAILED`). An
            event older than 24 hours is rejected here and creates no usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            An `event_id` was reused with a different payload
            (`IDEMPOTENCY_CONFLICT`). Nothing from the request is enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Over the batch row or byte limit (`PAYLOAD_TOO_LARGE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: |
            A collector rate limit or the per-site daily safety ceiling was hit
            (`RATE_LIMITED`, docs snapshot 05 G-005). Throttling, not loss: the
            tracker retries, and `Retry-After` says when. The daily ceiling
            resets at UTC midnight.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: |
            The durable queue write failed (`SERVICE_UNAVAILABLE`). Retryable;
            the tracker keeps the batch in its bounded 24h retry queue.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/realtime/heartbeat:
    post:
      operationId: ingestHeartbeat
      tags: [ingest]
      summary: Realtime presence heartbeat.
      description: |
        Writes realtime state only (docs snapshot 02 §7.2, §9): never the durable
        queue, never ClickHouse, never usage. Usage weight is 0 (D-101).

        It carries no `event_id` because nothing deduplicates it — if the write
        fails the tracker simply sends the next interval's heartbeat. That is
        also why a heartbeat cannot be smuggled into `POST /v1/events`: the
        historical batch requires an `event_id` and does not know this type.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
          text/plain:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
      responses:
        '204':
          description: Realtime state updated.
        '400':
          description: Schema failure (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: |
            Realtime state is unavailable (`SERVICE_UNAVAILABLE`). It is never
            downgraded into a historical event as a fallback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites/{site_id}/realtime/token:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
    post:
      operationId: issueRealtimeToken
      tags: [realtime]
      summary: Mint a scoped realtime stream token (authenticated).
      description: |
        Issues a short-lived `aud=realtime` bearer token after the api has checked
        session, membership, entitlement, site scope and the current access epoch
        (docs snapshot 05, D-213). The token lives at most 60 seconds
        (`REALTIME_TOKEN_TTL_SECONDS`) and is `scope=private`. The client presents
        it to `GET /v1/realtime/stream`; a reconnect fetches a new token.
      responses:
        '200':
          description: A freshly minted realtime token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          # One 403 carrying both: a viewer without the capability and a site that
          # is `suspended` answer the same status, and the envelope's code is what
          # tells them apart (`FORBIDDEN` / `SITE_SUSPENDED`).
          $ref: '#/components/responses/ForbiddenOrSuspended'
        '404':
          $ref: '#/components/responses/SiteNotFound'

  /v1/public/{share_slug}/realtime/token:
    parameters:
      - $ref: '#/components/parameters/ShareSlugPath'
    post:
      operationId: issuePublicRealtimeToken
      tags: [realtime, public]
      summary: Mint a public realtime stream token (unauthenticated, rate limited).
      description: |
        Public realtime is a separate opt-in credential with a narrower payload
        (docs snapshot 05, D-213): it never reuses the private token or the
        private snapshot shape. Served only when the site has opted realtime into
        public sharing and is not `suspended`. The token is `scope=public`
        and addresses the same `GET /v1/realtime/stream`, which serves such a
        connection the `PublicRealtimeSnapshot` allowlist only. Rate-limited per
        (IP, slug).
      security: []
      responses:
        '200':
          description: A freshly minted public realtime token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTokenResponse'
        '404':
          $ref: '#/components/responses/ShareNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/realtime/stream:
    get:
      operationId: streamRealtime
      tags: [realtime]
      summary: Server-sent realtime snapshot stream.
      description: |
        A one-directional SSE stream of active-visitor snapshots for the single
        site the bearer token is bound to (docs snapshot 02 §17, 05 D-213). The
        site is taken from the token and never from a query parameter — a
        query-string token is not accepted at all, because it would land in every
        access log on the path and a native `EventSource` (which cannot set an
        `Authorization` header) is deliberately unsupported; the browser reads
        this with a `fetch` stream instead.

        The gateway verifies the token's signature, `aud`, expiry, site and scope
        at connect time, and re-checks the access epoch against Redis at least
        every 15 seconds (`REALTIME_EPOCH_CHECK_SECONDS`); if Redis or auth state
        cannot be read, a private stream is closed fail-closed. Token expiry binds
        the connection, not the session — a reconnect obtains a fresh token.

        The response body is an `text/event-stream`. Named events:

        - `snapshot` — a `RealtimeSnapshot` for a `scope=private` connection, or a
          `PublicRealtimeSnapshot` for a `scope=public` one (the narrower public
          allowlist; the two shapes are deliberately distinct).
        - `control` — a `RealtimeControl`: a `disconnect` on revocation or
          fail-closed, or a `degraded`/`recovered` transition.

        Each `snapshot` event carries an SSE `id`; a reconnecting client sends the
        last one back in `Last-Event-ID` for bounded replay, and never blindly
        double-applies a delta it already saw.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: |
            The `id` of the last SSE event the client received, for bounded replay
            on reconnect.
          schema:
            type: string
            maxLength: 256
      security:
        - realtimeBearer: []
      responses:
        '200':
          description: |
            The event stream. Each event is a `RealtimeStreamEvent` — a
            `snapshot` or a `control` message — serialized as the `data` of a
            named SSE event.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  An SSE stream. Not a single JSON document: a sequence of
                  `event:`/`id:`/`data:` records whose `data` is a
                  `RealtimeStreamEvent` (private) or a `PublicRealtimeSnapshot`
                  (public).
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/tracker/config:
    get:
      operationId: getTrackerConfig
      tags: [ingest]
      summary: Cached per-site tracker configuration.
      description: |
        Public, CDN-cacheable configuration for a tracking key (docs snapshot 02
        §11): site timezone, allowed domains, query redaction rules, feature
        flags and no-code rules.

        Cached by `ETag` and carries `config_version`, which a dashboard change
        increments. The tracking key stays write-only: this response contains no
        credential, and the endpoint is never read authorization for analytics
        data.
      security: []
      parameters:
        - name: key
          in: query
          required: true
          description: The public, write-only tracking key.
          schema:
            type: string
            minLength: 8
            maxLength: 64
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The current configuration.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackerConfig'
        '304':
          description: The caller's `ETag` still matches.
        '404':
          description: No site resolves from this key (`SITE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

