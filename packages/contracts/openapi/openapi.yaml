      - $ref: '#/components/parameters/RangeFrom'
      - $ref: '#/components/parameters/RangeTo'
      - $ref: '#/components/parameters/QueryTimezone'
    get:
      operationId: getAnalyticsSessions
      tags: [analytics]
      summary: Sessions, engaged sessions, bounce rate and average durations over time.
      description: |
        Session-derived metrics (docs snapshot 02 §10, §15, docs snapshot 05
        D-211). A long range reads the finalized `session_rollups_*` and the recent
        window past the site's `finalized_through` reads the provisional
        `session_facts_versions` layer; the two are split at a UTC bucket boundary
        so no session is double-counted. Bounce rate and the averages are derived
        at read from additive totals, never stored. `layering` carries
        `finalized_through` (beyond which results no longer change) and
        `provisional_through` (the leading edge of revisable data). Session
        metrics have no minute grain, so a short range is served at hour grain,
        composed from the fifteen-minute session rollup in any timezone.
      responses:
        '200':
          description: Session metrics per bucket and as range totals, with layering metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSessionsResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRange'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
