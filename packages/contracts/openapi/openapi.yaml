          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/SiteNotFound'
    post:
      operationId: createSiteFunnel
      tags: [analytics]
      summary: Save a funnel definition. Requires the `site:settings` capability.
      description: |
        The step, scope and window bounds are the ones the compute endpoint
        enforces, so a definition that saves is a definition that can be run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFunnelRequest'
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['funnels:write']
      responses:
        '201':
          description: The saved definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelDefinition'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SiteNotFound'

  /v1/sites/{site_id}/funnels/{funnel_id}:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - name: funnel_id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateSiteFunnel
      tags: [analytics]
      summary: Change a funnel definition. Requires the `site:settings` capability.
      description: |
        A partial update; an empty body is refused. An archived definition is not
        editable — it is no longer on the list, so a change to it would be a
        change nobody can see.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFunnelRequest'
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['funnels:write']
      responses:
        '200':
          description: The updated definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelDefinition'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No live funnel with this id on this site (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: archiveSiteFunnel
      tags: [analytics]
      summary: Archive a funnel definition. Requires the `site:settings` capability.
      description: |
        Archiving is the delete, and it is soft: the row survives with
        `archived_at` set, so a chart someone linked does not become a dangling
        reference. The definition leaves the default list and is still visible
        through `include_archived=true`.

        Unlike an API-key or invite revocation, this is **idempotent**: a repeat
        answers `204` rather than `404`, and `archived_at` keeps the instant of
        the first archive. `404` means no funnel with this id exists on this
        site.
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      # Archiving is reversible, which is why it has a grant row where deletion has none.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['funnels:write']
      responses:
        '204':
          description: The definition is archived and off the default list.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such funnel on this site (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites/{site_id}/event-definitions:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
    get:
      operationId: listSiteEventDefinitions
      tags: [analytics]
      summary: A site's dashboard-defined custom events. Readable by every member.
      description: |
        Definitions only — the versions, rules and templates live behind
        `/versions`. Readable by a `viewer` on purpose: a viewer already sees the
        events these definitions name in every chart, so hiding the list would
        withhold the labels, not the data.

        Archived definitions are excluded unless `include_archived=true`.
        `published_version` is `null` for a definition that has been drafted but
        never published — a real state, not a gap.
      parameters:
        - name: include_archived
          in: query
          required: false
          description: Include archived definitions alongside the live ones.
          schema:
            type: boolean
            default: false
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['analytics:read']
      responses:
        '200':
          description: The site's event definitions, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventDefinition'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/SiteNotFound'
    post:
      operationId: createSiteEventDefinition
      tags: [analytics]
      summary: Create an event definition and its v1. Requires `site:settings`.
      description: |
        Creates the definition and its first version in one commit. **It is not
        published**: creating a definition and turning it on are two acts, and a
        definition that started live would put unreviewed rules into every
        visitor's browser as a side effect of pressing Save. Call `/publish`
        when the rules are ready.

        `event_name` is unique per site **including archived definitions** — the
        ClickHouse rows an archived definition produced still group under its
        name, so archiving does not free it. A collision is
        `EVENT_DEFINITION_NAME_TAKEN`, not a validation error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventDefinitionRequest'
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['events:write']
      responses:
        '201':
          description: The definition, with its v1 inline.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EventDefinition'
                  - type: object
                    required: [version]
                    properties:
                      version:
                        $ref: '#/components/schemas/EventDefinitionVersion'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SiteNotFound'
        '409':
          description: The name is already used on this site (`EVENT_DEFINITION_NAME_TAKEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites/{site_id}/event-definitions/{definition_id}:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - name: definition_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSiteEventDefinition
      tags: [analytics]
      summary: One event definition. Readable by every member.
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['analytics:read']
      responses:
        '200':
          description: The definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDefinition'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No such event definition on this site (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: archiveSiteEventDefinition
      tags: [analytics]
      summary: Archive an event definition. Requires `site:settings`.
      description: |
        Archiving is the delete, and it is soft: the definition is the *meaning*
        of events already stored in ClickHouse, so hard-deleting it would leave
        every historical row with a display name and template that no longer
        exist.

        Archiving also **unpublishes**: the rules stop being served to browsers,
        and the site's `config_version` is bumped so caches learn about it. If
        the definition was never published, no bump happens — nothing a browser
        can see changed.

        Idempotent: a repeat answers `204` rather than `404`, and `archived_at`
        keeps the instant of the first archive.
      responses:
        '204':
          description: The definition is archived and no longer served.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such event definition on this site (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites/{site_id}/event-definitions/{definition_id}/versions:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - name: definition_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listSiteEventDefinitionVersions
      tags: [analytics]
      summary: A definition's version history, oldest first. Readable by every member.
      description: |
        Every version a definition has ever had. **History is immutable**: a
        version row is never updated and never deleted, so this list only grows.
        A version whose `source_version` is set was created by rolling back to
        that older version — "v3 is v1 again".
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['analytics:read']
      responses:
        '200':
          description: The version history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [published_version, items]
                properties:
                  published_version:
                    type: [integer, 'null']
                    description: The version currently served to browsers, or null.
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventDefinitionVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No such event definition on this site (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createSiteEventDefinitionVersion
      tags: [analytics]
      summary: Save a new draft version. Requires `site:settings`.
      description: |
        The whole content is restated rather than patched, because a version is
        immutable and complete by definition — a partial update would make "what
        did v3 contain" a question you answer by replaying v1 and v2.

        The new version is a **draft**: it is not served until `/publish` names
        it. Version numbers are allocated server-side as `max + 1`; two
        concurrent saves cannot both become v3.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventDefinitionContent'
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      # A draft is in nobody's browser until it is published.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['events:write']
      responses:
        '201':
          description: The new draft version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDefinitionVersion'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No live event definition with this id on this site (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites/{site_id}/event-definitions/{definition_id}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - name: definition_id
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getSiteEventDefinitionVersion
      tags: [analytics]
      summary: One version of a definition. Readable by every member.
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['analytics:read']
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDefinitionVersion'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No such version of this event definition (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites/{site_id}/event-definitions/{definition_id}/publish:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - name: definition_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: publishSiteEventDefinition
      tags: [analytics]
      summary: Publish a version to browsers. Requires `site:settings`.
      description: |
        Points the definition at `version` and bumps the site's `config_version`
        in the same commit, which is what invalidates the tracker-config ETag.

        **Publishing is not instant in the browser.** A visitor already
        mid-session can take up to ~10 minutes to evaluate the new rules: 5
        minutes of HTTP cache plus 5 minutes of the tracker's own config cache.
        A page loaded fresh sees it within ~5 minutes. Show this number rather
        than implying immediacy.

        `expected_published_version` is required and is checked, not trusted —
        pass the `published_version` you last read, or `null` if you believe
        nothing is published. If someone else published in between, the answer is
        `EVENT_DEFINITION_VERSION_CONFLICT` with the live version in
        `details.published_version`, and nothing is written.

        Publishing is also where the site-wide rule ceiling is enforced: the sum
        of every published definition's rules may not exceed 50. Drafts are not
        counted — a draft is in nobody's browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishEventDefinitionRequest'
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      # Reversible only because rollback has a row too.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['events:write']
      responses:
        '200':
          description: The version is live and the config epoch has moved.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [published_version, config_version]
                properties:
                  published_version:
                    type: integer
                  config_version:
                    type: integer
                    description: The site's new config epoch, which the tracker ETag is built from.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such definition or version (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Someone else published first (`EVENT_DEFINITION_VERSION_CONFLICT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites/{site_id}/event-definitions/{definition_id}/rollback:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - name: definition_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: rollbackSiteEventDefinition
      tags: [analytics]
      summary: Publish an older version's content again. Requires `site:settings`.
      description: |
        **Rollback moves forward.** Rolling back to v1 does not rewind the
        pointer — it creates a *new* version whose content is copied from v1,
        records `source_version: 1`, and publishes that. History is never
        mutated and never deleted.

        It works this way because the tracker-config ETag is
        `"oa-{site}-{config_version}"` and that epoch only ever increases: a
        rewound version number would either reuse an ETag browsers have already
        cached — so the rollback would never reach the visitors it was for — or
        leave "which rules are live" answerable only by reading two rows in the
        right order.

        `expected_published_version` behaves exactly as it does on `/publish`.
        Not idempotent: calling it twice produces two versions, and the response
        says which one is live.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishEventDefinitionRequest'
      # ADR-0048 D2: this route carries a `GRANT_WRITE_ALLOWLIST` row, so an OAuth
      # grant may reach it as well as a browser session. The scope is a ceiling;
      # the capability check on the route is the authority and still refuses a viewer.
      security:
        - sessionCookie: []
        - oauthAccessToken: ['events:write']
      responses:
        '200':
          description: A copy of the older version is live.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [published_version, source_version, config_version, version]
                properties:
                  published_version:
                    type: integer
                    description: The NEW version number now serving.
                  source_version:
                    type: [integer, 'null']
                    description: The historical version its content was copied from.
                  config_version:
                    type: integer
                  version:
                    $ref: '#/components/schemas/EventDefinitionVersion'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such definition or version (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Someone else published first (`EVENT_DEFINITION_VERSION_CONFLICT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/imports/providers:
    get:
      operationId: listImportProviders
      tags: [imports]
      summary: Which providers this deployment can import from.
      description: |
        Session-authenticated but not site-scoped: the catalog is a property of
        the build, not of a site, and the picker renders before a site is chosen.

        Providers with `available: false` are listed on purpose — "supported
        later" and "not something we do" are different answers, and a list
        carrying only working adapters could give only the second. Render the
        flag; do not filter the list client-side and assume the rest works.
      responses:
        '200':
          description: Every provider this build knows about.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImportProvider'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/sites/{site_id}/imports:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
    get:
      operationId: listSiteImports
      tags: [imports]
      summary: A site's import runs, newest first. Readable by every member.
      responses:
        '200':
          description: The site's import runs.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImportRun'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/SiteNotFound'
    post:
      operationId: createSiteImport
      tags: [imports]
      summary: Start an import. Requires the `site:settings` capability.
      description: |
        Creates the run and answers a **single-PUT** signed upload URL. Upload the
        archive straight to `upload.url` with `upload.method` and every header in
        `upload.required_headers` replayed verbatim — both are bound into the
        signature, so a request that changes either is rejected by storage. Then
        call `POST .../imports/{run_id}/complete`.

        `size_bytes` is the exact length the signature binds, so it must be the
        archive's real size rather than an estimate, and it must not exceed
        `IMPORT_MAX_ARCHIVE_BYTES`. A value above it is a field validation error,
        not a `413`: nothing has been uploaded yet.

        A site may hold **one** non-terminal import at a time. A second one while
        another is uploading, processing or awaiting review answers `409
        IMPORT_IN_PROGRESS` with `details.import_run_id` naming the run in the
        way; publish or discard that one first.

        The signed URL is short-lived. If it expires mid-upload, re-read
        `GET .../imports/{run_id}`: while the run is still `uploading` that read
        answers a freshly minted `upload` block bound to the same declared size
        and content type, so the recovery is to retry the PUT rather than to
        start over. Discarding the run and creating a new one also works — and is
        the only route once the run has left `uploading` — but it abandons the
        bytes already transferred.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImportRequest'
      responses:
        '201':
          description: The run, and where to upload the archive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateImportResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SiteNotFound'
        '409':
          $ref: '#/components/responses/ImportInProgress'
        '503':
          $ref: '#/components/responses/ObjectStorageUnavailable'

  /v1/sites/{site_id}/imports/{run_id}:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/ImportRunIdPath'
    get:
      operationId: getSiteImport
      tags: [imports]
      summary: One import run. Readable by every member.
      description: |
        While the run is `uploading` this read also mints a **fresh** `upload`
        block — a new signed URL bound to the same declared size and content
        type — so an expired signature is recovered by retrying the PUT rather
        than by discarding the run. In every other phase `upload` is `null`.
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRun'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No such import on this site (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ObjectStorageUnavailable'
    delete:
      operationId: discardSiteImport
      tags: [imports]
      summary: Discard an import. Requires the `site:settings` capability.
      description: |
        Allowed while the run is `uploading`, `uploaded` or `ready_for_review` —
        before anything of it is visible on the dashboard. The run becomes
        `discarded` and its uploaded archive is deleted.

        Past those phases the run either holds a running job or is the published
        pointer, and undoing it is a rollback rather than a discard; the call
        answers `409 IMPORT_IN_PROGRESS` with the current `details.phase`.
      responses:
        '204':
          description: The run is discarded.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such import on this site (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          $ref: '#/components/responses/ImportInProgress'

  /v1/sites/{site_id}/imports/{run_id}/complete:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/ImportRunIdPath'
    post:
      operationId: completeSiteImport
      tags: [imports]
      summary: Confirm the archive was uploaded. Requires the `site:settings` capability.
      description: |
        Call this once the PUT to the signed URL has succeeded. A signed upload
        gives the API no callback, so this is what tells it the bytes are there.

        The object is inspected: absent, the answer is `409
        IMPORT_UPLOAD_MISSING` and the fix is to upload again through the same
        URL. Present but not the declared length, the answer is `422
        IMPORT_FAILED` with `details.declared_bytes` and
        `details.observed_bytes`.

        On success the run moves to `uploaded`, its content fingerprint is
        pinned, and preparation is queued — one transaction, so a run can never
        reach `uploaded` with nothing queued to prepare it. The response is the
        run; poll `GET .../imports/{run_id}` for its phase.

        Calling it again on a run that already reached `uploaded` is a **success,
        not a conflict**: it re-queues preparation (the job is keyed on the run,
        so no twin is created) and answers the same `202`. That is the recovery
        for a lost response, and it is why a retry needs no idempotency key.
      responses:
        '202':
          description: The upload is confirmed and preparation is queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRun'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such import on this site (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            The archive is not in storage (`IMPORT_UPLOAD_MISSING`), or the run is
            no longer awaiting its upload (`IMPORT_IN_PROGRESS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            The uploaded archive is not what was declared (`IMPORT_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ObjectStorageUnavailable'

  /v1/sites/{site_id}/imports/{run_id}/publish:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/ImportRunIdPath'
    post:
      operationId: publishSiteImport
      tags: [imports]
      summary: Publish a reviewed import. Requires the `site:settings` capability.
      description: |
        Makes the staged history visible on the dashboard. The run must be in
        `ready_for_review`; the response is `202` and the swap itself is done by
        a background job, so poll `GET .../imports/{run_id}` until the phase is
        `published`.

        **The cutover date is the decision this call makes.** It is the calendar
        day at which imported history stops and live data begins: the dashboard
        reads imported numbers strictly *before* it and live numbers from it
        onwards, so the two can never overlap. Omit `cutover_date` to accept the
        default the review summary proposes (`summary.proposed_cutover_date`),
        which is the day after the last imported day, or the site's first live
        day when that is earlier.

        A supplied value may not be later than the day after this site's first
        live event — a later cutover would hide live data the site already has
        behind imported numbers. A site that has never received an event has no
        such limit, which is the ordinary migration case: import first, install
        the tracker second.

        Publishing supersedes the previously published run rather than deleting
        it, so exactly one `POST .../rollback` is always available afterwards.

        Calling it again while the run is `publishing` or already `published`
        answers `202` with the run rather than a conflict — the recovery for a
        lost response.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishImportRequest'
      responses:
        '202':
          description: The publish is queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRun'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such import on this site (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          $ref: '#/components/responses/ImportInProgress'
        '422':
          description: |
            The import staged no rows and there is nothing to publish
            (`IMPORT_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites/{site_id}/imports/{run_id}/rollback:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/ImportRunIdPath'
    post:
      operationId: rollbackSiteImport
      tags: [imports]
      summary: Undo the last publish. Requires the `site:settings` capability.
      description: |
        Hides this import again and restores the one it superseded, if there was
        one. It is immediate — no job, no data movement — because the previous
        import's rows were never deleted.

        The run must be the one currently published. Exactly **one** generation
        is kept: after rolling back to the previous import, that import's own
        predecessor is gone and cannot be restored. Rolling back a site's first
        import simply leaves it with no imported history.

        Calling it again on a run that is already `rolled_back` answers `200`
        with the run.

        Once the predecessor has been cleaned up — which happens when a *third*
        import is published, or when the cleanup backstop reaches it — the
        rollback is no longer possible and the call answers `409
        IMPORT_ROLLBACK_UNAVAILABLE`. Nothing changes: the published import stays
        published. A client that offers a rollback button should stop offering it
        on that code rather than retrying.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The import is rolled back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRun'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such import on this site (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            The run is not the published one (`IMPORT_IN_PROGRESS`), or the
            import it replaced has already been cleaned up and cannot be restored
            (`IMPORT_ROLLBACK_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites/{site_id}/exports:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
    get:
      operationId: listSiteExports
      tags: [exports]
      summary: A site's exports, newest first. Readable by every member.
      description: |
        Status only. This operation mints nothing and is safe to poll: download
        URLs come from `POST .../exports/{export_id}/download`, which is the one
        that writes an audit row.
      responses:
        '200':
          description: The site's exports.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExportRun'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/SiteNotFound'
    post:
      operationId: createSiteExport
      tags: [exports]
      summary: Start an export. Requires the `export:raw` capability (owner only).
      description: |
        Answers `202` immediately; the work runs as a background job. Poll
        `GET .../exports/{export_id}` until `phase` is `succeeded`, then call
        `POST .../exports/{export_id}/download`.

        The export is **pinned** at the moment of this call: `cutoff` is the
        server instant every event is measured against (`accepted_at <= cutoff`),
        and `pinned_import_run_id` is the imported generation that was published
        then. Both are answered here so the result is reproducible and so a
        publish or a rollback during the export cannot make its files disagree.

        A site may run **one** export at a time. A second one answers `409
        EXPORT_IN_PROGRESS` with `details.export_id` naming the one in the way.

        The files live for seven days — `expires_at` on the export says exactly
        when. After that it answers `410 EXPORT_EXPIRED` and a new export has to
        be requested.

        **Owner only.** An export is the site's entire raw event history in one
        file, so it is gated on `export:raw` rather than on the `site:settings`
        capability the import door uses. Site admins can read an export's status
        and cannot start one or download it.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The export is queued.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [export]
                properties:
                  export:
                    $ref: '#/components/schemas/ExportRun'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SiteNotFound'
        '409':
          $ref: '#/components/responses/ExportInProgress'

  /v1/sites/{site_id}/exports/{export_id}:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/ExportIdPath'
    get:
      operationId: getSiteExport
      tags: [exports]
      summary: One export's status. Readable by every member.
      description: |
        Never carries a URL. `manifest` is a summary - chunk count and total rows
        and bytes - so a client can show the size of a download before starting
        it; the per-file list with its digests is inside the exported
        `manifest.json` itself.
      responses:
        '200':
          description: The export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportRun'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No such export on this site (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites/{site_id}/exports/{export_id}/download:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/ExportIdPath'
    post:
      operationId: downloadSiteExport
      tags: [exports]
      summary: Mint download URLs. Requires the `export:raw` capability (owner only).
      description: |
        Returns a short-lived signed URL for the manifest and for **every** chunk
        in one response, and writes exactly one audit row for the request. Fetch
        `manifest.json` first: it carries the schema notes and the per-file row
        counts and `sha256` digests to verify what you download.

        A `POST` rather than a `GET` because it is not a read: it hands out
        bearer credentials and it is audited. The URLs expire in fifteen minutes;
        a download that outlives them repeats this call for a fresh set, and each
        call is separately audited.

        `410 EXPORT_EXPIRED` means the seven-day window has passed and the files
        are gone - request a new export rather than retrying. `409
        EXPORT_IN_PROGRESS` means the export has not succeeded yet;
        `details.phase` says where it is.
      responses:
        '200':
          description: Signed URLs for every file of the export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportDownload'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such export on this site (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          $ref: '#/components/responses/ExportInProgress'
        '410':
          $ref: '#/components/responses/ExportExpired'
        '503':
          $ref: '#/components/responses/ObjectStorageUnavailable'

  /v1/revenue/providers:
    get:
      operationId: listRevenueProviders
      tags: [revenue]
      summary: Which revenue providers this deployment can connect to.
      description: |
        Session-authenticated but not site-scoped: the catalog is a property of
        the build, not of a site, and the picker renders before a site is chosen.

        Providers with `available: false` are listed on purpose — "supported
        later" and "not something we do" are different answers, and a list
        carrying only working adapters could give only the second. Render the
        flag; do not filter the list client-side and assume the rest works.

        Mounted unconditionally, including on a deployment whose credential
        keyring is not configured yet: this answers what the build can do, which
        does not depend on the secret.
      responses:
        '200':
          description: Every revenue provider this build knows about.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RevenueProvider'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/sites/{site_id}/revenue/connection:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
    get:
      operationId: getSiteRevenueConnection
      tags: [revenue]
      summary: The site's revenue connection. Requires `credentials:manage`.
      description: |
        Never returns a secret. `api_key_last4` and `status` are the whole read
        surface of the credential itself.

        Three outcomes the UI must render differently, and they are decidable
        from this response alone:

        - `{ "status": "not_connected" }` — nothing has ever been connected;
        - `webhook_secret_set: false` — connected and ingesting, but step two of
          the connect flow is unfinished. Show the customer `webhook_url` and ask
          them to paste the endpoint's signing secret;
        - `status: "disabled"` — a connection existed and was disconnected. The
          revenue already recorded is still there; nothing new arrives;
        - `status: "degraded"` — the provider is failing. `last_error` carries a
          safe category and `last_synced_at` is when the data was last actually
          correct. **A degraded connection is never reported as revenue of
          zero.**

        `credentials:manage` covers the read too, because the response carries
        `webhook_url` — the address a signed provider payload is delivered to.
      responses:
        '200':
          description: The connection, or an explicit "not connected".
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RevenueConnection'
                  - $ref: '#/components/schemas/RevenueNotConnected'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SiteNotFound'
    post:
      operationId: connectSiteRevenue
      tags: [revenue]
      summary: Connect a revenue provider. Requires `credentials:manage`.
      description: |
        The key is **verified against the provider before anything is stored**,
        so a failure leaves no row behind and nothing to clean up.

        For Stripe the key must be a *restricted* key with Read on charges,
        refunds, disputes, customers, checkout sessions, payment intents,
        invoices, subscriptions, products, prices, balance transactions and
        events, and no write permission of any kind.

        **Connecting is two steps, and this is step one.** The response carries
        `webhook_url` and `webhook_secret_set: false`. Create the webhook
        endpoint in the provider dashboard pointing at that URL, then send its
        signing secret to `PATCH` as `webhook_secret`. The secret cannot be
        supplied here on a first connect, because the endpoint that produces it
        cannot exist until this call has minted the URL.

        Between the two steps the connection is `active` and already ingesting:
        backfill and reconcile run on the API key alone. What step two adds is
        the low-latency webhook path, and `meta.revenue.last_webhook_at` staying
        `null` is how the read surface says it is still missing.

        - `422 REVENUE_CREDENTIAL_REJECTED` — the provider said no. Check the key
          and its permissions; retrying unchanged will not help.
        - `503 PROVIDER_UNAVAILABLE` — the provider did not answer. Retryable,
          and nothing was stored.
        - `409 REVENUE_ALREADY_CONNECTED` — disconnect or rotate the existing
          connection instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectRevenueRequest'
      responses:
        '201':
          description: Connected. The secrets are stored encrypted and never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueConnection'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SiteNotFound'
        '409':
          description: This site is already connected to that provider (`REVENUE_ALREADY_CONNECTED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/RevenueCredentialRejected'
        '503':
          description: The provider did not answer; nothing was stored (`PROVIDER_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: rotateSiteRevenueCredential
      tags: [revenue]
      summary: Replace the stored API key. Requires `credentials:manage`.
      description: |
        For rotating the provider key after the customer regenerates it. Same
        live probe as connect, and the same refusals: the stored ciphertext is
        replaced only after the new key has been proven to work.

        The webhook signing secret is **not** touched — rotating a provider key
        does not change the endpoint's secret, and `webhook_url` is unchanged, so
        nothing has to be edited in the provider dashboard.

        A rotation that succeeds also clears a `degraded` status: the connection
        is working again by construction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateRevenueCredentialRequest'
      responses:
        '200':
          description: Rotated. Status returns to `active`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueConnection'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: This site has no connected revenue provider (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/RevenueCredentialRejected'
        '503':
          description: The provider did not answer; nothing was changed (`PROVIDER_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: disconnectSiteRevenue
      tags: [revenue]
      summary: Disconnect the provider. Requires `credentials:manage`.
      description: |
        Disables the connection and **erases both stored secrets in the same
        write**. The revenue already recorded is untouched — this is not a
        deletion of the site's history — and a subsequent `GET` reports
        `status: "disabled"` so the dashboard can say what happened rather than
        showing an unexplained zero.

        Reachable while the site is `suspended`: severing a provider
        connection must never be something a customer has to pay to do.
      responses:
        '204':
          description: Disconnected.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: This site has no connected revenue provider (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sites/{site_id}/revenue/summary:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/RangeFrom'
      - $ref: '#/components/parameters/RangeTo'
      - $ref: '#/components/parameters/QueryTimezone'
      - $ref: '#/components/parameters/Compare'
      - $ref: '#/components/parameters/RevenueResolution'
    get:
      operationId: getRevenueSummary
      tags: [revenue]
      summary: Revenue totals over a range. Requires `revenue:read` (owner-only).
      description: |
        Gross, refunds, dispute movement, fees and net over the range, in the
        site's `reporting_currency`, plus the **unconverted remainder** in the
        original currencies (ADR-0033, D2c/D2d/D7).

        `revenue:read` sits in the owner-only set of the capability matrix beside
        `export:raw` and `site:delete` (docs snapshot 02 §19). An admin or a
        viewer of the site gets `403 FORBIDDEN`: revenue amounts and customer
        pseudonyms are the most sensitive read surface the product has.

        **Signs and buckets (D2d).** Each fact lands in the bucket of its own
        `occurred_at` — a refund reduces net in the refund's bucket, never
        retroactively in the charge's, so a July report read in July still reads
        the same in September. A refunded charge keeps its full gross in
        `charge_gross_minor`; the refund carries the negative. The identity
        holds exactly:

        ```
        net = charge_gross - refund - dispute_withdrawn + dispute_reinstated - fee
        ```

        **The unconverted remainder is not zero revenue.** A transaction in a
        currency the rate source does not cover keeps its original amount and is
        listed in `unconverted` per currency, with `totals.unconverted_count`
        saying how many there were. It is never folded into the totals as a zero.

        `meta.revenue.connection_status` is what distinguishes "no sales" from
        "no provider" from "the provider is down" — see `AnalyticsMeta`.
      responses:
        '200':
          description: Range totals, the comparison period, and the unconverted remainder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueSummaryResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRange'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrSuspended'
        '404':
          $ref: '#/components/responses/SiteNotFound'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /v1/sites/{site_id}/revenue/timeseries:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/RangeFrom'
      - $ref: '#/components/parameters/RangeTo'
      - $ref: '#/components/parameters/QueryTimezone'
      - $ref: '#/components/parameters/RevenueResolution'
    get:
      operationId: getRevenueTimeseries
      tags: [revenue]
      summary: Revenue bucketed over time. Requires `revenue:read` (owner-only).
      description: |
        The same measures as the summary, per bucket, in the site's
        `reporting_currency`.

        **Revenue has hour and day grain only.** There is no minute revenue
        rollup: a per-minute revenue series is noise around individual
        transactions, and the transactions list is the surface for those.
        `minute` or `week` in `resolution` is a `VALIDATION_FAILED`. A non-UTC
        local day is composed from the fifteen-minute rollup, so a DST 23- or
        25-hour day sums the hours it actually had — in every timezone, since
        ADR-0079 made the atom fine enough for every offset in force.

        `unconverted_count` per bucket lets a chart mark a bucket whose total is
        incomplete without a second request; the per-currency amounts are on the
        summary, which is the only surface that can act on them.
      responses:
        '200':
          description: A bucketed revenue series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueTimeseriesResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRange'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrSuspended'
        '404':
          $ref: '#/components/responses/SiteNotFound'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /v1/sites/{site_id}/revenue/transactions:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/RangeFrom'
      - $ref: '#/components/parameters/RangeTo'
      - $ref: '#/components/parameters/QueryTimezone'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageLimit'
    get:
      operationId: getRevenueTransactions
      tags: [revenue]
      summary: Individual transactions, newest first. Requires `revenue:read` (owner-only).
      description: |
        Cursor-paginated (docs snapshot 03 §6.4): keyset on
        `(occurred_at, object_id)` descending, `{ items, next_cursor, has_more }`,
        and `has_more` is exact on the last page because the server over-fetches
        by one rather than counting.

        The cursor is **opaque** — its encoding is a server implementation
        detail and may change. It carries no authority: the site comes from the
        path and is authorized on every request, so a tampered cursor can only
        move the caller within their own list. A malformed one is
        `VALIDATION_FAILED` rather than a silent restart from page one, which
        would loop a paging client forever with no error.

        Money follows 03 §6.5: minor-unit integers plus a currency, with `gross`,
        `refund`, `fee` and `net` as separate fields so a refund is never
        inferred by subtracting rounded values. `reporting` and `conversion` are
        **null together** when no usable rate existed — `null`, not zero, because
        an unconverted amount is unknown rather than nothing.

        `matched_via` and `confidence` come from the attribution (ADR-0033, D6).
        An unmatched transaction is a first-class outcome: it appears here with
        `confidence: "none"` and simply has no journey.
      responses:
        '200':
          description: One page of transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueTransactionsResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRange'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrSuspended'
        '404':
          $ref: '#/components/responses/SiteNotFound'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /v1/sites/{site_id}/revenue/transactions/{object_id}/journey:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - name: object_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: The provider object id of the transaction, as returned by the list.
      - $ref: '#/components/parameters/RangeFrom'
      - $ref: '#/components/parameters/RangeTo'
      - $ref: '#/components/parameters/QueryTimezone'
    get:
      operationId: getRevenueTransactionJourney
      tags: [revenue]
      summary: One transaction's attribution journey. Requires `revenue:read` (owner-only).
      description: |
        The ordered story of one purchase, rendered through the docs snapshot
        §11 display contract: the visitor's session touchpoints inside the
        attribution window, plus the money events of the order — the charge and
        every refund and dispute that points at it.

        **The frontend never invents a sentence.** Each entry carries a stable
        `display.kind`, a rendered `display.text`, an icon hint, and the
        `properties` the text was rendered from — so a client may show the
        server's sentence or localize its own from the same fields, and neither
        has to guess. §11's rule and its example are both satisfied.

        `first_touch` and `last_touch` are the entry source of the visitor's
        first and last session in the window (ADR-0033, D6; this is where
        ADR-0028 §8 lands). `identity_scope` is D2a's honesty flag:
        `anonymous_day` means the journey is bounded by the daily rotation of a
        cookieless id (docs snapshot 05, D-102), and `identified` means it runs
        from the last rotation before `identify()` onward. `journey_truncated`
        says whether touchpoints were dropped by the 50-entry cap, with
        `touchpoint_count` holding the true number.

        An **unmatched** transaction is not a 404: it answers with its money
        events, `matched_via: "none"`, `confidence: "none"` and no touch blocks.
        A `404 NOT_FOUND` means no such transaction on this site.

        `from`/`to` are **required and load-bearing**, not decoration. The money
        objects are read over that window (widened by a day below and to now
        above), which is what keeps one journey from scanning every partition the
        site has ever had. Pass the same range the transactions list was showing:
        the charge is inside it by construction, and refunds and disputes only
        ever follow their charge. A charge id from outside the window answers
        `404`.
      responses:
        '200':
          description: The transaction's journey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueJourneyResponse'
        '400':
          $ref: '#/components/responses/AnalyticsBadRange'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrSuspended'
        '404':
          description: No such site, or no such transaction on it (`SITE_NOT_FOUND` / `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/AnalyticsUnavailable'

  /v1/revenue/webhooks/{provider}/{webhook_token}:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
        description: Must match the provider the token was minted for; otherwise 404.
      - name: webhook_token
        in: path
        required: true
        schema:
          type: string
        description: |
          The opaque per-credential token from `webhook_url` (32 random bytes,
          base64url). It resolves the credential **and** its site, which is what
          gives every customer their own endpoint under their own signing secret.
    post:
      operationId: revenueProviderWebhook
      tags: [revenue]
      summary: Per-site revenue provider webhook receiver.
      description: |
        Documented here although no client calls it: it is a real, versioned,
        publicly addressable endpoint of this service, and the contract is what
        the frontend and the operator read to know the surface exists. Neither is a client-callable operation — the caller is a payment
        provider's delivery machinery, authenticated by a signature over the raw
        body rather than by a session — so both carry `security: []` and neither
        is used by the generated client.

        Idempotent twice over (ADR-0033, D4): the `(site, provider, event id)`
        ledger dedupes a redelivery, and the object head's three-way decision
        dedupes and orders the *state*. An equal-timestamp tie with a differing
        payload is resolved by re-fetching the authoritative object from the
        provider, never by guessing.

        A `disabled` credential is acknowledged with `200` and ledgered
        `ignored`, so a disconnected site does not accumulate provider-side
        retry storms.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The raw provider event. Read as text for signature verification.
      responses:
        '200':
          description: Acknowledged (processed or ignored), so the provider stops retrying.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  received:
                    type: boolean
        '400':
          description: The signature is missing or invalid, or the body is not an event.
          content:
            application/json:
              schema:
                type: object
        '404':
          description: |
            Unknown token, or a token that belongs to a different provider. The
            two are deliberately indistinguishable.
          content:
            application/json:
              schema:
                type: object
        '413':
          description: The body exceeds the 1 MiB cap, checked before anything parses it.
          content:
            application/json:
              schema:
                type: object
        '503':
          description: |
            A transient failure that is ours — the provider was unreachable
            during a tie-break re-fetch. The ledger row stays `received`, so a
            redelivery reprocesses it.
          content:
            application/json:
              schema:
                type: object

  /v1/assistant/questions:
    post:
      operationId: askAssistant
      tags: [assistant]
      summary: Ask the analytics assistant a question; the answer streams back.
      description: |
        Session-authenticated (ADR-0046, D2). The browser dashboard is the only
        client in v1: a private key or an OAuth token gets `401` here, exactly as
        it does on every other session route, because those credentials already
        have `/v1/read` and `/mcp` and neither needs a model.

        **There is no site parameter, and that is deliberate.** The model selects
        sites through the `list_sites` tool, so "how did my sites do last month"
        is askable across all of them, and a site the caller is not a member of
        answers `SITE_NOT_FOUND` inside the tool loop exactly as it does outside.

        **What the assistant may read is the MCP tool table, verbatim**
        (ADR-0046, D3): `list_sites`, `site_overview`, `site_timeseries`,
        `top_pages`, `top_sources`, `geography`, `devices`, `sessions`, and —
        since ADR-0049 — the two owner-only revenue aggregates,
        `revenue_summary` and `revenue_timeseries`. Each tool call is dispatched
        as a real request against this API's own `/v1/read/*` route carrying the
        caller's session, so it re-runs the live-membership check, the scope
        ceiling (`site:read` + `analytics:read` + `revenue:read` and nothing
        else), the billing gate, the declared-range ceiling and the `elapsed_ms`
        cost budget. The revenue tools intersect with the owner-only capability,
        so any other role's call is refused with `FORBIDDEN` inside the tool
        loop — the same answer the dashboard gives. Per-customer revenue rows
        (`transactions`, `journey`) are not tools and are not on `/v1/read` at
        all (ADR-0043 D15), and realtime is not a tool: it mints a token rather
        than returning a read.

        Every tool result's `meta` block — freshness, partial-error and
        watermark metadata — is passed to the model unmodified, and the
        server-owned system prompt instructs it to distinguish `no_data`,
        `stale` and `degraded` from a real zero (ADR-0046, D9).

        **Bounds.** The payload is capped by message count, per-message bytes and
        total bytes; the tool loop is capped by iterations; the answer is capped
        by output tokens; the provider call is capped by a timeout. All are typed
        configuration with named environment defaults (ADR-0046, D7).

        **Roles.** Only `user` and `assistant` messages are accepted and the last
        message must be a `user` one. A `system`, `tool` or unknown role is
        `400 VALIDATION_FAILED` naming the field — not stripped, because a client
        that sends one is asking for something and must be told it was refused.
        The system prompt is the server's and is never client-influenced.

        **Quota.** A per-user ledger over a rolling 24 hourly buckets. The
        question is charged at accept — after validation, before the provider
        call — so a malformed request is free and a failed generation is not.
        Over the limit is `429` with `Retry-After`, deliberately **not** a `402`:
        the assistant is included in the plan, so there is nothing to buy
        (F-306; ADR-0046, D5). `GET /v1/assistant/usage` reports the window.

        **Disconnect aborts the provider call** (ADR-0046, D10). Closing the tab
        stops the generation rather than paying for tokens nobody will read.

        Nothing is stored server-side but the ledger rows: there is no
        conversation table, so the client sends the history it wants considered
        (ADR-0046, D12).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantQuestionRequest'
      responses:
        '200':
          description: |
            The answer stream. `text/event-stream`, on the
            `GET /v1/realtime/stream` precedent — OpenAPI 3.1 has no vocabulary
            for an event stream, so the schema is a string and the events are
            named here.

            Four named events:

            - `trace` — one per tool call, emitted before its result is used.
              Carries the trace id, the tool name, the arguments as dispatched
              and the read's response `meta`. This is the in-conversation
              provenance: which site was read, over which window, and how fresh
              the answer was, beside the sentence built from it. It is **not** a
              stored audit journal: an assistant question writes no audit row at
              all, because it dispatches with the caller's own session and a
              session is not a credential (ADR-0051 D11). A credential-
              authenticated read journals credential *events* — first use, and
              first use from a new source — and never one row per read, so what
              a credential read is still not recorded anywhere.
            - `delta` — assistant text as it is generated.
            - `done` — the terminal success event: input tokens, output tokens
              and the questions remaining in the window.
            - `error` — an `ErrorEnvelope`, in-band, with its stable `code` and
              `request_id`. An assistant failure is never prose inside a
              successful answer. A stream carrying `error` carries no `done`.

            Failures *before* the stream opens use the ordinary JSON envelope and
            their own status — the head is not committed yet — which is why the
            common refusals below are real status codes with real headers.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  An SSE stream. Not a single JSON document: a sequence of
                  `event:`/`data:` records named `trace`, `delta`, `done` or
                  `error`. An `error` event's `data` is an `ErrorEnvelope`.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AssistantUnavailable'

  /v1/assistant/usage:
    get:
      operationId: getAssistantUsage
      tags: [assistant]
      summary: The caller's assistant usage over the rolling window.
      description: |
        Always the signed-in user's own usage — there is no user parameter and no
        impersonation.

        Read from the per-user ledger the quota is enforced from, so the number
        shown and the number enforced cannot disagree. The window is **24 rolling
        hourly buckets**, not a calendar day: a daily row would reset at midnight
        UTC, which is a cliff, and would make `retry_after_seconds` a lie
        (ADR-0046, D5, on the `read_cost_ledger` precedent).

        Side-effect free and free of charge: asking how many questions are left
        never spends one.

        The token totals are a measurement rather than a budget — nothing refuses
        on them in v1. They exist because F-306 requires assistant usage to be
        reportable, so that a later per-plan limit is a lookup rather than a new
        mechanism.
      responses:
        '200':
          description: The caller's assistant usage over the current window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantUsage'
        '401':
          $ref: '#/components/responses/Unauthenticated'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: oa_session
      description: |
        Better Auth browser session, issued and validated under `/api/auth/*`.
        HttpOnly, SameSite=Lax and host-only (no `Domain`); over HTTPS it is also
        `Secure` and its name gains the `__Secure-` prefix (`__Secure-oa_session`)
        (docs snapshot 02 §19, 03 §7). The browser attaches it automatically with
        `credentials: include`; JavaScript never reads it. Auth operations
        themselves are the Better Auth surface, not part of this business
        contract.
    privateApiKey:
      type: http
      scheme: bearer
      description: |
        Private read key. Distinct prefix from the public tracking key; only the
        hash is stored server-side (docs snapshot 02 §20).
    oauthAccessToken:
      type: oauth2
      description: |
        An OAuth 2.1 access token, held by a **person** (ADR-0043 D1).

        Where it comes from: `oa login` runs RFC 8628's device flow — the CLI
        gets a code, a human approves it in a browser, and
        `POST /v1/oauth/device/token` exchanges it for this token. An MCP host
        runs the authorization-code flow with PKCE instead. Both are public
        clients with no secret.

        Only the authorization-code flow is expressible below: OpenAPI 3.1 has no
        flow object for RFC 8628, so the device flow is described here rather than
        declared. Its endpoints are `POST /api/auth/device/code` and
        `POST /v1/oauth/device/token`, and both are documented as paths.

        How it differs from `privateApiKey`, and this is the whole of the
        distinction: a key resolves to a **site** and never to a user, so it is a
        machine's credential that survives personnel changes; a token resolves to
        a **user**, so it can read every site they are a member of and stops
        being able to read one the moment that membership ends. Which site a
        given request is about is chosen with `X-OA-Site`, re-authorized against
        live membership on every request.

        **Two arms, one credential** (ADR-0048). The four read scopes reach
        `/v1/read/*` and `/mcp`. The seven below them are OAuth-only — no API key
        and no device-flow CLI token can ever carry one — and they reach a
        default-deny allowlist of ordinary business routes: the operations marked
        with this scheme alongside `sessionCookie`. A route not marked here is
        unreachable with a token whatever its scope string says, which is where
        deletion, member management, credentials and money all sit.

        A write scope is a **ceiling, never an authority**. Every allowlisted
        route re-runs its own capability check against live membership, so a
        viewer holding `funnels:write` writes nothing and is refused with
        `Insufficient capability for this operation`.
      flows:
        authorizationCode:
          authorizationUrl: /api/auth/oauth2/authorize
          tokenUrl: /api/auth/oauth2/token
          refreshUrl: /api/auth/oauth2/token
          scopes:
            'site:read': The sites you may select, and their install details.
            'analytics:read': The seven aggregate reads.
            'realtime:read': A realtime token for the selected site.
            'revenue:read': Revenue on the selected site, if you own it.
            'team:read': A site's members and invites, including their email addresses.
            'sites:write': Create a site; rename one or change its reporting timezone.
            'funnels:write': Create, edit and archive funnels.
            'events:write': Create, draft, publish and roll back event definitions.
            'widgets:write': Create, edit, enable and disable widgets.
            'share:write': Change a public dashboard's surfaces and rotate its link.
    realtimeBearer:
      type: http
      scheme: bearer
      description: |
        Short-lived `aud=realtime` scoped token, minted by
        `POST /v1/sites/{site_id}/realtime/token` (or the public token endpoint)
        and verified by the realtime gateway at connect time (docs snapshot 05,
        D-213). Lives at most 60 seconds (`REALTIME_TOKEN_TTL_SECONDS`); a new
        connection needs a fresh token. It travels in the `Authorization` header,
        never in the query string — a native `EventSource` cannot set the header,
        so the browser uses a `fetch` stream instead (docs snapshot 02 §17). The
        token binds the site; the stream never reads a site from a query
        parameter.

  schemas:
    ErrorCode:
      type: string
      description: |
        Stable machine-readable error code. Clients branch on this, never on
        `message` (docs snapshot 03 §6.1).
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - REAUTH_REQUIRED
        - SITE_SUSPENDED
        - SITE_NOT_FOUND
        - NOT_FOUND
        - VALIDATION_FAILED
        - PAYLOAD_TOO_LARGE
        - IDEMPOTENCY_CONFLICT
        - ALREADY_MEMBER
        - ACCOUNT_DELETION_BLOCKED
        - IMPORT_IN_PROGRESS
        - IMPORT_UPLOAD_MISSING
        - IMPORT_ROLLBACK_UNAVAILABLE
        - EXPORT_IN_PROGRESS
        - EXPORT_EXPIRED
        - REVENUE_ALREADY_CONNECTED
        - REVENUE_CREDENTIAL_REJECTED
        - RATE_LIMITED
        - RANGE_TOO_LARGE
        - RESOLUTION_NOT_AVAILABLE
        - EVENT_DEFINITION_NAME_TAKEN
        - EVENT_DEFINITION_VERSION_CONFLICT
        - IMPORT_FAILED
        - PROVIDER_UNAVAILABLE
        - DATA_NOT_READY
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, details]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Human-readable. Not a stable contract; do not parse.
            request_id:
              type: string
              description: Correlates the failure with server logs.
            details:
              type: object
              additionalProperties: true
              description: Safe, categorized detail. Never a raw stack trace.

    UtcInstant:
      type: string
      format: date-time
      description: ISO-8601 instant in UTC, always ending in `Z`.
      examples: ['2026-07-20T10:30:00.000Z']

    Timezone:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        IANA timezone identifier, used for grouping only. Validated against the
        server runtime's own timezone database rather than a pattern, so a
        well-formed but unknown identifier is rejected; it is never spliced into
        SQL. The bounds mirror `timezoneSchema`
        (`packages/contracts/src/time.ts`), which is the one validator every
        surface that takes a zone runs.
      examples: ['Asia/Baku']

    DateRange:
      type: object
      additionalProperties: false
      required: [from, to]
      description: Half-open UTC range. An instant equal to `to` is outside the range.
      properties:
        from:
          $ref: '#/components/schemas/UtcInstant'
        to:
          $ref: '#/components/schemas/UtcInstant'

    Resolution:
      type: string
      enum: [minute, hour, day, week]
      description: |
        Bucket granularity the response was served at. `minute`/`hour`/`day` name
        a rollup family directly; `week` is the ISO week (Monday start) in the
        request timezone, grouped at read time over the day or hour rollup.

    DataSource:
      type: string
      enum: [live, imported]
      description: |
        Where the numbers in a response came from: this system's own event
        pipeline, or a published provider import read beside it (ADR-0032, D5).

    Accuracy:
      type: string
      enum: [exact, estimated, provider_defined]
      description: |
        Whether a value is exact or derived from aggregate-only/import data
        (docs snapshot 02 §16).

    Freshness:
      type: object
      additionalProperties: false
      required: [as_of, resolution, provisional_through, finalized_through]
      description: |
        Lets a client tell a true zero apart from data that is not ready yet
        (docs snapshot 03 §6.2).
      properties:
        as_of:
          $ref: '#/components/schemas/UtcInstant'
        resolution:
          $ref: '#/components/schemas/Resolution'
        provisional_through:
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: Session-derived metrics stay revisable up to this instant.
        finalized_through:
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: Beyond this instant results no longer change.

    Currency:
      type: string
      minLength: 3
      maxLength: 3
      pattern: '^[A-Z]{3}$'
      description: |
        An uppercase ISO-4217 alphabetic code. Unconstrained by any supported
        list — this is a currency a provider reported, not one the customer
        chose (see `ReportingCurrency` for the latter).

    Money:
      type: object
      additionalProperties: false
      required: [amount_minor, currency]
      description: Minor-unit integer plus ISO-4217 currency. Never a float.
      properties:
        amount_minor:
          type: integer
          format: int64
          description: Signed. Refunds and adjustments are negative.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'

    CurrencyConversion:
      type: object
      additionalProperties: false
      required: [source, rate, rate_at]
      properties:
        source:
          type: string
          description: |
            Where the rate came from. `ecb` for a European Central Bank daily
            reference rate, `none` when the amount was already in the reporting
            currency and no conversion was needed.
        rate:
          type: number
          exclusiveMinimum: 0
          description: |
            Reporting-currency units per one original unit. **Diagnostic only** —
            it is a float, and the converted amounts beside it were computed from
            exact integer arithmetic over the rate string. Never re-multiply an
            amount by it.
        rate_at:
          description: |
            The **banking day** the rate was published for, as an instant at
            **that day's UTC midnight** — e.g. a rate from 2026-07-20 is
            `2026-07-20T00:00:00.000Z`. It is stored as a date and widened to an
            instant on the wire, because every other timestamp in this contract
            is one.

            Read it as a day, not as a moment: it does not claim the rate was
            fetched at midnight. It can be earlier than the transaction's own
            date — up to a week, over a holiday — because the conversion looks
            back for the newest published rate at or before the transaction.
          allOf:
            - $ref: '#/components/schemas/UtcInstant'

    CursorPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      description: |
        Cursor pagination. `has_more` is exact on the final page because the
        server over-fetches by one row (docs snapshot 03 §6.4).
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean

    HealthStatus:
      type: string
      enum: [ok, degraded, unavailable]

    DependencyHealth:
      type: object
      additionalProperties: false
      required: [name, status, detail]
      properties:
        name:
          type: string
        status:
          $ref: '#/components/schemas/HealthStatus'
        detail:
          type: [string, 'null']

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version, commit, environment, time, dependencies]
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        service:
          type: string
        version:
          type: string
        commit:
          type: string
        environment:
          type: string
        time:
          $ref: '#/components/schemas/UtcInstant'
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DependencyHealth'

    SiteId:
      type: string
      description: |
        Internal, opaque site resource id — the canonical id for every
        `/v1/sites` operation. It is not the public slug and never a tracking key
        (docs snapshot 03 §8).
      examples: ['019f8740-2b3c-7a10-9c1d-4e5f6a7b8c9d']

    SiteSlug:
      type: string
      description: Public, human-facing slug used only in frontend routes.
      pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
      examples: ['acme-metrics']

    SiteRole:
      type: string
      enum: [owner, admin, viewer]

    SiteStatus:
      type: string
      enum: [active, suspended, deleting, deleted]
      description: |
        `suspended` has three origins, not two: a lapsed entitlement, a
        D-010 cutover the successor could not fund, and — since ADR-0040 — a site
        created by a caller who has no plan yet. All three mean the same thing to
        every surface (do not ingest, do not serve); `suspended_at`
        distinguishes the never-funded case from the other two.

    SiteSummary:
      type: object
      additionalProperties: false
      required:
        [
          site_id,
          slug,
          name,
          status,
          role,
          is_billing_owner,
          domains,
          created_at,
          first_event_at,
          suspended_at,
          ingest_grace_until,
          retention_deadline,
          reporting_currency,
          reporting_timezone,
        ]
      properties:
        site_id:
          $ref: '#/components/schemas/SiteId'
        slug:
          $ref: '#/components/schemas/SiteSlug'
        name:
          type: string
        status:
          $ref: '#/components/schemas/SiteStatus'
        role:
          $ref: '#/components/schemas/SiteRole'
        is_billing_owner:
          type: boolean
          description: |
            Whether the caller is this site's billing owner. Only the billing
            owner reaches billing; a plain owner sees neither the payer's Stripe
            portal nor invoices (docs snapshot 03 §16).
        domains:
          type: array
          description: |
            The site's origin allowlist, normalized and de-duplicated. Always
            present, so an empty array unambiguously means "no allowlist
            configured" — which the collector reads as "accept any origin", not
            as deny-all (docs snapshot 02 §7.1 item 4). Replace this set with
            `PATCH /v1/sites/{site_id}`.
          items:
            $ref: '#/components/schemas/SiteDomain'
        created_at:
          description: |
            When the site was created; the frontend anchors its "All time"
            interval at this instant.
          allOf:
            - $ref: '#/components/schemas/UtcInstant'
        first_event_at:
          description: |
            When this site's first event reached the ingest pipeline, or `null`
            if none ever has — the install-verified signal (ADR-0027). Onboarding
            binds its "tracker installed" step to `first_event_at !== null`;
            there is no need to poll an analytics endpoint and guess what an
            empty result means.

            Always present, so `null` is a statement rather than a gap: it means
            "no event has ever been ingested for this site", not "unknown". The
            value is the event's `occurred_at` as the pipeline observed it, and
            it never changes once set — a later event that occurred earlier does
            not move it backwards, so a client may cache it forever.

            Filled by the batch worker once per site, so it appears within one
            batch flush (~1.5s) of the first event rather than instantly.
            Existing sites were not backfilled: a site that already had traffic
            before ADR-0027 shipped reports the first event to arrive *after*
            it.
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        suspended_at:
          description: |
            When this site was **moved** to `suspended`, or `null` if it
            was never moved there (ADR-0030). Always present, so `null` is a
            statement rather than a gap — never "unknown".

            Set together with `ingest_grace_until` and `retention_deadline` by
            the one transition that blocks a site, and cleared together with them
            on reactivation. A client never has to reconcile a partially-set
            triple.

            **`null` no longer implies the site is unblocked** (ADR-0040). A site
            created by a caller with no plan is born `suspended` and was
            therefore never moved there, so all three of these instants are
            `null` while `status` is `suspended`. Read the pair:

            - `status = 'active'` — running.
            - `status = 'suspended'`, `suspended_at = null` — **never
              funded**. Waiting for its first plan; it ingests nothing yet, it
              has no retention countdown, and it will not be deleted. Show
              "choose a plan", not "your data is about to be deleted".
            - `status = 'suspended'`, `suspended_at` set — **lapsed**.
              The ADR-0030 triple applies: grace, then the retention countdown.
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        ingest_grace_until:
          description: |
            The instant the collector stops accepting this site's events after a
            block (docs snapshot 05, D-012: 24 hours), or `null`.

            `null` on a blocked site is not "no deadline" — it is D-013: a site
            that was never entitled gets no grace at all, and its events are
            refused from the moment it blocked. On an active site it simply means
            no block is in force. `status` is what tells the two apart.
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        retention_deadline:
          description: |
            When this blocked site's retained analytics fall due for deletion
            (docs snapshot 05, D-007: 90 days after the block), or `null` while
            the site is active.

            This is the countdown the blocked screen shows. It is a snapshotted
            instant, not a value derived from the current retention policy: it
            was decided when the site blocked and does not move if the policy
            changes afterwards.
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        reporting_currency:
          description: |
            The currency every money figure this product shows for the site is
            denominated in (ADR-0033, D2c). Defaults to `USD`; changed with
            `PATCH /v1/sites/{site_id}`.

            On the site summary rather than only on the revenue surface, because
            a client that had to fetch a revenue endpoint before it could render
            a currency symbol would show the wrong one for the length of that
            request.
          allOf:
            - $ref: '#/components/schemas/ReportingCurrency'
        reporting_timezone:
          description: |
            The zone this site reports in (ADR-0044 D4, ADR-0079 D5). Always a
            zone: since migration 0046 every site has one, and `null` is neither
            sent nor accepted.

            It is the **default clock for every window this product cuts** —
            "Today", "Last 7 days" and every other range start and end on this
            zone's calendar, for the private dashboard, the public share board
            and every widget alike, so two viewers in two countries stop cutting
            different buckets behind one link. `users.timezone` (ADR-0026) is
            what a reader falls back to when there is no site to ask, and a
            reader who wants their own zone switches to it in the dashboard's
            header — a per-visit view that writes nothing here.

            Set with `PATCH /v1/sites/{site_id}` under `site:settings`. Changing
            it does **not** bump the tracker/ingest config generation — the
            collector has never heard of a reporting timezone.
          allOf:
            - $ref: '#/components/schemas/Timezone'

    ReportingCurrency:
      type: string
      pattern: '^[A-Z]{3}$'
      minLength: 3
      maxLength: 3
      description: |
        An uppercase ISO-4217 code from the supported set (ADR-0033, D2c).

        Validated against a **closed list**, not merely against the pattern: the
        set is the ECB daily reference currencies plus common provider
        settlement currencies. `ZZZ` matches the pattern, and a site set to it
        would get `conversion_source: "unavailable"` on every single transaction
        — an entirely empty revenue dashboard produced by a typo, with no error
        anywhere to explain it. An unsupported code is `VALIDATION_FAILED`.

        A code outside the ECB feed is accepted (refusing a customer their own
        settlement currency would be worse) with a consequence worth knowing:
        until a full-coverage FX source is justified, transactions in any *other*
        currency stay in the unconverted remainder rather than being converted.

    SiteDomain:
      type: string
      description: |
        A bare, lowercase hostname in a site's origin allowlist — no scheme, port,
        path, userinfo or wildcard. Stored normalized: lowercased, any trailing
        dot stripped, at most 253 characters with labels of at most 63.
      minLength: 1
      maxLength: 253
      examples: ['shop.example.com']

    CreateSiteRequest:
      type: object
      additionalProperties: false
      required: [slug, name]
      description: |
        A new site. The origin allowlist is not set here — configure it with
        `PATCH /v1/sites/{site_id}` once the site exists.
      properties:
        slug:
          $ref: '#/components/schemas/SiteSlug'
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display name; 1–200 characters after trimming.

    CreatedTrackingKey:
      type: object
      additionalProperties: false
      required: [id, public_token, key_prefix]
      description: |
        The `tracking_write` key minted with the site. `public_token` is the full
        browser ingest token and is not a secret — it is write-only and is never
        read authorization (docs snapshot 01 §3.2). No `private_read` key is
        created automatically.
      properties:
        id:
          type: string
        public_token:
          type: string
        key_prefix:
          type: string

    CreatedSite:
      type: object
      additionalProperties: false
      required: [site_id, slug, name, status, role, is_billing_owner, tracking_key, created_at]
      description: |
        The created site plus the tracking key minted in the same transaction, so
        onboarding can render the snippet without a second call. The creator is
        always the first `owner` member and the billing owner, and a site is never
        created `suspended`.
      properties:
        site_id:
          $ref: '#/components/schemas/SiteId'
        slug:
          $ref: '#/components/schemas/SiteSlug'
        name:
          type: string
        status:
          $ref: '#/components/schemas/SiteStatus'
        role:
          $ref: '#/components/schemas/SiteRole'
        is_billing_owner:
          type: boolean
        tracking_key:
          $ref: '#/components/schemas/CreatedTrackingKey'
        created_at:
          description: |
            When the site was created — the same instant `SiteSummary` carries,
            so onboarding can anchor "All time" without a follow-up read.
          allOf:
            - $ref: '#/components/schemas/UtcInstant'

    UpdateSiteRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        A partial site update; at least one property must be present. An empty
        object is `VALIDATION_FAILED` rather than a silent no-op. The slug is not
        editable.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display name; 1–200 characters after trimming.
        domains:
          type: array
          maxItems: 10
          description: |
            Replace-set semantics: this list becomes the site's exact origin
            allowlist. Entries are normalized (lowercased, one trailing dot
            stripped) and de-duplicated, preserving first-seen order. Each must be
            a bare hostname with at least one dot — no scheme, port, path, query,
            userinfo, whitespace, wildcard or underscore. At most 10 per site; an
            engineering bound, not a commercial one. An empty array clears the
            allowlist.
          items:
            $ref: '#/components/schemas/SiteDomain'
        reporting_currency:
          $ref: '#/components/schemas/ReportingCurrency'
        reporting_timezone:
          description: |
            The site's reporting zone (ADR-0044 D4, ADR-0079 D5).

            An IANA identifier, validated against the server runtime's own
            timezone database — a well-formed but unknown name is
            `VALIDATION_FAILED`, not a stored value that breaks every later
            read. **A UTC offset is refused**: `+05:00` is a timezone evaluated
            at one instant, it goes wrong twice a year and it goes wrong
            silently, so it is a `400` here rather than a one-hour seam in a
            chart (ADR-0026).

            **`null` is refused too.** It cleared the setting while the column
            was nullable; since migration 0046 there is no cleared state to
            return to, because every window the product cuts is cut on this
            zone. A reader who wants their own switches to it in the dashboard
            header, which changes their view and not the site.

            Setting it does not bump `config_version`.
          allOf:
            - $ref: '#/components/schemas/Timezone'

    DeleteSiteRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          type: string
          description: |
            Must equal the site's current `name`, exactly. The server compares it
            against the name it reads in this request, so a rename between the
            screen loading and the button being pressed refuses the delete rather
            than accepting a stale confirmation.

    SiteDeletionAccepted:
      type: object
      additionalProperties: false
      required: [deletion_request_id, status]
      properties:
        deletion_request_id:
          type: string
          format: uuid
          description: |
            The deletion this call started, or the one already running for this
            site. Stable across retries; an operator reads `deletion_targets` by
            it to see per-store progress.
        status:
          type: string
          enum: [deleting]
          description: |
            Always `deleting`. It is the site's status after this call, and it is
            what `GET /v1/sites/{site_id}` reports until the purge is verified.

    SiteResolution:
      type: object
      additionalProperties: false
      required: [site_id, slug]
      properties:
        site_id:
          $ref: '#/components/schemas/SiteId'
        slug:
          $ref: '#/components/schemas/SiteSlug'

    ApiKeyType:
      type: string
      enum: [tracking_write, private_read]
      description: |
        `tracking_write` is the public browser ingest key; `private_read` is a
        secret server key. A tracking_write key is never accepted as read
        authorization (docs snapshot 02 §20).

    SelectableSite:
      type: object
      additionalProperties: false
      required: [site_id, slug, name, status, role]
      properties:
        site_id:
          type: string
        slug:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/SiteStatus'
        role:
          description: |
            The caller's role on this site, for an OAuth token. **Null for a
            private key**, which has no membership and therefore no role — the
            same fact that closes `realtime:read` and `revenue:read` to it
            (ADR-0043, D5).

            It travels so a client can say *why* revenue is absent on a site —
            "you are an admin here" — instead of rendering an unexplained empty
            panel. It is a fact about the reader, never a grant.
          oneOf:
            - $ref: '#/components/schemas/SiteRole'
            - type: 'null'

    SelectableSiteList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SelectableSite'

    DeviceTokenRequest:
      type: object
      additionalProperties: false
      required: [grant_type, device_code, client_id]
      properties:
        grant_type:
          type: string
          enum: ['urn:ietf:params:oauth:grant-type:device_code']
        device_code:
          type: string
          description: The `device_code` returned by `POST /api/auth/device/code`.
        client_id:
          type: string
          description: |
            The client that requested the code. A code presented by a different
            client is `invalid_grant` — and the check runs before the polling
            stamp is written, so a stranger's poll cannot make the real device
            wait.

    DeviceTokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, refresh_token, scope]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until the access token expires.
        refresh_token:
          type: string
          description: |
            Renewed at `POST /api/auth/oauth2/token` with
            `grant_type=refresh_token`. That endpoint is the authorization
            server's own: this exchange writes a token row in the shape it
            issues and reads, so every renewal after the first is not ours.
        scope:
          type: string
          description: |
            The granted scopes, space-delimited (RFC 6749). May be **narrower**
            than what the device asked for: the grant is re-read through the
            server's vocabulary, so an unrecognized scope is dropped rather than
            honoured.

    DeviceTokenError:
      type: object
      additionalProperties: false
      required: [error, error_description]
      description: |
        RFC 8628 §3.5's refusal, not this API's `ApiError` envelope. The only
        place under `/v1` that shape is not used, because a client written
        against the RFC must be able to read this one.
      properties:
        error:
          type: string
          enum:
            - authorization_pending
            - slow_down
            - expired_token
            - access_denied
            - invalid_grant
            - invalid_request
          description: |
            `authorization_pending` and `slow_down` mean "keep polling"; every
            other value means stop. A client that treats `access_denied` as
            retryable polls forever after a human clicked Deny.
        error_description:
          type: string

    ClientRegistrationRequest:
      type: object
      required: [redirect_uris, token_endpoint_auth_method]
      description: |
        RFC 7591 client metadata. Unknown members are accepted and ignored
        (RFC 7591 §2), except the four listed under the response's `metadata`
        note, which are stored.
      properties:
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: uri
          description: |
            `https` for any host; `http` only on `127.0.0.1`, `[::1]` or
            `localhost` (any port). No wildcards, no fragments.
        token_endpoint_auth_method:
          type: string
          enum: [none]
          description: |
            Only `none` is accepted — every registered client is public.
            Omitting it means RFC 7591's default, `client_secret_basic`, and is
            refused with the same sentence.
        grant_types:
          type: array
          items:
            type: string
            enum: [authorization_code, refresh_token]
          description: Defaults to both. The device grant is not registrable.
        response_types:
          type: array
          items:
            type: string
            enum: [code]
        client_name:
          type: string
          maxLength: 120
          description: |
            Shown on the consent screen. Absent, the first redirect URI's host
            stands in.
        scope:
          type: string
          description: |
            Space-delimited. Intersected with the server's supported scopes and
            echoed; never an authorization.

    ClientRegistrationResponse:
      type: object
      additionalProperties: false
      required:
        [
          client_id,
          client_id_issued_at,
          client_name,
          redirect_uris,
          token_endpoint_auth_method,
          grant_types,
          response_types,
          scope,
        ]
      description: |
        RFC 7591 §3.2.1. No `client_secret` (the client is public) and no
        `registration_access_token` (RFC 7592's management protocol is not
        offered).
      properties:
        client_id:
          type: string
          description: '`dcr_` + 22 URL-safe characters.'
        client_id_issued_at:
          type: integer
          description: Seconds since the epoch.
        client_name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        token_endpoint_auth_method:
          type: string
          enum: [none]
        grant_types:
          type: array
          items:
            type: string
        response_types:
          type: array
          items:
            type: string
        scope:
          type: string

    ClientRegistrationError:
      type: object
      additionalProperties: false
      required: [error, error_description]
      description: |
        RFC 7591 §3.2.2's refusal, not this API's `ApiError` envelope — the
        same exception `DeviceTokenError` is.
      properties:
        error:
          type: string
          enum:
            - invalid_redirect_uri
            - invalid_client_metadata
            - too_many_requests
        error_description:
          type: string

    ApiKeySummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          type,
          name,
          key_prefix,
          public_token,
          scopes,
          held_by,
          rotation_required_at,
          created_at,
          last_used_at,
          revoked_at,
          expires_at,
        ]
      description: A key as shown in the UI. Never a private secret and never a hash.
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/ApiKeyType'
        name:
          type: [string, 'null']
        scopes:
          description: |
            What this key may do. Always present for a `private_read` key: a row
            stored before scopes existed reads as `["site:read"]`, the minimum,
            so no key silently widened when they arrived (ADR-0042, D3).

            `null` for a `tracking_write` key, which carries no scopes — it is
            an ingest identifier and is rejected on every read endpoint by type,
            before scopes are ever consulted.
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ApiKeyScope'
            - type: 'null'
        key_prefix:
          type: string
          description: Non-secret display prefix; never the full private secret.
        public_token:
          type: [string, 'null']
          description: |
            The full token — present only for a `tracking_write` key (it is
            public). Always null for a `private_read` key, whose raw value is
            shown once at creation and never again.
        held_by:
          $ref: '#/components/schemas/ApiKeyHolder'
        rotation_required_at:
          description: |
            When somebody who had been shown this key's secret left the site, or
            deleted their account, and the key was **kept alive anyway** because
            it is held by the site (ADR-0043, D8).

            Null is the ordinary state. Non-null means a person who no longer
            belongs here still knows this token's value: the key was not revoked
            because doing so would have taken a working installation down over a
            personnel change, so the exposure is reported instead. The remedy is
            rotation — mint a replacement, move the installation to it, revoke
            this one (ADR-0042, D2) — and the stamp clears because the row is
            replaced, not edited.

            The instant is the *earliest* unresolved departure, not the latest: a
            second one does not restart the clock on the first.
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/UtcInstant'
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        revoked_at:
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'

    ApiKeyHolder:
      type: string
      enum:
        - user
        - site
      description: |
        Who holds this key's secret once it has been shown (docs snapshot 02 §19,
        ADR-0043 D8). It decides what happens when that person leaves the site.

        - `user` — the person who minted it kept it. Revoked with their
          membership, and with their account. The default: an owner who does not
          say otherwise has not handed the token to anything.
        - `site` — it was installed into a machine (the WordPress plugin, a
          server-side job). It **survives** their departure, because revoking it
          would take a working installation down over a personnel change, and
          `rotation_required_at` is stamped instead.

        A `tracking_write` key is always `site`: it ships in the HTML of every
        page and is nobody's secret.

    ReadScope:
      type: string
      enum:
        - 'site:read'
        - 'analytics:read'
        - 'realtime:read'
        - 'revenue:read'
      description: |
        What a read credential may ask the `/v1/read` surface for (docs snapshot
        02 §20; ADR-0042 D3; ADR-0043 D4). **One vocabulary for both credential
        kinds** — a private key and an OAuth token carry these same strings
        rather than parallel dictionaries.

        - `site:read` — the credential's site context and install block
          (`GET /v1/read/site`) and the selectable-site list
          (`GET /v1/read/sites`). The minimum, always implied, and the default
          when a create request names no scopes.
        - `analytics:read` — the seven aggregate reads under
          `/v1/read/analytics/`. Never granted implicitly.
        - `realtime:read` — a realtime token for the selected site
          (`POST /v1/read/realtime/token`).
        - `revenue:read` — the revenue reads on the selected site.

        **A scope is a ceiling, never a floor.** It narrows what a credential may
        ask for; the underlying authorization still decides whether it gets it,
        and the two are intersected rather than substituted. A token carrying
        `revenue:read` whose user is an `admin` on the selected site reads no
        revenue, because revenue is an owner-only *capability* of the same name
        (ADR-0036 CP7). The scope did not grant it; it only failed to forbid it.

    ApiKeyScope:
      type: string
      enum:
        - 'site:read'
        - 'analytics:read'
      description: |
        The subset of `ReadScope` a `private_read` **key** may hold — permanently
        (ADR-0043, D5).

        Not a second vocabulary: the strings are `ReadScope`'s, and a contract
        test pins this enum as a subset of it. It is narrowed here because the
        create endpoint refuses the other two with `VALIDATION_FAILED`, and a
        request schema that advertised a scope the server rejects would be a
        contract that documents a call nobody can make.

        Both exclusions are one fact — **a key resolves to a site and never to a
        user**:

        - `realtime:read` mints a token anchored to a subject's access epoch, and
          revocation is a membership event. A key has no subject and no
          membership, so granting it would mean a second revocation system for a
          credential whose revocation is already "delete the row".
        - `revenue:read` is owner-only, and "owner" is a role on a membership. A
          key has none, so there would be nothing to check — the empty capability
          check ADR-0042 D3 refused when it declined to define a revenue scope at
          all.

        The answer to both is a different credential kind, not a wider key.

    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/ApiKeyType'
        name:
          type: string
        scopes:
          type: array
          description: |
            Scopes for a `private_read` key. Omitted, the key is minted with
            `["site:read"]` — the minimum scope, which is what §20 asks for.
            Rejected with `VALIDATION_FAILED` on a `tracking_write` key, which
            has no scopes to grant.

            `realtime:read` and `revenue:read` are `ReadScope`s that no key may
            hold and are `VALIDATION_FAILED` here (`code: not_available_to_keys`),
            not accepted-and-ignored: a key row listing a scope the resolver will
            never honour is a lie told once at mint time and read forever
            afterwards on the keys page (ADR-0043, D5).
          items:
            $ref: '#/components/schemas/ApiKeyScope'
        held_by:
          allOf:
            - $ref: '#/components/schemas/ApiKeyHolder'
          description: |
            Who will hold this key's secret. Omitted, `user` — the value that
            revokes the key when its holder leaves the site.

            Say `site` when the token is about to be installed into a machine
            rather than kept by a person: it is what keeps that installation
            working when its installer leaves, and it is a claim the key's
            creator is the only one who can make. Rejected with
            `VALIDATION_FAILED` on a `tracking_write` key, which is the site's
            by construction.

    CreatedApiKey:
      type: object
      additionalProperties: false
      required: [id, type, key_prefix, raw_token]
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/ApiKeyType'
        key_prefix:
          type: string
        raw_token:
          type: string
          description: |
            The full secret, returned exactly once. A `private_read` token is
            never retrievable again — store it now; a `tracking_write` token is
            also available later via `public_token`.

    SiteReadContext:
      type: object
      additionalProperties: false
      required: [site_id, slug, name, status, install]
      description: The site a private read key is scoped to. No membership role.
      properties:
        site_id:
          $ref: '#/components/schemas/SiteId'
        slug:
          $ref: '#/components/schemas/SiteSlug'
        name:
          type: string
        status:
          $ref: '#/components/schemas/SiteStatus'
        install:
          $ref: '#/components/schemas/SiteInstallContext'

    SiteInstallContext:
      type: object
      additionalProperties: false
      required: [tracking_key, script_url, collector_url]
      description: |
        What a server-side integration needs to install the browser tracker
        without a dashboard session (ADR-0042, D8) — the backend half of "script
        injection". Without it a WordPress administrator has to copy a snippet
        out of the dashboard and paste it into the plugin, which is the manual
        step the plugin exists to remove.

        Every member is required-and-nullable (the ADR-0027 convention): `null`
        states a fact the caller can render — this site has no live tracking key,
        or this deployment has not been told its collector's public URL — rather
        than an absence it has to infer.

        A read key returning something a tracker writes with looks wrong at first
        glance, so: **the tracking key is public.** It ships in the HTML of every
        page of the site, it is an ingest identifier and never read authorization
        (docs snapshot 01 §3.2), and the dashboard already renders it in plain
        text.
      properties:
        tracking_key:
          type: [string, 'null']
          description: |
            The site's newest un-revoked `tracking_write` token — the snippet's
            `data-key`. `null` when the site has no live tracking key.
        script_url:
          type: [string, 'null']
          description: |
            The `oa.js` bundle to load, served from the collector host
            (ADR-0020). `null` when the deployment has no `COLLECTOR_BASE_URL`
            configured, in which case the caller falls back to its own setting.
        collector_url:
          type: [string, 'null']
          description: The snippet's `data-collector` base — where the tracker posts.

    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          type: string
          description: |
            Must equal the signed-in account's own email address, exactly. The
            server compares it against the address on the session it just
            resolved, never against a value sent alongside it — a confirmation
            checked against the request's own body would confirm nothing.

    AccountDeletionAccepted:
      type: object
      additionalProperties: false
      required: [deletion_request_id]
      properties:
        deletion_request_id:
          type: string
          format: uuid
          description: |
            The deletion this call started, or the one already running for this
            account. Stable across retries; an operator reads `deletion_targets`
            by it to see per-store progress.

    AccountDeletionBlockingSite:
      type: object
      additionalProperties: false
      required: [site_id, slug, reason]
      description: |
        One entry of `details.blocking_sites` on an `ACCOUNT_DELETION_BLOCKED`
        error. Each names a site that must be resolved before the account can be
        deleted, and what resolving it means.
      properties:
        site_id:
          $ref: '#/components/schemas/SiteId'
        slug:
          type: string
          description: The site's slug, so the refusal can be rendered as a link.
        reason:
          type: string
          enum: [billing_owner, sole_owner]
          description: |
            `billing_owner` — this account pays for the site. Offer billing
            ownership to another owner and have them accept it, or delete the
            site.

            `sole_owner` — this account is the site's only owner. Promote another
            member to owner, or delete the site.

            A site can hold both roles at once; the entry reports
            `billing_owner`, the one that must be resolved first — a successor
            has to exist before there is anyone to promote.

    UserPreferences:
      type: object
      additionalProperties: false
      required: [timezone]
      description: |
        Account-level preferences for the signed-in user. User-level rather than
        site-level on purpose: one person has one mental clock and carries it
        across every site they can see (ADR-0026).
      properties:
        timezone:
          oneOf:
            - $ref: '#/components/schemas/Timezone'
            - type: 'null'
          description: |
            `null` means the user has never chosen a zone — it does **not** mean
            UTC. Fall back to the browser's own
            `Intl.DateTimeFormat().resolvedOptions().timeZone` and send that on
            analytics requests. The server deliberately stores no default: a
            guess would be wrong for most of the world and indistinguishable from
            someone who genuinely chose it.

    ConnectedAppList:
      type: object
      additionalProperties: false
      required: [apps]
      properties:
        apps:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedApp'

    ConnectedApp:
      type: object
      additionalProperties: false
      required:
        [client_id, name, scopes, active_token_count, first_authorized_at, last_authorized_at]
      description: |
        One OAuth client the signed-in user has connected (ADR-0048 D4).
      properties:
        client_id:
          type: string
          description: |
            The stable id — a first-party id (`oa-cli`, `oa-mcp`) or a
            dynamically registered `dcr_…` id. This is what
            `DELETE /v1/me/connected-apps/{client_id}` takes.
        name:
          type: string
          description: |
            A display name: the first-party product name, the name a client
            registered under (ADR-0047), or the id when neither resolves.
        scopes:
          type: array
          description: The scopes this client holds, across its live grants.
          items:
            type: object
            additionalProperties: false
            required: [scope, description]
            properties:
              scope:
                type: string
              description:
                type: string
                description: The scope in the words the consent screen uses.
        active_token_count:
          type: integer
          description: How many of this client's grants are still live.
        first_authorized_at:
          type: string
          format: date-time
        last_authorized_at:
          type: string
          format: date-time

    UpdateUserPreferencesRequest:
      type: object
      additionalProperties: false
      required: [timezone]
      properties:
        timezone:
          oneOf:
            - $ref: '#/components/schemas/Timezone'
            - type: 'null'
          description: |
            The zone to store, or `null` to clear the preference. The field must
            be present: an empty object is `VALIDATION_FAILED`, because a patch
            that names no field is a client bug and answering `200` to it would
            report success for a change nobody asked for.

    AuthProvider:
      type: object
      additionalProperties: false
      required: [id, kind]
      properties:
        id:
          type: string
          enum: [google, github, magic_link, password]
        kind:
          type: string
          enum: [oauth, email, password]
          description: |
            `oauth` redirects to the provider; `email` collects an address and
            sends a link; `password` collects an address and a password. The
            frontend needs the distinction to know which interaction shape to
            render.

            `password` appears only where `AUTH_PASSWORD_SIGNIN` is enabled,
            which is the same condition that decides whether the endpoints are
            mounted at all. It is off on the hosted deployment and on by default
            for a self-hosted one, where it is frequently the only door that
            needs no third-party account and no mail server.

    DeploymentSettingsClosedReason:
      type: string
      enum: [disabled, no_keyring, not_operator]
      description: |
        Why the deployment settings cannot be edited here.

        - `disabled` — `DEPLOYMENT_SETTINGS` is off. The environment is this
          deployment's configuration, which is what a multi-tenant install sets.
        - `no_keyring` — there is no usable `OA_CREDENTIAL_KEYRING`, so a secret
          could be stored but not protected. The whole surface closes rather than
          offering the half of it that carries no secret.
        - `not_operator` — the caller is not the account that claimed this
          deployment.

    DeploymentStoredSetting:
      type: object
      description: |
        One stored scope, as every read surface returns it: the non-secret fields
        verbatim, plus what can be said about the secret without disclosing it.
        Null when nothing is stored for that scope.
      required: [secret_set, secret_last4, updated_at]
      properties:
        host:
          type: string
          description: Mail scope only.
        port:
          type: integer
          description: Mail scope only.
        secure:
          type: boolean
          description: |
            Mail scope only. Implicit TLS from the first byte — set for port 465,
            left off for 587, where the connection is still upgraded through
            STARTTLS.
        user:
          type: string
          description: Mail scope only. Absent on an unauthenticated relay.
        from:
          type: string
          description: |
            Mail scope only. The envelope sender, which relays routinely require
            to be the authenticated mailbox. Accepts `Name <address>`.
        model:
          type: string
          description: Assistant scope only.
        base_url:
          type: string
          description: Assistant scope only.
        secret_set:
          type: boolean
        secret_last4:
          type: string
          description: |
            The last four characters of the stored secret, or empty — both when
            there is none and when it is too short for four characters to be a
            tail rather than most of it.
        updated_at:
          type: string
          format: date-time

    DeploymentSettings:
      type: object
      additionalProperties: false
      required: [editable]
      properties:
        editable:
          type: boolean
        reason:
          $ref: '#/components/schemas/DeploymentSettingsClosedReason'
        email:
          type: object
          additionalProperties: false
          required: [stored]
          description: |
            Only what the api can see. It holds no relay credential by design, so
            it cannot report whether the worker's environment configures mail —
            the test send answers that end to end.
          properties:
            stored:
              oneOf:
                - $ref: '#/components/schemas/DeploymentStoredSetting'
                - type: 'null'
        assistant:
          type: object
          additionalProperties: false
          required: [source, stored, environment]
          properties:
            source:
              type: string
              enum: [database, environment, none]
              description: Which configuration is in force. A stored key wins.
            stored:
              oneOf:
                - $ref: '#/components/schemas/DeploymentStoredSetting'
                - type: 'null'
            environment:
              description: |
                The non-secret half of `OPENAI_API_KEY`'s configuration, when the
                api has one. Null otherwise.
              oneOf:
                - type: object
                  additionalProperties: false
                  properties:
                    model:
                      type: string
                    base_url:
                      type: string
                - type: 'null'

    DeploymentEmailSettingsRequest:
      type: object
      additionalProperties: false
      required: [host]
      properties:
        host:
          type: string
          description: The relay's hostname. The one field with no defensible default.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 587
        secure:
          type: boolean
          description: |
            Defaults to true on port 465 and false everywhere else. False does
            not mean plaintext: the connection is still upgraded through STARTTLS
            when the relay advertises it, which is the whole of how 587 works.
        user:
          type: [string, 'null']
        password:
          type: [string, 'null']
          description: |
            Omit to keep the stored password, send a string to replace it, send
            `null` to remove it.
        from:
          type: [string, 'null']
          description: An address, or `Name <address>`.

    DeploymentAssistantSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        api_key:
          type: [string, 'null']
          description: |
            Omit to keep the stored key. Required when none is stored: a provider
            with no key is not a configuration.
        model:
          type: [string, 'null']
        base_url:
          type: [string, 'null']
          description: An http or https URL.

    DeploymentTestEmailStatus:
      type: object
      additionalProperties: false
      required: [status, attempts, reason, delivered_at]
      properties:
        status:
          type: string
          enum: [pending, delivered, failed]
        attempts:
          type: integer
        reason:
          type: [string, 'null']
          description: |
            The transport's categorized outcome — `unauthorized` (the relay
            rejected the credential), `unavailable` (it could not be reached),
            `invalid` (it refused the message) — never a raw relay reply.
            Populated on a `pending` row that has already failed once, because
            waiting four minutes to learn the password is wrong helps nobody.
        delivered_at:
          type: [string, 'null']
          format: date-time

    SiteMember:
      type: object
      additionalProperties: false
      required: [user_id, role, email, name]
      description: |
        A member of the site. `email` and `name` are returned to a caller who is
        already a member of the same site — the team screen has to name people,
        and the pending-invite list already returns the invitee's email, so
        withholding it here only made the two halves of one screen disagree.
      properties:
        user_id:
          type: string
        role:
          $ref: '#/components/schemas/SiteRole'
        email:
          type: string
          format: email
        name:
          type: [string, 'null']
          description: The account's display name. Null when it was never set.

    UpdateMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      description: |
        The role to set. Granting or revoking `owner` is restricted to a caller
        whose own role is `owner`, over and above the `team:manage` capability.
      properties:
        role:
          $ref: '#/components/schemas/SiteRole'

    SiteInvite:
      type: object
      additionalProperties: false
      required: [invite_id, email, role, invited_by_user_id, created_at, expires_at, status]
      description: |
        An actionable invitation: still live, or lapsed recently enough to be
        worth resending. The acceptance token is emailed and is never returned
        here or anywhere else.
      properties:
        invite_id:
          type: string
        email:
          type: string
          description: |
            The invited address, shown to a team manager who needs it. It is never
            written to the audit trail or to a log line (AGENTS.md).
        role:
          $ref: '#/components/schemas/SiteRole'
        invited_by_user_id:
          type: [string, 'null']
          description: |
            The user who sent the invitation, or `null` if that account has since
            been deleted — `site_invites.invited_by_user_id` is `ON DELETE SET
            NULL`, so the invitation outlives its sender.
        created_at:
          $ref: '#/components/schemas/UtcInstant'
        expires_at:
          $ref: '#/components/schemas/UtcInstant'
        status:
          type: string
          enum: [pending, expired]
          description: |
            `pending` — the emailed link still works; the row can be revoked or
            resent. `expired` — `expires_at` has passed and the link is dead;
            resending it mints a new token and revives the invitation.

            The server settles lapsed invitations before answering, so status
            and clock agree up to the instant of the read; treat `expires_at`
            as the authority if the two ever disagree. Accepted and revoked
            invitations are not returned at all.
          example: pending

    CreateInviteRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
        role:
          $ref: '#/components/schemas/SiteRole'

    InviteCreated:
      type: object
      additionalProperties: false
      required: [invite_id]
      description: The invite id. The acceptance token is emailed, never returned.
      properties:
        invite_id:
          type: string

    InviteResent:
      type: object
      additionalProperties: false
      required: [invite_id, expires_at, status]
      description: |
        The revived invitation. The new acceptance token is emailed, never
        returned; `expires_at` is the new deadline, so the screen can say when the
        fresh link dies without re-reading the list.
      properties:
        invite_id:
          type: string
        expires_at:
          $ref: '#/components/schemas/UtcInstant'
        status:
          type: string
          enum: [pending]
          description: |
            Always `pending` — a successful resend leaves the invitation live,
            including one that was `expired` a moment earlier.

    AcceptInviteRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string

    AcceptedInvite:
      type: object
      additionalProperties: false
      required: [site_id, role]
      properties:
        site_id:
          $ref: '#/components/schemas/SiteId'
        role:
          $ref: '#/components/schemas/SiteRole'

    EventId:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: |
        Lowercase UUIDv7, minted by the client before its first send attempt
        (docs snapshot 02 §7.1). Required: a server-generated id cannot
        deduplicate a retry whose response was lost.
      examples: ['0198c3f4-8f2a-7c31-9a1e-2b6f4d0c9e77']

    EventType:
      type: string
      description: |
        Canonical event type (docs snapshot 02 §8). `heartbeat` exists only on
        the realtime endpoint and is not accepted in a historical batch.
      enum:
        - page_view
        - custom_event
        - conversion
        - identify
        - engagement
        - web_vital
        - interaction
        - heartbeat

    EventProperties:
      type: object
      description: |
        Caller-defined scalars. At most 32 keys; keys are ≤40 characters and may
        not use the reserved `oa_` prefix; string values are ≤256 characters.
        Nested objects are rejected — they have no stable analytics column.
      maxProperties: 32
      additionalProperties:
        oneOf:
          - type: string
            maxLength: 256
          - type: number
          - type: boolean
          - type: 'null'

    EventPage:
      type: object
      additionalProperties: false
      required: [url]
      description: |
        Page context. The tracker strips the fragment and sensitive query keys
        before sending; the server sanitizes again and derives `path` and the
        UTM/referrer split itself.
      properties:
        url:
          type: string
          format: uri
          maxLength: 1024
        title:
          type: string
          maxLength: 256

    ClientContext:
      type: object
      additionalProperties: false
      required: [sdk, sdk_version]
      description: |
        SDK identity. Device, browser, OS and geo are derived by the server from
        the request; a client cannot state them.
      properties:
        sdk:
          type: string
          enum: [web, node, wordpress, mobile]
        sdk_version:
          type: string
          minLength: 1
          maxLength: 32
        test_mode:
          type: boolean
          deprecated: true
          description: |
            Deprecated and ignored (ADR-0068). Old snippets still send it, so
            the field stays accepted; the traffic is ordinary — visible and
            billable.

    InteractionPayload:
      type: object
      additionalProperties: false
      required: [x_percent, y_percent, viewport_class, viewport_width, selector]
      description: |
        Heatmap click signal (F-314, D-101). Passive and never billable.
        Coordinates are viewport percentages so a heatmap renders at any width.
        Element text arrives already redacted and truncated; the value of an
        input is never captured at any layer.
      properties:
        x_percent:
          type: number
          minimum: 0
          maximum: 100
        y_percent:
          type: number
          minimum: 0
          maximum: 100
        viewport_class:
          type: string
          enum: [mobile, tablet, desktop, wide]
        viewport_width:
          type: integer
          minimum: 0
          maximum: 20000
        selector:
          type: string
          minLength: 1
          maxLength: 256
        text:
          type: string
          maxLength: 128

    EngagementPayload:
      type: object
      additionalProperties: false
      required: [active_ms, visible_ms]
      description: Visible and active time. Usage weight 0 (D-101).
      properties:
        active_ms:
          type: integer
          minimum: 0
          maximum: 86400000
        visible_ms:
          type: integer
          minimum: 0
          maximum: 86400000

    WebVitalPayload:
      type: object
      additionalProperties: false
      required: [metric, value]
      description: One Core Web Vitals measurement. Usage weight 0 (D-101).
      properties:
        metric:
          type: string
          enum: [LCP, CLS, INP, FCP, TTFB]
        value:
          type: number
          minimum: 0
        rating:
          type: string
          enum: [good, needs-improvement, poor]
        navigation_type:
          type: string
          enum: [navigate, reload, back-forward, prerender, restore]

    ClientEventBase:
      type: object
      required: [event_id, type, occurred_at]
      properties:
        event_id:
          $ref: '#/components/schemas/EventId'
        type:
          $ref: '#/components/schemas/EventType'
        occurred_at:
          allOf:
            - $ref: '#/components/schemas/UtcInstant'
          description: |
            Client clock. Older than `accepted_at - 24h` is rejected; more than 5
            minutes ahead is clamped to `accepted_at` with `clock_skewed=true`
            (docs snapshot 05, D-016).
        client_session_id:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Session hint only. The server HMACs it site-scoped and rebuilds the
            canonical session itself (docs snapshot 02 §10).
        action_id:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Correlates events produced by one browser action. It carries no
            billing meaning and is not a batch-wide discount: the server uses it
            for exactly the case D-101 documents — a raw `custom_event` and a
            no-code rule describing the same click bill once. A `page_view` or
            `conversion` sharing the id is charged normally.
        page:
          $ref: '#/components/schemas/EventPage'
        referrer:
          type: string
          maxLength: 1024
          description: |
            The document referrer, as the browser reported it. The server owns
            what becomes of it: it is reduced to a canonical domain (lowercase,
            no `www.`, no port) and dropped entirely when it resolves to one of
            the site's own hosts, because an internal navigation has no
            acquisition source (ADR-0028).
        properties:
          $ref: '#/components/schemas/EventProperties'

    ClientEvent:
      description: |
        One event as a client may send it. Strict: `site_id`, geo,
        `billing_user_id`, `billing_assignment_version`, `usage_window_id`,
        `billable`, `accepted_at`, `received_at`, `clock_skewed` and
        `ingest_generation` are absent from the schema, so sending one fails
        validation instead of being ignored.
      oneOf:
        - $ref: '#/components/schemas/PageViewEvent'
        - $ref: '#/components/schemas/CustomEvent'
        - $ref: '#/components/schemas/ConversionEvent'
        - $ref: '#/components/schemas/IdentifyEvent'
        - $ref: '#/components/schemas/EngagementEvent'
        - $ref: '#/components/schemas/WebVitalEvent'
        - $ref: '#/components/schemas/InteractionEvent'
      discriminator:
        propertyName: type
        mapping:
          page_view: '#/components/schemas/PageViewEvent'
          custom_event: '#/components/schemas/CustomEvent'
          conversion: '#/components/schemas/ConversionEvent'
          identify: '#/components/schemas/IdentifyEvent'
          engagement: '#/components/schemas/EngagementEvent'
          web_vital: '#/components/schemas/WebVitalEvent'
          interaction: '#/components/schemas/InteractionEvent'

    PageViewEvent:
      allOf:
        - $ref: '#/components/schemas/ClientEventBase'
        - type: object
          required: [page]
          properties:
            type:
              const: page_view
            page:
              $ref: '#/components/schemas/EventPage'

    CustomEvent:
      allOf:
        - $ref: '#/components/schemas/ClientEventBase'
        - type: object
          required: [name]
          properties:
            type:
              const: custom_event
            name:
              $ref: '#/components/schemas/EventName'

    ConversionEvent:
      allOf:
        - $ref: '#/components/schemas/ClientEventBase'
        - type: object
          required: [name]
          properties:
            type:
              const: conversion
            name:
              $ref: '#/components/schemas/EventName'

    IdentifyEvent:
      allOf:
        - $ref: '#/components/schemas/ClientEventBase'
        - type: object
          required: [external_user_id]
          properties:
            type:
              const: identify
            external_user_id:
              type: string
              minLength: 1
              maxLength: 128
              description: |
                The customer's own user id. Must not be raw PII; the server
                HMACs it site-scoped before storage (docs snapshot 02 §10).

    EngagementEvent:
      allOf:
        - $ref: '#/components/schemas/ClientEventBase'
        - type: object
          required: [engagement]
          properties:
            type:
              const: engagement
            engagement:
              $ref: '#/components/schemas/EngagementPayload'

    WebVitalEvent:
      allOf:
        - $ref: '#/components/schemas/ClientEventBase'
        - type: object
          required: [web_vital]
          properties:
            type:
              const: web_vital
            web_vital:
              $ref: '#/components/schemas/WebVitalPayload'

    InteractionEvent:
      allOf:
        - $ref: '#/components/schemas/ClientEventBase'
        - type: object
          required: [interaction]
          properties:
            type:
              const: interaction
            interaction:
              $ref: '#/components/schemas/InteractionPayload'

    EventName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:-]*$'

    EventBatch:
      type: object
      additionalProperties: false
      required: [schema_version, tracking_key, sent_at, context, events]
      description: |
        Historical batch body. At most 100 events and 256 KiB decoded (64 KiB
        compressed on the wire). `event_id` values are unique within the batch.
      properties:
        schema_version:
          type: integer
          const: 1
        tracking_key:
          type: string
          minLength: 8
          maxLength: 64
          description: |
            The public, write-only tracking key. It travels in the body because
            `navigator.sendBeacon` cannot set a header and a query string would
            copy the key into every access log on the path.
        sent_at:
          allOf:
            - $ref: '#/components/schemas/UtcInstant'
          description: Client clock at send time. Diagnostic only; never a billing input.
        context:
          $ref: '#/components/schemas/ClientContext'
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ClientEvent'

    EventBatchAccepted:
      type: object
      additionalProperties: false
      required: [accepted, duplicate]
      description: |
        First acceptance and a duplicate retry share one status (docs snapshot 05,
        D-209); the counts say which happened.
      properties:
        accepted:
          type: integer
          minimum: 0
        duplicate:
          type: integer
          minimum: 0

    HeartbeatRequest:
      type: object
      additionalProperties: false
      required: [schema_version, tracking_key, sent_at, context]
      description: |
        Realtime presence only. No `event_id`: nothing deduplicates a heartbeat,
        and a failed write is simply retried by the next interval.
      properties:
        schema_version:
          type: integer
          const: 1
        tracking_key:
          type: string
          minLength: 8
          maxLength: 64
        sent_at:
          $ref: '#/components/schemas/UtcInstant'
        context:
          $ref: '#/components/schemas/ClientContext'
        client_session_id:
          type: string
          minLength: 1
          maxLength: 64
        page:
          $ref: '#/components/schemas/EventPage'

    RealtimeTokenResponse:
      type: object
      additionalProperties: false
      required: [token, expires_at, epoch_check_seconds]
      description: |
        A short-lived realtime stream token and the metadata a client needs to use
        it (docs snapshot 05, D-213). The token is opaque; `epoch_check_seconds`
        is the cadence at which the gateway re-checks the access epoch, so the
        client knows how quickly a revocation takes effect.
      properties:
        token:
          type: string
          minLength: 1
          description: Opaque `aud=realtime` bearer token. Lives at most 60 seconds.
        expires_at:
          $ref: '#/components/schemas/UtcInstant'
        epoch_check_seconds:
          type: integer
          minimum: 1
          maximum: 15

    RealtimeSnapshot:
      type: object
      additionalProperties: false
      required:
        - type
        - generated_at
        - active_visitors
        - pages
        - countries
        - devices
        - browsers
        - operating_systems
        - cities
        - events
        - present
      description: |
        The private active-visitor snapshot (docs snapshot 02 §17, ADR-0024,
        ADR-0035). Six bounded breakdowns, each under the same top-10 rule.
        `cities` is private-surface only — `PublicRealtimeSnapshot` is a separate
        schema with `active_visitors` alone, so no city can reach the public
        surface — and G-008 coarsening stays a historical-read concern. Browser
        and OS labels are the classifier's own values; presentation (title-casing,
        icons) is the client's job.

        `present` names the visitors behind `active_visitors` (ADR-0035). A
        visitor counts as here for **5 minutes** after their last signal, and a
        **hidden tab stops signalling immediately** — a backgrounded tab is not a
        visitor on the site.

        Every `visitors` number on this snapshot is a **presence count** — how
        many identities are inside the 5-minute window, per label — not the
        per-bucket page-view population `OverviewTotals.visitors` defines
        (ADR-0036). Presence is refreshed by any accepted signal, including
        heartbeats, so these counts have no ordering relation to pageviews.
      properties:
        type:
          type: string
          const: snapshot
        generated_at:
          $ref: '#/components/schemas/UtcInstant'
        active_visitors:
          type: integer
          minimum: 0
        pages:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [path, visitors]
            properties:
              path:
                type: string
              visitors:
                type: integer
                minimum: 0
        countries:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [country, visitors]
            properties:
              country:
                type: string
                maxLength: 7
                description: A two-letter country code, or the literal `unknown`.
              visitors:
                type: integer
                minimum: 0
        devices:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [device_type, visitors]
            properties:
              device_type:
                type: string
                enum: [desktop, mobile, tablet, unknown]
              visitors:
                type: integer
                minimum: 0
        browsers:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [browser, visitors]
            properties:
              browser:
                type: string
                description: Browser family as the UA classifier emits it, e.g. `chrome`.
              visitors:
                type: integer
                minimum: 0
        operating_systems:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [os, visitors]
            properties:
              os:
                type: string
                description: OS family as the UA classifier emits it, e.g. `windows`.
              visitors:
                type: integer
                minimum: 0
        cities:
          type: array
          maxItems: 10
          description: |
            Coarse GeoLite2 city names for the visitors currently active
            (ADR-0024). Private surface only.
          items:
            type: object
            additionalProperties: false
            required: [city, visitors]
            properties:
              city:
                type: string
              visitors:
                type: integer
                minimum: 0
        events:
          type: array
          maxItems: 50
          description: |
            The site's most recent page views, newest first (ADR-0024). Private
            surface only.

            Carried on the snapshot rather than pushed as its own event type: the
            stream's replay model is "a snapshot supersedes every missed delta"
            (ADR-0016), and a separate event-push protocol would reintroduce
            exactly the delta a reconnecting client could double-apply. Render
            this list as it arrives; never append it to a client-side copy.

            This is a live feed, not a history — entries expire with the traffic
            that produced them. The hours-deep "earlier" list is
            `GET /v1/sites/{site_id}/analytics/recent-visitors`.
          items:
            $ref: '#/components/schemas/RealtimeFeedEvent'
        present:
          type: array
          maxItems: 50
          description: |
            Who is here right now, newest last-seen first (ADR-0035). Private
            surface only.

            `active_visitors` stays the authoritative count — it is a ZCOUNT over
            the whole presence set, while this list is bounded at 50. On a busier
            site `present.length < active_visitors`, and the difference is real:
            name the ones you were given and state the rest as a count.

            This is presence's own state, not the page-view feed's. A visitor kept
            alive by heartbeats alone appears here with no `events` entry to their
            name, which is exactly the case a board could not render before.

            Replaced, never accumulated — the same rule `events` follows.
          items:
            $ref: '#/components/schemas/RealtimePresentVisitor'

    RealtimePresentVisitor:
      type: object
      additionalProperties: false
      required:
        - visitor
        - last_seen_at
        - path
        - country
        - device_type
        - browser
        - os
      description: |
        One visitor who is on the site right now (ADR-0035).

        `visitor` is the D-102 anonymous identity — the same value
        `RealtimeFeedEvent.visitor` carries, so a row joins to the feed on it to
        recover page history and referrer. It **rotates at UTC midnight**: a
        visitor whose session crosses midnight appears under two unlinkable
        values, which is the privacy decision D-102 makes rather than a defect to
        work around in a client.

        Every label is nullable because presence stores what it was told — a
        heartbeat with no page leaves `path` null, a GeoLite2 or UA miss leaves
        the rest null. `null` means *not recorded*, which is a different
        statement from the `unknown` bucket.

        There is deliberately **no city on this row**. ADR-0024 admits a city to
        the private snapshot as an aggregate, which names nobody; a per-visitor
        city joined to that visitor's own path, browser and OS is a different
        disclosure and this surface does not make it.
      properties:
        visitor:
          type: string
          description: The D-102 daily-rotating, site-scoped anonymous visitor hash.
        last_seen_at:
          $ref: '#/components/schemas/UtcInstant'
        path:
          type: [string, 'null']
        country:
          type: [string, 'null']
          maxLength: 7
          description: A two-letter country code, the literal `unknown`, or null.
        device_type:
          type: [string, 'null']
          enum: [desktop, mobile, tablet, unknown, null]
        browser:
          type: [string, 'null']
        os:
          type: [string, 'null']

    RealtimeFeedEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - occurred_at
        - visitor
        - path
        - country
        - device_type
        - browser
        - os
        - referrer
      description: |
        One page view on the private realtime feed (ADR-0024).

        `visitor` is the D-102 anonymous identity: a site-scoped HMAC that
        **rotates at UTC midnight**. A visitor whose session crosses midnight
        appears under two different values and the two cannot be linked — the
        privacy decision D-102 makes, not a defect to work around in a client.

        Every field is the sanitized value the persisted event carries: a path
        with no query or fragment, a referrer domain, coarse geo and UA labels.
        No raw URL, IP or user-agent string appears on the feed.
      properties:
        event_id:
          type: string
        occurred_at:
          $ref: '#/components/schemas/UtcInstant'
        visitor:
          type: string
          description: The D-102 daily-rotating, site-scoped anonymous visitor hash.
        path:
          type: string
        country:
          type: [string, 'null']
          maxLength: 7
          description: A two-letter country code, the literal `unknown`, or null.
        device_type:
          type: [string, 'null']
          enum: [desktop, mobile, tablet, unknown, null]
        browser:
          type: [string, 'null']
        os:
          type: [string, 'null']
        referrer:
          type: [string, 'null']
          description: |
            Referrer domain from the shared resolver — the same canonical,
            external-only value the stored event carries, so the live feed and
            the report never disagree. Null for Direct and for a navigation
            inside the site itself (ADR-0028).

    PublicRealtimeSnapshot:
      type: object
      additionalProperties: false
      required: [type, generated_at, active_visitors]
      description: |
        The public snapshot allowlist — a deliberately separate, narrower schema
        from `RealtimeSnapshot` (docs snapshot 05, D-213: the public payload never
        reuses the private shape). Only the active-visitor count is exposed.
      properties:
        type:
          type: string
          const: snapshot
        generated_at:
          $ref: '#/components/schemas/UtcInstant'
        active_visitors:
          type: integer
          minimum: 0

    RealtimeControl:
      type: object
      additionalProperties: false
      required: [type, action, reason]
      description: |
        A control message on the realtime stream (docs snapshot 02 §17): a
        `disconnect` on revocation or fail-closed, or a `degraded`/`recovered`
        transition. The disconnect reasons cover a revoked member and the
        fail-closed path.
      properties:
        type:
          type: string
          const: control
        action:
          type: string
          enum: [disconnect, degraded, recovered]
        reason:
          type: string
          enum:
            - access_revoked
            - auth_unreachable
            - token_expired_reconnect
            - snapshot_unavailable
            - ok

    TrackerConfig:
      type: object
      additionalProperties: false
      required:
        - config_version
        - site_timezone
        - allowed_domains
        - redact_query_keys
        - interaction_sampling
        - heartbeat_interval_seconds
        - features
        - attributed_revenue
        - no_code_rules
      description: |
        Per-site tracker configuration (docs snapshot 02 §11). Contains no
        credential: the tracking key is write-only and is never returned here.
      properties:
        config_version:
          type: integer
          minimum: 1
          description: Incremented by any dashboard change; drives cache invalidation.
        site_timezone:
          $ref: '#/components/schemas/Timezone'
        allowed_domains:
          type: array
          maxItems: 100
          items:
            type: string
        redact_query_keys:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 64
        interaction_sampling:
          type: number
          minimum: 0
          maximum: 1
          description: Fraction of clicks reported as heatmap `interaction` signals.
        heartbeat_interval_seconds:
          type: integer
          minimum: 5
          maximum: 100
          description: |
            Realtime presence interval, in seconds.

            The ceiling is derived from the presence window rather than chosen
            (ADR-0035): three intervals must fit inside the 5-minute window, so a
            visitor survives two consecutive lost heartbeats. It was 300 — the
            whole window — which left the pair configurable into a permanently
            flickering board.

            The tracker sends nothing while the document is hidden, at any
            interval: a backgrounded tab is not a visitor on the site.
        features:
          type: object
          additionalProperties: false
          required: [web_vitals, engagement, interactions, heartbeat]
          properties:
            web_vitals:
              type: boolean
            engagement:
              type: boolean
            interactions:
              type: boolean
            heartbeat:
              type: boolean
        attributed_revenue:
          type: boolean
          description: |
            Whether this site's browsers may send the revenue-linking hint —
            the `order_id` property of a `conversion` event, which the revenue
            matcher joins a charge to a visitor on (ADR-0033 D6 signal 1).

            Outside `features` on purpose. Those are measurement signals and
            default on; this one defaults **off** (ADR-0064 D4a), because
            sending it is what turns a count into a link to a named customer.
            It is not a substitute for consent. With it off, no hint is sent
            even from a visitor who granted consent. With it on, the hint
            travels with any event the privacy gate already allows — and under
            the shipped default (`requireConsent: false`) that includes a
            visitor who has never answered a consent prompt. The obligation
            that comes with linking a visitor to an order is the site's, and
            the tracker does not withhold the hint on its behalf (ADR-0064).
        no_code_rules:
          type: array
          maxItems: 50
          description: |
            Dashboard-defined no-code rules the tracker runtime evaluates
            (ADR-0034).

            **This shape changed in M13, deliberately**, and this document
            carried the superseded one until 2026-08-05. M4 guessed it against
            no implementation: `{rule_id, name, selector, event}` with an
            `event` enum of `click | submit | view`, max 200. `view` was never
            a browser primitive anyone had designed, the property mapping the
            feature needs had nowhere to live, and 200 was a number with no
            measurement behind it. Narrowing a published contract is only free
            while every site is served an empty list, which was true until M13.

            The maximum is **50**, from the worst case per click ADR-0034 D2
            states: 50 rules x one `closest()` each, over an ancestor chain,
            against a selector of at most 12 simple parts. The server enforces
            it at publish time (`MAX_PUBLISHED_RULES_PER_SITE`), so this bound
            describes what can be served rather than merely what is allowed.
          items:
            type: object
            additionalProperties: false
            required: [rule_id, name, version, trigger]
            properties:
              rule_id:
                type: string
                minLength: 1
              name:
                allOf:
                  - $ref: '#/components/schemas/EventName'
                description: The canonical event name a match produces.
              version:
                type: integer
                minimum: 1
                description: |
                  The definition version this rule came from, so "which rules
                  was this browser running" has an answer that does not depend
                  on guessing from the config epoch.
              trigger:
                type: string
                enum: [click, submit, url_pattern]
              selector:
                type: string
                minLength: 1
                maxLength: 256
                description: |
                  Present for `click` and `submit`. A restricted grammar, not
                  full CSS: type, class, id and allowlisted attribute selectors
                  joined by descendant or child combinators, bounded at 4
                  compound and 12 simple selectors (ADR-0034 D2).
              url_pattern:
                type: string
                minLength: 1
                maxLength: 512
                description: |
                  Present for `url_pattern`. A path glob — `*` within a
                  segment, `**` across segments — never a regular expression.
              properties:
                type: array
                maxItems: 8
                description: |
                  Property mappings the rule applies to the event it produces
                  (ADR-0034 D8). A rule may read structure; it may never read
                  what a person typed.
                items:
                  type: object
                  additionalProperties: false
                  required: [key, source]
                  properties:
                    key:
                      type: string
                      minLength: 1
                      maxLength: 40
                      pattern: '^[a-zA-Z_][a-zA-Z0-9_.-]*$'
                      description: |
                        The `oa_` prefix is reserved and refused; the server
                        rejects such a key rather than storing it.
                    source:
                      type: string
                      enum:
                        [
                          text,
                          element_tag,
                          page_path,
                          page_url,
                          page_title,
                          attribute,
                          url_param,
                          constant,
                        ]
                    argument:
                      type: string
                      maxLength: 256
                      description: |
                        The attribute name, query-parameter key or literal, for
                        the three sources that take one.

    PersistedEvent:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - event_id
        - site_id
        - type
        - name
        - occurred_at
        - received_at
        - accepted_at
        - clock_skewed
        - ingest_generation
        - billing_user_id
        - billing_assignment_version
        - usage_window_start
        - usage_window_id
        - billing_grace
        - billable
        - anonymous_id
        - session_id
        - user_id
        - page
        - source
        - properties
        - context
      description: |
        The server envelope (docs snapshot 02 §8) — what the pipeline persists,
        not what a client sends. Every field a client is structurally unable to
        state appears here: site, geo, billing user and assignment version, usage
        window, `billable`, `accepted_at` and `ingest_generation`.
      properties:
        schema_version:
          type: integer
          const: 1
        event_id:
          $ref: '#/components/schemas/EventId'
        site_id:
          $ref: '#/components/schemas/SiteId'
        type:
          $ref: '#/components/schemas/EventType'
        name:
          type: [string, 'null']
        occurred_at:
          $ref: '#/components/schemas/UtcInstant'
        received_at:
          allOf:
            - $ref: '#/components/schemas/UtcInstant'
          description: When the request arrived.
        accepted_at:
          allOf:
            - $ref: '#/components/schemas/UtcInstant'
          description: |
            When validation completed. Usage is billed at this clock; analytics
            buckets at `occurred_at` (docs snapshot 05, D-015).
        clock_skewed:
          type: boolean
          description: Set when `occurred_at` was clamped forward from the future.
        ingest_generation:
          type: integer
          minimum: 0
        billing_user_id:
          type: string
        billing_assignment_version:
          type: integer
          minimum: 0
        usage_window_start:
          allOf:
            - $ref: '#/components/schemas/UtcInstant'
          description: |
            `starts_at` of the usage window this event bills into. The collector
            snapshots the deterministic half of the window key; the worker mints
            `usage_window_id` with its idempotent compute-or-create, because the
            collector performs no Postgres write on the ingest path.
        usage_window_id:
          type: [string, 'null']
        billing_grace:
          type: boolean
          description: |
            Accepted under the 24-hour ingest grace of a `suspended` site
            (docs snapshot 05, D-012). Such usage stays with the blocked billing
            user and is never carried to a later owner.
        billable:
          type: boolean
          description: Server-computed usage class (D-101). Never echoed from a request.
        anonymous_id:
          type: string
          description: |
            Site-scoped, UTC-daily rotating HMAC. Derived from the raw IP, which
            is discarded immediately afterwards (docs snapshot 05, D-102).
        session_id:
          type: [string, 'null']
        user_id:
          type: [string, 'null']
        page:
          type: ['object', 'null']
          additionalProperties: false
          required: [url, path, title]
          properties:
            url:
              type: string
            path:
              type: string
            title:
              type: [string, 'null']
        source:
          type: object
          additionalProperties: false
          required:
            - referrer_domain
            - referrer_path
            - utm_source
            - utm_medium
            - utm_campaign
            - utm_content
            - utm_term
            - click_id_source
            - ref_source
          properties:
            referrer_domain:
              type: [string, 'null']
              description: |
                The canonical external referrer host — lowercase, no `www.`, no
                port. Null when the visitor arrived with no referrer and when
                the referrer was one of the site's own hosts; both are Direct
                (ADR-0028).

                It may also be a source **derived from the landing URL** when
                the browser sent no referrer at all: from a `?ref=` tag
                (ADR-0077, D-R1) or from a paid click id (ADR-0075, D-C1).
                `ref_source` and `click_id_source` below are how a derived
                value is told from a reported one. A derived value is usually a
                host, and for a `?ref=` label with no known host it is the label
                itself.
            referrer_path:
              type: [string, 'null']
              description: |
                Null whenever `referrer_domain` is, and null for a derived
                domain — a tag or a click id names the source, not a page on
                it.
            click_id_source:
              type: [string, 'null']
              description: |
                The click-id query key `referrer_domain` was derived from
                (`gclid`, `fbclid`, `msclkid`, `twclid`, `ttclid`, `li_fat_id`,
                `igshid`, `yclid`, `gclsrc`), or null when the browser reported
                the referrer itself (ADR-0075, D-C1).

                Never the click id's **value**: that is stored `[redacted]` like
                every other opaque query value and stays that way (D-C2). The
                presence of the key is the whole signal.
            ref_source:
              type: [string, 'null']
              description: |
                The normalized `?ref=` value `referrer_domain` was derived from,
                or null when the browser reported the referrer itself
                (ADR-0077, D-R1).

                Holds the **value** where `click_id_source` holds a key: a
                `ref` tag has one key and carries its whole signal in the value.
                The two are mutually exclusive — both fill `referrer_domain`,
                and only one inference runs.
            utm_source:
              type: [string, 'null']
            utm_medium:
              type: [string, 'null']
            utm_campaign:
              type: [string, 'null']
            utm_content:
              type: [string, 'null']
            utm_term:
              type: [string, 'null']
        properties:
          $ref: '#/components/schemas/EventProperties'
        context:
          type: object
          additionalProperties: false
          required: [sdk, sdk_version, device_type, browser, os, country, city]
          properties:
            sdk:
              type: string
            sdk_version:
              type: string
            device_type:
              type: [string, 'null']
            browser:
              type: [string, 'null']
            os:
              type: [string, 'null']
            country:
              type: [string, 'null']
            city:
              type: [string, 'null']
        interaction:
          oneOf:
            - $ref: '#/components/schemas/InteractionPayload'
            - type: 'null'
        engagement:
          oneOf:
            - $ref: '#/components/schemas/EngagementPayload'
            - type: 'null'
        web_vital:
          oneOf:
            - $ref: '#/components/schemas/WebVitalPayload'
            - type: 'null'

    # ---- Analytics read (Milestone 7) ------------------------------------
    ShareSlug:
      type: string
      description: |
        Opaque public-dashboard share slug. Public, unguessable, rotatable, and
        never an internal `site_id` (docs snapshot 02 §20).
      pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
      examples: ['sunny-otter-4821']

    FreshnessState:
      type: string
      enum: [ok, no_data, stale, degraded]
      description: |
        Distinguishes a true empty result from data that has not arrived and from
        a freshness probe that failed. `no_data` — the site has rolled up nothing
        in range; `ok` — data is current; `stale` — a watermark exists but lags;
        `degraded` — freshness could not be read (docs snapshot 03 §6.2, AGENTS.md).

    AnalyticsFreshness:
      type: object
      additionalProperties: false
      required: [state, watermark, as_of]
      properties:
        state:
          $ref: '#/components/schemas/FreshnessState'
        watermark:
          description: Latest rolled-up occurred_at bucket for the site, or null if none.
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        as_of:
          $ref: '#/components/schemas/UtcInstant'

    AnalyticsMeta:
      type: object
      additionalProperties: false
      required:
        - requested_range
        - effective_range
        - timezone
        - resolution
        - data_sources
        - accuracy
        - freshness
        - comparison_range
        - truncated
        - cached
        - partial
      description: |
        Response metadata every analytics read carries (docs snapshot 02 §18).
        `requested_range` is what the caller asked for; `effective_range` is what
        was actually queried. `partial` is true when a non-fatal sub-query (e.g.
        the freshness probe) degraded.

        `data_sources` and `accuracy` together say what a number *is*
        (ADR-0032 D5, as amended). A range entirely in live data reads
        `["live"]` / `exact`. A range touching a published import adds
        `"imported"`, and can never be `exact`: it is `provider_defined` only
        when every reported number is a provider row unmodified — day-grain
        timeseries over a fully imported range, or any import-readable surface
        whose range spans exactly one provider day — and `estimated` for
        anything blended, seam-touching or re-aggregated (week resolution and
        multi-day totals or breakdowns sum provider dailies the provider
        itself would not add). A comparison range is included in both: the
        sources are the union and the accuracy is the worst of the two.
      properties:
        requested_range:
          $ref: '#/components/schemas/DateRange'
        effective_range:
          $ref: '#/components/schemas/DateRange'
        timezone:
          $ref: '#/components/schemas/Timezone'
        resolution:
          $ref: '#/components/schemas/Resolution'
        data_sources:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DataSource'
          description: |
            Which stores answered this read. Sub-day resolutions, web vitals,
            sessions, funnels and the visitor surfaces have no imported branch
            at all and always report `["live"]`.
        accuracy:
          $ref: '#/components/schemas/Accuracy'
        freshness:
          $ref: '#/components/schemas/AnalyticsFreshness'
        comparison_range:
          oneOf:
            - $ref: '#/components/schemas/DateRange'
            - type: 'null'
          description: The preceding equal-length period, present only when compared.
        truncated:
          type: boolean
          description: True when the gateway capped the row set.
        cached:
          type: boolean
        partial:
          type: boolean
        revenue:
          description: |
            Present on **every** revenue read and absent everywhere else
            (ADR-0033, D7). It is what makes an empty revenue response
            interpretable, and the three empty states of docs snapshot 03 §17
            are decidable from it plus the totals without a second request:

            - `connection_status: "not_connected"` — nothing was ever connected,
              so a zero is not a number about this site's sales;
            - `connection_status: "connected"` with zero totals — genuinely no
              sales in the range;
            - `connection_status: "degraded"` or `"disconnected"` — the facts we
              already hold are served in full, and the status plus
              `last_synced_at` says how far they can be trusted.

            **A provider outage is never reported as revenue of zero.**
          allOf:
            - $ref: '#/components/schemas/RevenueConnectionMeta'

    PublicAnalyticsMeta:
      type: object
      additionalProperties: false
      required:
        - requested_range
        - effective_range
        - timezone
        - resolution
        - data_sources
        - accuracy
        - comparison_range
        - truncated
        - cached
        - partial
      description: |
        Response metadata on the public share surface (ADR-0039, D10).

        `AnalyticsMeta` **without `freshness`**, and without the `revenue` block
        no public read can produce. Every remaining field describes *the query*
        — what was asked for, what was actually served, in which zone, at which
        grain, from which stores, and how far the answer can be trusted — which
        is what this object is for (ADR-0039 D9: "`AnalyticsMeta` describes the
        query, not the site").

        `freshness` described neither the query nor the site. Its `state` is our
        ingest pipeline's health, computed from the worker's heartbeat and queue
        age (ADR-0025, whose title is "freshness measures the pipeline, not the
        site's last visitor") — the same class of fact D4 removed `layering`
        for, and publishing it makes every share link an unauthenticated probe
        of our own lag. Its `watermark` is the site's newest rolled-up minute
        **for all time, unbounded by the requested range**, which on an
        anonymous surface is a live-activity probe: poll any public read and
        learn to the minute when this site last had a visitor, including now,
        including outside the window the share displays.

        `as_of` went with them rather than being relocated. Nothing on the share
        page renders it, and moving a field to a new home is a decision to add
        one; re-adding it is purely additive the day anyone asks.

        A separate schema rather than a filtered one, per D-213: the public
        shape is structurally incapable of carrying the field.
      properties:
        requested_range:
          $ref: '#/components/schemas/DateRange'
        effective_range:
          $ref: '#/components/schemas/DateRange'
        timezone:
          $ref: '#/components/schemas/Timezone'
        resolution:
          $ref: '#/components/schemas/Resolution'
        data_sources:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DataSource'
        accuracy:
          $ref: '#/components/schemas/Accuracy'
        comparison_range:
          oneOf:
            - $ref: '#/components/schemas/DateRange'
            - type: 'null'
          description: |
            Always `null` here: no public read accepts `compare`, so this
            surface has never asked for a comparison period.
        truncated:
          type: boolean
          description: True when the gateway capped the row set.
        cached:
          type: boolean
        partial:
          type: boolean

    OverviewTotals:
      type: object
      additionalProperties: false
      required: [events, pageviews, visitors, billable_events]
      properties:
        events:
          type: integer
          format: int64
          description: All valid, deduplicated events in the range, every type.
        pageviews:
          type: integer
          format: int64
          description: Valid, deduplicated `page_view` events in the range.
        visitors:
          type: integer
          format: int64
          description: |
            **The canonical definition (ADR-0036), which every `visitors` field
            on this API points back at:** the number of distinct visitor
            identities — the D-102 site-scoped anonymous id, which rotates at
            UTC midnight — with **at least one page view** inside the window
            this number covers. Someone whose only events in the window are
            departure beacons (`engagement`, `web_vital`), interactions, custom
            events, conversions or `identify` is not a visitor in it; their
            page view was counted in the window it happened in. It follows by
            construction that `visitors <= pageviews` in every bucket and every
            range. Identity folding across `identify()` happens only on the
            per-visitor surfaces (recent visitors, sessions, revenue journeys),
            never in these aggregate counts. On a range blending a published
            import, the pre-cutover share is the provider's own daily visitor
            number under the same population intent (`meta.accuracy` says so).
        billable_events:
          type: integer
          format: int64

    AnalyticsOverviewResponse:
      type: object
      additionalProperties: false
      required: [meta, totals, comparison]
      properties:
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
        totals:
          $ref: '#/components/schemas/OverviewTotals'
        comparison:
          description: Totals for the preceding equal-length period, or null.
          oneOf:
            - type: object
              additionalProperties: false
              required: [totals]
              properties:
                totals:
                  $ref: '#/components/schemas/OverviewTotals'
            - type: 'null'

    PublicOverviewTotals:
      type: object
      additionalProperties: false
      required: [events, pageviews, visitors]
      description: |
        `OverviewTotals` minus `billable_events` (ADR-0039, decision 4 as
        amended). A billable-event count is a *billing* quantity — how much of
        this site's traffic is charged for — and not a public metric of the
        site. An owner who shares the overview is publishing how many people
        visited, not what they pay.

        The separation is structural rather than a promise: the route
        constructs this narrow literal field by field, so a field added to
        `OverviewTotals` later cannot reach the public surface by inheritance.
      properties:
        events:
          type: integer
          format: int64
          description: All valid, deduplicated events in the range, every type.
        pageviews:
          type: integer
          format: int64
          description: Valid, deduplicated `page_view` events in the range.
        visitors:
          type: integer
          format: int64
          description: |
            The same ADR-0036 definition every `visitors` field on this API
            uses: distinct D-102 anonymous identities with at least one page
            view inside the window.

    PublicOverviewResponse:
      type: object
      additionalProperties: false
      required: [meta, totals]
      description: |
        `AnalyticsOverviewResponse` with the narrow totals and without
        `comparison`. The public route asks for no comparison period, so that
        field was structurally `null` on every response it ever sent — and a
        field that can only ever be `null` is not information. Public and
        private totals are otherwise the same numbers over the same range.

        `meta` is `PublicAnalyticsMeta` — no `freshness` (ADR-0039, D10).
      properties:
        meta:
          $ref: '#/components/schemas/PublicAnalyticsMeta'
        totals:
          $ref: '#/components/schemas/PublicOverviewTotals'

    TimeseriesPoint:
      type: object
      additionalProperties: false
      required: [bucket, events, pageviews, visitors]
      properties:
        bucket:
          $ref: '#/components/schemas/UtcInstant'
        events:
          type: integer
          format: int64
        pageviews:
          type: integer
          format: int64
        visitors:
          type: integer
          format: int64
          description: |
            Distinct visitors with at least one page view **in this bucket** —
            the `OverviewTotals.visitors` definition (ADR-0036) applied per
            bucket, so `visitors <= pageviews` holds on every point. A visitor
            active across N buckets counts once in each; bucket values are not
            summable into a range total (the overview merges, never sums).

    AnalyticsTimeseriesResponse:
      type: object
      additionalProperties: false
      required: [meta, series, comparison]
      properties:
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
        series:
          type: array
          items:
            $ref: '#/components/schemas/TimeseriesPoint'
        comparison:
          oneOf:
            - type: object
              additionalProperties: false
              required: [series]
              properties:
                series:
                  type: array
                  items:
                    $ref: '#/components/schemas/TimeseriesPoint'
            - type: 'null'

    PageRow:
      type: object
      additionalProperties: false
      required: [page_path, views, visitors, entrances, exits, bounces, bounce_rate]
      properties:
        page_path:
          type: string
        views:
          type: integer
          format: int64
        visitors:
          type: integer
          format: int64
          description: |
            Distinct visitors who viewed this path in the range — the
            `OverviewTotals.visitors` definition (ADR-0036) scoped to the row's
            own page views, so `visitors <= views` per row.
        entrances:
          type: [integer, 'null']
          format: int64
          description: |
            Sessions that BEGAN on this path (ADR-0075, D-E1). Session-grain,
            read from the session facts rather than from the pages rollup —
            entry, exit and bounce are not additive over an incremental view,
            which is why they were absent until the session finalizer shipped.

            `null` means **not measured on this response**, and it has exactly
            three causes: the surface does not ask for session metrics (the
            public share and the widget read do not), the decoration read was
            truncated so this path fell outside the window it covered, or the
            row came from an import, which carries no sessions. `0` is a
            measurement: no session began here.
        exits:
          type: [integer, 'null']
          format: int64
          description: |
            Sessions that ENDED on this path. Same grain, same source and the
            same meaning of `null` as `entrances`.

            There is deliberately no `exit_rate`: the only denominator available
            for one is `views`, which is event-grain, may include imported days
            that have no sessions at all, and would therefore be a ratio between
            two different populations. `exits` and `views` are both on this row
            and a client that wants that ratio can form it knowing what it did.
        bounces:
          type: [integer, 'null']
          format: int64
          description: |
            Sessions that began on this path and were not engaged. Derived at
            read (`countIf(engaged = 0)`), never stored twice. Counted on the
            ENTRY only, because a bounce is a property of where a visit began —
            so `bounces <= entrances` always.
        bounce_rate:
          type: [number, 'null']
          description: |
            `bounces / entrances`, in `[0, 1]`. Its denominator is `entrances`
            on this same row rather than an implied one, which is the whole
            reason it is safe to compute here. `null` when `entrances` is 0 or
            unmeasured — a rate with no denominator is not zero.

    AnalyticsPagesResponse:
      type: object
      additionalProperties: false
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PageRow'

    SourceRow:
      type: object
      additionalProperties: false
      required: [referrer_domain, utm_source, utm_medium, utm_campaign, views, visitors]
      properties:
        referrer_domain:
          type: string
          description: |
            The canonical external referrer host — lowercase, no `www.`, no
            port, no path — or the empty string for Direct, which since
            ADR-0028 also covers navigation inside the site itself. Rows
            written before that ADR keep whatever spelling was stored then;
            the rollups are additive and are not rewritten.
        utm_source:
          type: string
        utm_medium:
          type: string
        utm_campaign:
          type: string
        views:
          type: integer
          format: int64
        visitors:
          type: integer
          format: int64
          description: |
            Distinct visitors whose page views carried this source tuple in the
            range — the `OverviewTotals.visitors` definition (ADR-0036) scoped
            to the row, so `visitors <= views` per row.

    AnalyticsSourcesResponse:
      type: object
      additionalProperties: false
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/SourceRow'

    GeographyRow:
      type: object
      additionalProperties: false
      required: [country, city, views, visitors]
      properties:
        country:
          type: string
        city:
          type: string
        views:
          type: integer
          format: int64
        visitors:
          type: integer
          format: int64
          description: |
            Distinct visitors who viewed a page from this location in the range
            (ADR-0036 population, scoped to the row): `visitors <= views`.

    AnalyticsGeographyResponse:
      type: object
      additionalProperties: false
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/GeographyRow'

    PublicGeographyRow:
      type: object
      additionalProperties: false
      required: [country, city, views, visitors, city_suppressed]
      properties:
        country:
          type: string
        city:
          description: The city name, or null when suppressed for privacy.
          type: [string, 'null']
        views:
          type: integer
          format: int64
        visitors:
          type: integer
          format: int64
        city_suppressed:
          type: boolean
          description: True when this row's city was withheld under the privacy threshold.
      description: |
        `visitors` carries the ADR-0036 page-view population, scoped to the
        row's location, exactly as on the private geography surface.

    PublicGeographyResponse:
      type: object
      additionalProperties: false
      required: [meta, items]
      description: |
        `meta` is `PublicAnalyticsMeta` — no `freshness` (ADR-0039, D10).
      properties:
        meta:
          $ref: '#/components/schemas/PublicAnalyticsMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicGeographyRow'

    PublicTimeseriesResponse:
      type: object
      additionalProperties: false
      required: [meta, series, comparison]
      description: |
        The public traffic chart (ADR-0039, D8 and D10).

        `AnalyticsTimeseriesResponse` with `PublicAnalyticsMeta` in place of
        `AnalyticsMeta`; the series and its points are identical to the private
        surface's, and `comparison` is kept and always `null` because the public
        route passes `compare: false` (D8 states why it is not worth a second
        response shape to remove one permanently-null field — that reasoning
        stands, and this narrowing is about `freshness`, not about `comparison`).
      properties:
        meta:
          $ref: '#/components/schemas/PublicAnalyticsMeta'
        series:
          type: array
          items:
            $ref: '#/components/schemas/TimeseriesPoint'
        comparison:
          oneOf:
            - type: object
              additionalProperties: false
              required: [series]
              properties:
                series:
                  type: array
                  items:
                    $ref: '#/components/schemas/TimeseriesPoint'
            - type: 'null'

    PublicPagesResponse:
      type: object
      additionalProperties: false
      required: [meta, items]
      description: |
        `AnalyticsPagesResponse` with `PublicAnalyticsMeta` (ADR-0039, D10). The
        rows are the same `PageRow`s the private surface returns: a path is not
        a person (D3), so nothing in the body is withheld.
      properties:
        meta:
          $ref: '#/components/schemas/PublicAnalyticsMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PageRow'

    PublicSourcesResponse:
      type: object
      additionalProperties: false
      required: [meta, items]
      description: |
        `AnalyticsSourcesResponse` with `PublicAnalyticsMeta` (ADR-0039, D10).
      properties:
        meta:
          $ref: '#/components/schemas/PublicAnalyticsMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/SourceRow'

    PublicDevicesResponse:
      type: object
      additionalProperties: false
      required: [meta, items]
      description: |
        `AnalyticsDevicesResponse` with `PublicAnalyticsMeta` (ADR-0039, D10).
      properties:
        meta:
          $ref: '#/components/schemas/PublicAnalyticsMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeviceRow'

    PublicSiteIdentity:
      type: object
      additionalProperties: false
      # Only the two rendering facts are required. `display_name` and
      # `favicon_domain` are **optional on purpose**: the flag being off means
      # the keys are not sent at all, and a client must branch on presence
      # (`'display_name' in body`) rather than on a null value (ADR-0044, D1).
      required: [reporting_timezone, first_event_at]
      description: |
        What a public share board needs to name itself and cut its buckets
        (ADR-0044). Four fields, no more: no `created_at`, no plan, no owner.
      properties:
        display_name:
          type: string
          description: |
            The site's display name — `sites.name`, the name the owner typed and
            sees in their own dashboard.

            **Present only when the owner opted `share_identity` in.** Absent —
            never `null` — otherwise, because an owner who publishes a traffic
            chart has not thereby agreed to put their site's name on it, and some
            owners share anonymously on purpose. When it is absent, render the
            generic header.
        favicon_domain:
          description: |
            A hostname to fetch a favicon for, or `null` when the site has no
            origin allowlist configured.

            Derived, not stored (ADR-0044, D5): it is the first entry of the
            site's own domain allowlist — the owner's declaration of which hosts
            are this site — rather than a second column that could disagree with
            it. A site with several domains publishes one of them by a rule the
            owner did not choose, which is why this is named after the use
            (fetching an icon) and is not a canonical site URL.

            Carried by the same `share_identity` opt-in as `display_name` and
            **absent** when it is off.
          oneOf:
            - $ref: '#/components/schemas/SiteDomain'
            - type: 'null'
        reporting_timezone:
          description: |
            The zone the site's owner reports in. Always a zone — every site has
            one since migration 0046 (ADR-0079 D5) — and never `null`.

            Set with `PATCH /v1/sites/{site_id}` (`site:settings`).

            **Served to any live slug, whatever `share_identity` says** — a
            timezone is a rendering fact, not identity, and an anonymous share
            needs correct bucket boundaries as much as a named one (ADR-0044,
            D1).

            The board **is** cut in this zone (ADR-0079 D5, which answered
            F-317): a visitor who wants their own switches to it from the
            header, and that choice is theirs for the visit and never the
            site's.
          allOf:
            - $ref: '#/components/schemas/Timezone'
        first_event_at:
          description: |
            When this site's first event reached the ingest pipeline, or `null` if
            none ever has — the same ADR-0027 instant `SiteSummary` carries,
            served unchanged. Always present, so `null` is a statement rather
            than a gap.

            This is the public "All time" anchor. The **private** anchor is
            `min(created_at, first_event_at)` and `created_at` is deliberately
            not published here, so a public "All time" window may start slightly
            later than the owner's. The numbers are identical — there is nothing
            in the gap, which is what `first_event_at` means — only the axis
            differs.
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'

    DeviceRow:
      type: object
      additionalProperties: false
      required: [device_type, browser, os, views, visitors]
      properties:
        device_type:
          type: string
        browser:
          type: string
        os:
          type: string
        views:
          type: integer
          format: int64
        visitors:
          type: integer
          format: int64
          description: |
            Distinct visitors who viewed a page on this device/browser/OS
            combination in the range (ADR-0036 population, scoped to the row):
            `visitors <= views`.

    AnalyticsDevicesResponse:
      type: object
      additionalProperties: false
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeviceRow'

    CustomEventRow:
      type: object
      additionalProperties: false
      # `last_seen_at`, `sample_page_path` and `sample_properties` are
      # deliberately NOT required, which is a departure from the
      # required-and-nullable convention the two `display_*` fields above
      # follow (ADR-0027). The server always sends all three — the mapper has no
      # branch that omits them — so the runtime answer is identical. What
      # optionality buys is that a client compiled against the previous shape
      # keeps compiling: this response type is consumed by a frontend developed
      # in parallel in this same repository, and making a field required is a
      # breaking change to every object literal that constructs one. `null`
      # carries the meaning either way (ADR-0038, D6).
      required:
        [event_name, event_type, events, billable_events, visitors, display_name, display_template]
      properties:
        event_name:
          type: string
          description: The canonical name events are stored and grouped under.
        event_type:
          type: string
        events:
          type: integer
          format: int64
        billable_events:
          type: integer
          format: int64
        visitors:
          type: integer
          format: int64
          description: |
            Distinct visitors who fired **this named event** in the range —
            this row's own population, not the page-view population, so it has
            no ordering relation to `pageviews`. The identity is the same
            D-102 anonymous id every `visitors` count uses (ADR-0036).
        display_name:
          type: [string, 'null']
          description: |
            The dashboard label from this event's definition (ADR-0034), or
            `null` when no definition exists for the name — which is a fact to
            render differently, not a gap. Present for archived definitions too:
            a definition can be archived while the events it produced are still
            inside the range being charted, and dropping its label would turn a
            named event back into a raw string exactly when someone is looking
            at the history that made them archive it.
        display_template:
          type: [string, 'null']
          description: |
            The definition's sentence template, **unrendered**. Rendering needs
            one event's properties and this surface is an aggregate grouped by
            name, so there is no single event to render — the template travels
            so per-event surfaces can render it against the events they have.
        last_seen_at:
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: |
            When this event last fired inside the requested range — the newest
            accepted event's own `occurred_at`, not its arrival time (ADR-0038,
            D5/D6).

            `null` means this surface has nothing to say, which is a fact rather
            than a gap and has exactly three causes: the range ends before
            ClickHouse migration 0021 was applied (nothing backfills a
            materialized view, and a backfill would mean the raw-event scan the
            design exists to avoid), the row came from an import (a provider
            export is daily aggregates and carries no event instant), or the
            range predates the event.
        sample_page_path:
          type: [string, 'null']
          description: |
            The path that newest event fired on. `null` under the same three
            conditions as `last_seen_at`, and always consistent with it — the
            two are read from one `argMax` over the same instant, so they
            describe the same event.
        sample_properties:
          type: [object, 'null']
          additionalProperties: true
          description: |
            That newest event's properties **as stored**: scalar values, at most
            32 keys, already through the collector's redaction pass — which is
            the only writer of the column, so there is no path by which an
            unredacted value is in it (ADR-0038, D7).

            It is one property bag per event name per range, never a per-visitor
            stream, and it carries no visitor, session or user identifier. `null`
            under the same three conditions as `last_seen_at`; an event that
            fired with no properties answers `{}`, which is a different fact.

    AnalyticsCustomEventsResponse:
      type: object
      additionalProperties: false
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomEventRow'

    PerformanceRow:
      type: object
      additionalProperties: false
      required:
        - metric
        - device_type
        - samples
        - mean
        - p50
        - p75
        - p90
        - p95
        - p99
        - good_samples
        - needs_improvement_samples
        - poor_samples
      description: |
        Web-vital percentiles are the merged t-digest read at
        [0.5, 0.75, 0.9, 0.95, 0.99]; `mean` is `value_sum / samples`.
      properties:
        metric:
          type: string
        device_type:
          type: string
        samples:
          type: integer
          format: int64
        mean:
          type: number
        p50:
          type: number
        p75:
          type: number
        p90:
          type: number
        p95:
          type: number
        p99:
          type: number
        good_samples:
          type: integer
          format: int64
        needs_improvement_samples:
          type: integer
          format: int64
        poor_samples:
          type: integer
          format: int64

    AnalyticsPerformanceResponse:
      type: object
      additionalProperties: false
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PerformanceRow'

    SessionMetricValues:
      type: object
      additionalProperties: false
      required:
        - sessions
        - engaged_sessions
        - bounced_sessions
        - bounce_rate
        - pageviews
        - avg_session_duration_ms
        - avg_active_duration_ms
      description: |
        Session measures with the read-derived rates. Counts are additive across
        buckets and across the finalized/provisional merge; bounce rate and the
        averages are derived from those totals at read (docs snapshot 02 §10),
        never stored, so merging buckets stays a plain sum before the final divide.
      properties:
        sessions:
          type: integer
          format: int64
        engaged_sessions:
          type: integer
          format: int64
        bounced_sessions:
          type: integer
          format: int64
        bounce_rate:
          type: number
          description: bounced_sessions / sessions, in [0, 1]; 0 when there are no sessions.
        pageviews:
          type: integer
          format: int64
        avg_session_duration_ms:
          type: number
          description: total_session_duration_ms / sessions; 0 when there are no sessions.
        avg_active_duration_ms:
          type: number
          description: total_active_duration_ms / sessions; 0 when there are no sessions.

    SessionMetricPoint:
      type: object
      additionalProperties: false
      required:
        - bucket
        - sessions
        - engaged_sessions
        - bounced_sessions
        - bounce_rate
        - pageviews
        - avg_session_duration_ms
        - avg_active_duration_ms
      properties:
        bucket:
          $ref: '#/components/schemas/UtcInstant'
        sessions:
          type: integer
          format: int64
        engaged_sessions:
          type: integer
          format: int64
        bounced_sessions:
          type: integer
          format: int64
        bounce_rate:
          type: number
        pageviews:
          type: integer
          format: int64
        avg_session_duration_ms:
          type: number
        avg_active_duration_ms:
          type: number

    SessionLayering:
      type: object
      additionalProperties: false
      required: [finalized_through, provisional_through]
      description: |
        The revisable window for session-derived metrics (docs snapshot 02 §15).
        Results before `finalized_through` no longer change; data up to
        `provisional_through` is the freshest but still revisable. Either is null
        when the finalizer has not yet run or the site has no data.
      properties:
        finalized_through:
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: Beyond this instant session results no longer change.
        provisional_through:
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: The leading edge of the (still revisable) provisional layer.

    AnalyticsSessionsResponse:
      type: object
      additionalProperties: false
      required: [meta, layering, totals, series]
      properties:
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
        layering:
          $ref: '#/components/schemas/SessionLayering'
        totals:
          $ref: '#/components/schemas/SessionMetricValues'
        series:
          type: array
          items:
            $ref: '#/components/schemas/SessionMetricPoint'

    PublicSessionsResponse:
      type: object
      additionalProperties: false
      required: [meta, totals, series]
      description: |
        Session metrics on the public share surface (ADR-0039, D4).

        Identical to `AnalyticsSessionsResponse` **without `layering`**. That
        object's `finalized_through` / `provisional_through` are the revisable
        window of our own session finalizer — not a metric or a dimension of the
        site, and therefore outside the §20 public allowlist. Publishing it would
        also make every share link an unauthenticated probe of this pipeline's
        lag. The finalizer watermark still splits the range server-side, so the
        numbers here are the same numbers the private surface reports.

        A separate schema rather than a filtered one, per D-213: the public shape
        is structurally incapable of carrying the field.

        `meta` is `PublicAnalyticsMeta` — no `freshness` (ADR-0039, D10), which
        is the same argument one level up: `layering` was this pipeline's
        session watermark, and `freshness` is this pipeline's ingest watermark.
      properties:
        meta:
          $ref: '#/components/schemas/PublicAnalyticsMeta'
        totals:
          $ref: '#/components/schemas/SessionMetricValues'
        series:
          type: array
          items:
            $ref: '#/components/schemas/SessionMetricPoint'

    FunnelStep:
      type: object
      additionalProperties: false
      required: [step, key, count, conversion_rate]
      properties:
        step:
          type: integer
          minimum: 1
          description: 1-based step index.
        key:
          type: string
        count:
          type: integer
          format: int64
          description: Units that reached at least this step.
        conversion_rate:
          type: number
          description: count / step-1 count, in [0, 1]; 0 when the funnel entry is empty.

    FunnelMeta:
      type: object
      additionalProperties: false
      required: [requested_range, timezone, scope, window_ms, freshness, cached]
      properties:
        requested_range:
          $ref: '#/components/schemas/DateRange'
        timezone:
          $ref: '#/components/schemas/Timezone'
        scope:
          type: string
          enum: [visitor, session]
        window_ms:
          type: integer
          format: int64
        freshness:
          $ref: '#/components/schemas/AnalyticsFreshness'
        cached:
          type: boolean

    AnalyticsFunnelResponse:
      type: object
      additionalProperties: false
      required: [meta, steps]
      properties:
        meta:
          $ref: '#/components/schemas/FunnelMeta'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FunnelStep'

    FunnelStepKeys:
      type: array
      minItems: 2
      maxItems: 8
      description: |
        Ordered funnel step keys, each matching a pageview's path or another
        event's name. Exactly the shape
        `GET /v1/sites/{site_id}/analytics/funnel` takes as repeated `steps=`
        parameters, so a stored definition can be handed to it unchanged.
      items:
        type: string
        minLength: 1
        maxLength: 512

    NoCodeRuleProperty:
      type: object
      additionalProperties: false
      required: [key, source]
      description: |
        One value a rule extracts when it matches.

        **A rule can read structure; it can never read what a person typed.**
        There is no source that reaches an input's value — `attribute` is bounded
        by an allowlist that does not contain `value`, and the tracker refuses to
        read text from an `input`, `textarea`, `select` or `contenteditable`
        element at all. That holds at three independent layers on purpose.
      properties:
        key:
          type: string
          maxLength: 40
          description: |
            The property name on the produced event. Must be declared in the
            version's `property_schema`, and may not use the reserved `oa_`
            prefix.
        source:
          type: string
          enum: [text, element_tag, page_path, page_url, page_title, attribute, url_param, constant]
          description: |
            Where the value comes from. `text` is the matched element's text,
            whitespace-collapsed and redacted. `attribute`, `url_param` and
            `constant` each need an `argument`; the rest must omit it.
        argument:
          type: string
          maxLength: 256
          description: |
            The attribute name, query key, or literal. Attribute names are
            restricted to `data-*`, `id`, `class`, `name`, `type`, `role`,
            `aria-label`, `href`, `title` and `alt`.

    NoCodeRule:
      type: object
      additionalProperties: false
      required: [rule_id, trigger]
      description: |
        One rule the browser evaluates. `rule_id` is stable across versions, so a
        rule edited in v2 keeps the id it had in v1 and an ingested event's
        `rule_id` stays resolvable across a publish.
      properties:
        rule_id:
          type: string
          format: uuid
        trigger:
          type: string
          enum: [click, submit, url_pattern]
          description: |
            `click` and `submit` are delegated listeners and carry a `selector`;
            `url_pattern` rides the pageview and carries a `url_pattern`. The
            other three triggers snapshot 02 §12 lists — element visibility,
            scroll threshold and modal open — are not in v1 (ADR-0034, D1).
        selector:
          type: string
          maxLength: 256
          description: |
            A restricted CSS selector, for `click` and `submit`. The accepted
            grammar is tags, classes, ids and allowlisted attribute tests joined
            by descendant or child combinators — at most 4 compounds and 12
            simple selectors. `:has()`, `*`, the sibling combinators, selector
            lists, every pseudo-class and CSS escapes are all refused, because
            this runs on every click of every visitor and only the ancestor-chain
            walk has a cost we can state.
        url_pattern:
          type: string
          maxLength: 512
          description: |
            A path glob for `url_pattern`, matched against the sanitized page
            path. `*` matches within one segment, `**` across segments; nothing
            else is special. **Not a regular expression** — one evaluated in a
            visitor's browser would be a ReDoS against the customer's own users.
        properties:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/NoCodeRuleProperty'

    EventDefinitionPropertySchemaEntry:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key:
          type: string
          maxLength: 40
        type:
          type: string
          enum: [string, number, boolean]
          default: string

    EventDefinitionContent:
      type: object
      additionalProperties: false
      required: [display_name]
      description: |
        Everything about a definition that can change. Saved in full on every
        edit and frozen as a new immutable version.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 1000
        category:
          type: [string, 'null']
          maxLength: 64
        property_schema:
          type: array
          maxItems: 32
          description: |
            The property allowlist. A rule may only map to a key declared here,
            and a template may only interpolate one. An ingested property this
            does not declare is dropped rather than rejected — browsers keep
            evaluating the previous rule set for up to ~10 minutes after an edit,
            and a configuration change must never reject a customer's traffic.
          items:
            $ref: '#/components/schemas/EventDefinitionPropertySchemaEntry'
        display_template:
          type: [string, 'null']
          maxLength: 200
          description: |
            The human sentence a canonical event renders as, e.g.
            `Clicked "{{button_label}}" on {{page_path}}`. Rendered server-side
            in the read API as **plain text**; `<` and `>` are refused outright
            rather than escaped at render time, so there is no escaping step to
            forget later. A property that is missing at render time becomes an em
            dash and the response says the sentence is incomplete.
        rules:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/NoCodeRule'

    CreateEventDefinitionRequest:
      allOf:
        - type: object
          additionalProperties: false
          required: [event_name]
          properties:
            event_name:
              type: string
              minLength: 1
              maxLength: 64
              description: |
                The canonical name every produced event carries, and the key the
                `custom_events_*` rollups group by. Unique per site, archived
                definitions included.
        - $ref: '#/components/schemas/EventDefinitionContent'

    EventDefinition:
      type: object
      additionalProperties: false
      required:
        [
          id,
          site_id,
          event_name,
          status,
          published_version,
          created_by_user_id,
          created_at,
          updated_at,
          archived_at,
        ]
      properties:
        id:
          type: string
        site_id:
          type: string
        event_name:
          type: string
        status:
          type: string
          enum: [active, archived]
        published_version:
          type: [integer, 'null']
          description: The version served to browsers; null when never published.
        created_by_user_id:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: [string, 'null']
          format: date-time

    EventDefinitionVersion:
      type: object
      additionalProperties: false
      required:
        [
          id,
          definition_id,
          version,
          display_name,
          description,
          category,
          property_schema,
          display_template,
          rules,
          source_version,
          created_by_user_id,
          created_at,
        ]
      description: |
        One immutable version. Never updated and never deleted after insert —
        the whole rollback design rests on history staying readable.
      properties:
        id:
          type: string
        definition_id:
          type: string
        version:
          type: integer
          minimum: 1
        display_name:
          type: string
        description:
          type: [string, 'null']
        category:
          type: [string, 'null']
        property_schema:
          type: array
          items:
            $ref: '#/components/schemas/EventDefinitionPropertySchemaEntry'
        display_template:
          type: [string, 'null']
        rules:
          type: array
          items:
            $ref: '#/components/schemas/NoCodeRule'
        source_version:
          type: [integer, 'null']
          description: |
            Set when this version was created by rolling back — the historical
            version its content was copied from. Provenance, not a pointer;
            nothing joins on it.
        created_by_user_id:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time

    PublishEventDefinitionRequest:
      type: object
      additionalProperties: false
      required: [version, expected_published_version]
      properties:
        version:
          type: integer
          minimum: 1
          description: |
            On `/publish`, the version to make live. On `/rollback`, the
            historical version whose content is copied forward into a new one.
        expected_published_version:
          type: [integer, 'null']
          minimum: 1
          description: |
            The version the caller believes is live — checked, not trusted. Pass
            `null` to claim nothing is published. A mismatch is
            `EVENT_DEFINITION_VERSION_CONFLICT` and nothing is written.
    FunnelDefinition:
      type: object
      additionalProperties: false
      required:
        [id, name, steps, scope, window_ms, created_by_user_id, created_at, updated_at, archived_at]
      description: |
        A saved funnel. Storage only — a definition is never a computed result,
        and this object carries no counts. Running it means calling
        `GET /v1/sites/{site_id}/analytics/funnel` with these `steps`, `scope`
        and `window_ms` plus the range you want (docs snapshot 02 §15).
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 200
        steps:
          $ref: '#/components/schemas/FunnelStepKeys'
        scope:
          type: string
          enum: [visitor, session]
        window_ms:
          type: integer
          format: int64
          minimum: 1
          maximum: 2592000000
        created_by_user_id:
          type: [string, 'null']
          description: Null once the creating user's account is gone.
        created_at:
          $ref: '#/components/schemas/UtcInstant'
        updated_at:
          $ref: '#/components/schemas/UtcInstant'
        archived_at:
          description: Null for a live definition; set once archived.
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'

    CreateFunnelRequest:
      type: object
      additionalProperties: false
      required: [name, steps, window_ms]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        steps:
          $ref: '#/components/schemas/FunnelStepKeys'
        scope:
          type: string
          enum: [visitor, session]
          default: visitor
        window_ms:
          type: integer
          format: int64
          minimum: 1
          maximum: 2592000000

    UpdateFunnelRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        A partial update; an empty body is refused rather than treated as a
        no-op. The bounds are the ones the compute endpoint enforces, so a stored
        definition is always one that can be run.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        steps:
          $ref: '#/components/schemas/FunnelStepKeys'
        scope:
          type: string
          enum: [visitor, session]
        window_ms:
          type: integer
          format: int64
          minimum: 1
          maximum: 2592000000

    ImportProvider:
      type: object
      additionalProperties: false
      required: [id, display_name, capability, available]
      description: |
        One entry in the import catalog (docs snapshot 02 §16).
      properties:
        id:
          type: string
          description: Stable identifier; this is what `CreateImportRequest.provider` carries.
        display_name:
          type: string
        capability:
          type: string
          enum: [aggregate_only, event_level]
          description: |
            What the provider's export contains. `aggregate_only` means daily
            totals with no visitor-level rows — imported ranges then have no
            sub-day resolution and their unique-visitor figures are the
            provider's own, which is why blended ranges report `accuracy` other
            than `exact`.
        available:
          type: boolean
          description: |
            Whether this build can actually import from it. `false` means the
            adapter is planned, not that the request would half-work.

    RevenueProvider:
      type: object
      additionalProperties: false
      required: [id, display_name, available]
      description: |
        One entry in the revenue catalog (ADR-0033, D1).

        There is deliberately no capability field here, unlike `ImportProvider`:
        every provider on this list connects the same way — a restricted API key
        plus a webhook — so a field whose value would be identical on every row
        would state nothing.
      properties:
        id:
          type: string
          description: Stable identifier; this is what `ConnectRevenueRequest.provider` carries.
        display_name:
          type: string
        available:
          type: boolean
          description: |
            Whether this build can actually connect to it. `false` means the
            adapter is planned, not that the request would half-work.

    RevenueConnectionStatus:
      type: string
      enum: [active, degraded, disabled]
      description: |
        `active` — connected and working. `degraded` — the provider is failing;
        `last_error` carries a safe category and `last_synced_at` is when the
        data was last actually correct. A degraded connection is **never** the
        same thing as revenue of zero, and the dashboard must not render it as
        one. `disabled` — disconnected: the stored secrets are erased, the
        recorded revenue is untouched, and nothing new arrives.

    RevenueConnection:
      type: object
      additionalProperties: false
      required:
        - provider
        - status
        - api_key_last4
        - webhook_url
        - connected_at
        - last_verified_at
        - last_synced_at
        - last_webhook_at
        - last_error
        - webhook_secret_set
      description: |
        A site's revenue connection. **No field of this object ever carries a
        secret**: the stored API key and webhook signing secret go in on connect
        and are never returned by any operation.
      properties:
        provider:
          type: string
          description: An `id` from `GET /v1/revenue/providers`.
        status:
          $ref: '#/components/schemas/RevenueConnectionStatus'
        api_key_last4:
          type: string
          description: |
            The last four characters of the stored key, for display only. Empty
            when the key was too short to have a meaningful tail.
        webhook_secret_set:
          type: boolean
          description: |
            Whether a webhook signing secret has been stored for this connection.
            **Always present**, and never a piece of the secret itself.

            It exists because connecting is two steps, and the UI has to know
            which one the customer is on. A signing secret can only be obtained
            *after* creating a provider endpoint at `webhook_url` — and that URL
            is minted by the connect call itself — so `false` here beside a
            `webhook_url` is a normal, working, half-finished connection rather
            than a fault: step two has not been done yet.

            While it is `false` the connection is still `active` and still
            ingesting. Backfill and reconcile run entirely on the API key; what
            is missing is the low-latency path, which is exactly what
            `meta.revenue.last_webhook_at` staying `null` reports.

        webhook_url:
          type: [string, 'null']
          description: |
            The per-site endpoint to create in the provider's dashboard. Null on
            a `disabled` connection — the address still resolves so a provider
            still posting to it is acked rather than retried forever, but it is
            not published beside a dead connection.
        connected_at:
          type: string
          format: date-time
        last_verified_at:
          type: [string, 'null']
          format: date-time
          description: The last successful live probe — connect or rotate.
        last_synced_at:
          type: [string, 'null']
          format: date-time
          description: |
            The last successful sync. Deliberately **not** moved by a failure: a
            degraded connection has to keep reporting when its data was last
            actually correct.
        last_webhook_at:
          type: [string, 'null']
          format: date-time
        last_error:
          type: [string, 'null']
          description: |
            A safe category, never a raw provider message or response body.

    RevenueNotConnected:
      type: object
      additionalProperties: false
      required: [status]
      description: |
        The site has never connected a revenue provider. Distinct from a
        `disabled` connection, which is a site that connected one and then
        disconnected it — different sentences on the empty-state screen.
      properties:
        status:
          type: string
          enum: [not_connected]

    ConnectRevenueRequest:
      type: object
      additionalProperties: false
      required: [provider, api_key]
      properties:
        provider:
          type: string
          description: An `id` from `GET /v1/revenue/providers` whose `available` is true.
        api_key:
          type: string
          minLength: 1
          description: |
            The customer's **restricted, read-only** provider key. Verified live
            before it is stored and never returned afterwards.
        webhook_secret:
          type: string
          minLength: 1
          description: |
            **Optional, and normally omitted here.** The signing secret of a
            webhook endpoint can only be read from the provider *after* that
            endpoint has been created at this site's `webhook_url` — and that URL
            is minted by this call. Asking for it on connect asked for a value
            the customer could not yet have.

            So the ordinary flow is two steps: connect with the API key alone,
            read `webhook_url` from the response, create the endpoint in the
            provider dashboard, then `PATCH` the signing secret back. Send it
            here only if you already hold one (re-connecting a site whose
            endpoint still exists).

            Per site, so a leaked secret has a blast radius of one site rather
            than of the platform. Present-and-empty is a `VALIDATION_FAILED`:
            absent means "not yet", `""` means a blank form box.

    RotateRevenueCredentialRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Two independent halves, either or both, at least one. An empty object is
        `VALIDATION_FAILED` rather than a silent no-op.

        With both, the key is rotated first and the signing secret second: the
        rotation is the half a provider can refuse, and a failed probe should
        leave the row completely untouched rather than having already written a
        new signing secret onto it.
      properties:
        api_key:
          type: string
          minLength: 1
          description: |
            The replacement provider key. Verified against the provider before
            anything is stored, and a successful rotation **re-enqueues the
            backfill walk** — the ordinary reason to rotate is that the old key
            had stopped working and left history un-walked.

            The webhook signing secret is not rotated with it and `webhook_url`
            does not change.
        webhook_secret:
          type: string
          minLength: 1
          description: |
            The signing secret of the webhook endpoint created at `webhook_url` —
            **step two of connecting**. Setting it neither re-probes the provider
            nor re-walks history: pasting a signing secret says nothing about
            whether the API key works, and re-walking ninety days every time
            somebody finishes the connect guide would be a large, pointless bill.

            Sending it again replaces the stored one, which is how a customer
            recovers from rotating the endpoint's secret in the provider
            dashboard.

    RevenueConnectionMeta:
      type: object
      additionalProperties: false
      required: [provider, connection_status, last_synced_at, last_webhook_at, rollup_through]
      description: |
        The revenue connection, as every revenue read reports it (ADR-0033, D7).
        Derived from the credential row, never guessed from a total.
      properties:
        provider:
          description: The connected provider id, or `null` if none ever was.
          oneOf:
            - type: string
            - type: 'null'
        connection_status:
          type: string
          enum: [connected, degraded, disconnected, not_connected]
          description: |
            - `connected` — the provider is answering and sync is current;
            - `degraded` — sync or a webhook is failing. **The facts already
              ingested are still served in full**; `last_synced_at` says how
              current they are;
            - `disconnected` — the customer disconnected it. The revenue already
              recorded remains; nothing new arrives;
            - `not_connected` — nothing was ever connected.
        last_synced_at:
          description: |
            The last successful sync. Left untouched by a failure, so it is the
            honest "correct as of" instant during an outage rather than a
            timestamp that moves while nothing is being ingested.
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        last_webhook_at:
          description: The last webhook delivery accepted for this site, or null.
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        rollup_through:
          description: |
            The instant **our own** pipeline last computed this site's revenue
            buckets against, or `null` if it never has.

            The other fields describe the provider. This one describes us, and
            it is the half of "a provider outage is never revenue of zero" that
            the credential row cannot see: the provider can be answering
            perfectly while our projection or attribution loop is dead, and the
            totals are then silently frozen rather than wrong.

            `meta.freshness` on a revenue response is derived from this rather
            than from the pageview pipeline's watermark — so a site that
            connected a provider and never installed the tracker no longer reads
            `no_data` beside real revenue, and a stalled loop reads `stale`
            rather than `ok`.
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'

    RevenueTotals:
      type: object
      additionalProperties: false
      required:
        [
          currency,
          charge_gross_minor,
          refund_minor,
          dispute_withdrawn_minor,
          dispute_reinstated_minor,
          fee_minor,
          net_minor,
          charge_count,
          refund_count,
          dispute_count,
          unconverted_count,
        ]
      description: |
        Additive money totals in the site's `reporting_currency`, as integer
        minor units (docs snapshot 03 §6.5 — never float dollars). Nothing is
        pre-divided or pre-averaged: an average order value is
        `charge_gross_minor / charge_count` at read time, so merging two ranges
        is a plain sum rather than a mean of means.

        The identity holds exactly:
        `net = charge_gross - refund - dispute_withdrawn + dispute_reinstated - fee`.
      properties:
        currency:
          $ref: '#/components/schemas/ReportingCurrency'
        charge_gross_minor:
          type: integer
          format: int64
          description: |
            Gross of every charge in the range that moved money. A charge whose
            status later became `refunded` or `partially_refunded` is here in
            **full** — the refund carries the negative in its own bucket (D2d),
            and deducting on both sides would remove the money twice. A `failed`
            or `canceled` charge is absent entirely and is not counted.
        refund_minor:
          type: integer
          format: int64
          description: Magnitude of refunds occurring in the range. Positive.
        dispute_withdrawn_minor:
          type: integer
          format: int64
          description: |
            Magnitude of disputed funds the provider withheld. A dispute the site
            **won** appears in both this and `dispute_reinstated_minor`, so their
            difference is the zero net effect while the event stays visible.
        dispute_reinstated_minor:
          type: integer
          format: int64
        fee_minor:
          type: integer
          format: int64
          description: |
            Provider fees, signed by the movement they belong to, so `net`
            closes.

            **Charge-only in practice**, and that is the provider's doing rather
            than a modelling choice: Stripe reverses no fee when a refund is
            issued, and a dispute's fee is not carried on the dispute object. So
            refunds and dispute rows normalize with a zero fee and contribute
            nothing here. The field stays signed and general so a provider that
            does report a reversed fee lands in the right column without a
            schema change.
        net_minor:
          type: integer
          format: int64
        charge_count:
          type: integer
          format: int64
        refund_count:
          type: integer
          format: int64
        dispute_count:
          type: integer
          format: int64
        unconverted_count:
          type: integer
          format: int64
          description: |
            Transactions in the range with **no usable exchange rate** (ADR-0033,
            D2c). They contribute nothing to the money columns above and are not
            in the kind counts; their original-currency amounts are in the
            summary's `unconverted` list. Non-zero means the totals above are an
            understatement by a knowable amount — never that revenue was zero.

    RevenueUnconvertedCurrency:
      type: object
      additionalProperties: false
      required: [currency, charge_gross_minor, refund_minor, dispute_minor, transactions]
      description: |
        The unconverted remainder for one **original** currency, in that
        currency's own minor units. Read from the facts rather than from a
        rollup: the buckets deliberately carry no currency dimension.
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        charge_gross_minor:
          type: integer
          format: int64
        refund_minor:
          type: integer
          format: int64
        dispute_minor:
          type: integer
          format: int64
        transactions:
          type: integer
          format: int64

    RevenueSummaryResponse:
      type: object
      additionalProperties: false
      required: [meta, totals, comparison, unconverted]
      properties:
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
        totals:
          $ref: '#/components/schemas/RevenueTotals'
        comparison:
          description: Totals for the preceding equal-length period, or null.
          oneOf:
            - type: object
              additionalProperties: false
              required: [totals]
              properties:
                totals:
                  $ref: '#/components/schemas/RevenueTotals'
            - type: 'null'
        unconverted:
          type: array
          description: |
            Per original currency, for the primary range only. Empty when
            everything converted. A comparison period has none: the comparison
            answers "up or down", which a per-currency residue cannot.
          items:
            $ref: '#/components/schemas/RevenueUnconvertedCurrency'

    RevenueTimeseriesPoint:
      type: object
      additionalProperties: false
      required:
        [
          bucket,
          currency,
          charge_gross_minor,
          refund_minor,
          dispute_withdrawn_minor,
          dispute_reinstated_minor,
          fee_minor,
          net_minor,
          charge_count,
          refund_count,
          dispute_count,
          unconverted_count,
        ]
      description: |
        One bucket, with `RevenueTotals`' measures inlined. Written out rather
        than composed with `allOf`, because every schema here is
        `additionalProperties: false` and a composed one cannot then carry an
        extra `bucket`.
      properties:
        bucket:
          $ref: '#/components/schemas/UtcInstant'
        currency:
          $ref: '#/components/schemas/ReportingCurrency'
        charge_gross_minor:
          type: integer
          format: int64
        refund_minor:
          type: integer
          format: int64
        dispute_withdrawn_minor:
          type: integer
          format: int64
        dispute_reinstated_minor:
          type: integer
          format: int64
        fee_minor:
          type: integer
          format: int64
        net_minor:
          type: integer
          format: int64
        charge_count:
          type: integer
          format: int64
        refund_count:
          type: integer
          format: int64
        dispute_count:
          type: integer
          format: int64
        unconverted_count:
          type: integer
          format: int64

    RevenueTimeseriesResponse:
      type: object
      additionalProperties: false
      required: [meta, series]
      properties:
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
        series:
          type: array
          items:
            $ref: '#/components/schemas/RevenueTimeseriesPoint'

    RevenueTransaction:
      type: object
      additionalProperties: false
      required:
        [
          object_id,
          provider,
          object_kind,
          occurred_at,
          status,
          livemode,
          gross,
          refund,
          fee,
          net,
          reporting,
          conversion,
          parent_object_id,
          order_id,
          product_name,
          matched_via,
          confidence,
        ]
      properties:
        object_id:
          type: string
          description: The provider's own object id. Also the journey path segment.
        provider:
          type: string
        object_kind:
          type: string
          enum: [charge, refund, dispute]
        occurred_at:
          $ref: '#/components/schemas/UtcInstant'
        status:
          type: string
          description: |
            The provider's status, normalized to lowercase and otherwise
            untouched. Charges are `succeeded | pending | failed | refunded |
            partially_refunded`; refunds `succeeded | pending | failed |
            canceled`; disputes carry the provider's own lifecycle vocabulary
            (`needs_response`, `under_review`, `won`, `lost`, `warning_*`),
            because collapsing "we are still arguing" into "we lost" destroys
            the distinction a dispute screen exists for.
        livemode:
          type: boolean
          description: False for a provider test-mode object.
        gross:
          description: |
            The charge's gross, in the original currency. **Zero on a refund or a
            dispute** — each kind's magnitude lives in the field named after it,
            so a client never has to know which of four fields a row's money is
            in before it can add anything up.
          allOf:
            - $ref: '#/components/schemas/Money'
        refund:
          description: The refund's amount, in the original currency. Zero on a charge or dispute.
          allOf:
            - $ref: '#/components/schemas/Money'
        fee:
          description: |
            The provider fee. Zero on a refund and on a dispute — see
            `RevenueTotals.fee_minor` for why that is the provider's behaviour
            rather than a gap here.
          allOf:
            - $ref: '#/components/schemas/Money'
        net:
          description: |
            The row's net money movement, as a **magnitude**. The sign belongs to
            the kind and is applied by the totals, never stored.

            A **dispute row therefore carries its amount only here**: `gross` and
            `refund` are both zero on it, because a dispute is neither. Whether
            that amount was withheld or returned is the row's `status` —
            `RevenueTotals` splits the two into `dispute_withdrawn_minor` and
            `dispute_reinstated_minor`, and a won dispute appears in both.
          allOf:
            - $ref: '#/components/schemas/Money'
        reporting:
          description: |
            The net restated in the site's `reporting_currency`, or **null** when
            no usable rate existed. Null rather than zero: an unconverted amount
            is unknown, and a zero is a number a client would happily add up.
            Always null together with `conversion`.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        conversion:
          description: The rate and the banking day it came from, or null.
          oneOf:
            - $ref: '#/components/schemas/CurrencyConversion'
            - type: 'null'
        parent_object_id:
          description: For a refund or dispute, the charge it belongs to. Null on a charge.
          oneOf:
            - type: string
            - type: 'null'
        order_id:
          description: The provider's order identity across charge retries, or null.
          oneOf:
            - type: string
            - type: 'null'
        product_name:
          oneOf:
            - type: string
            - type: 'null'
        matched_via:
          $ref: '#/components/schemas/RevenueMatchedVia'
        confidence:
          $ref: '#/components/schemas/RevenueMatchConfidence'

    RevenueMatchedVia:
      type: string
      enum: [conversion_event, client_reference, customer_identity, none]
      description: |
        Which exact signal matched this transaction to a visitor (ADR-0033, D6),
        in confidence order. `none` is a first-class outcome, not a gap: exact
        signals only, no IP or time-proximity matching (docs snapshot 05, D-102).

    RevenueMatchConfidence:
      type: string
      enum: [exact, linked, none]

    RevenueIdentityScope:
      type: string
      enum: [identified, anonymous_day]
      description: |
        D2a's honesty flag. `anonymous_day` means the journey is bounded by the
        UTC-midnight rotation of a cookieless anonymous id (D-102) rather than by
        the attribution window; `identified` means it runs from the last rotation
        before `identify()` onward, with the full window genuinely covered from
        identification forward.

    RevenueTransactionsResponse:
      type: object
      additionalProperties: false
      required: [meta, items, next_cursor, has_more]
      properties:
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RevenueTransaction'
        next_cursor:
          description: Pass as `cursor` for the next page, or null on the last one.
          oneOf:
            - type: string
            - type: 'null'
        has_more:
          type: boolean
          description: |
            Exact on the last page. The server over-fetches by one row rather
            than counting, so this is never a guess.

    RevenueJourneyDisplay:
      type: object
      additionalProperties: false
      required: [kind, text, icon]
      description: |
        The docs snapshot §11 display block. `kind` is the stable vocabulary a
        frontend switches on; `text` is a server-rendered sentence from a closed
        template; `icon` is a hint the frontend may override.
      properties:
        kind:
          type: string
          enum: [session_entry, conversion, revenue_charge, revenue_refund, revenue_dispute]
          description: |
            `conversion` is reserved and rendered by the same template set, but no
            CP5 journey emits one: the attribution fact stores session entries
            and the order's money objects, and the conversion event that matched
            it carries no id onto the attribution row. It is in the enum so a
            client's switch is complete the day an event-grain journey adds it.
        text:
          type: string
          minLength: 1
          description: |
            Never empty, for any input. Contains **no amount** — money crosses
            the wire as minor units plus a currency and is formatted by the
            client — and never a visitor, customer or user pseudonym.
        icon:
          type: string
          description: A kebab-case icon name. A hint; §11 lets the frontend choose its own.

    RevenueJourneyEntry:
      type: object
      additionalProperties: false
      required: [event_id, occurred_at, name, display, properties]
      properties:
        event_id:
          type: string
          description: |
            §11's field name, kept literally. It is the session id on a
            `session_entry` and the provider object id on a money entry — both
            stable, both already returned by other surfaces, neither a pseudonym.
        occurred_at:
          $ref: '#/components/schemas/UtcInstant'
        name:
          type: string
        display:
          $ref: '#/components/schemas/RevenueJourneyDisplay'
        properties:
          type: object
          additionalProperties: true
          description: |
            The template data `display.text` was rendered from, so a client can
            localize its own sentence instead of using the server's. Keys differ
            per `display.kind`.

    RevenueTouch:
      type: object
      additionalProperties: false
      required:
        [
          session_id,
          session_start,
          referrer_domain,
          utm_source,
          utm_medium,
          utm_campaign,
          utm_content,
          utm_term,
          entry_page,
        ]
      description: |
        The entry source of one session — the touchpoint grain (ADR-0033, D6;
        this is where ADR-0028 §8 lands). Absent dimensions are empty strings,
        matching the session-fact layer's own absence sentinel.
      properties:
        session_id:
          type: string
        session_start:
          $ref: '#/components/schemas/UtcInstant'
        referrer_domain:
          type: string
        utm_source:
          type: string
        utm_medium:
          type: string
        utm_campaign:
          type: string
        utm_content:
          type: string
        utm_term:
          type: string
        entry_page:
          type: string

    RevenueJourneyResponse:
      type: object
      additionalProperties: false
      required:
        [
          meta,
          object_id,
          matched_via,
          confidence,
          identity_scope,
          model_version,
          window_days,
          touchpoint_count,
          journey_truncated,
          first_touch,
          last_touch,
          entries,
        ]
      properties:
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
        object_id:
          type: string
        matched_via:
          $ref: '#/components/schemas/RevenueMatchedVia'
        confidence:
          $ref: '#/components/schemas/RevenueMatchConfidence'
        identity_scope:
          description: Null on an unmatched transaction, which has no identity to scope.
          oneOf:
            - $ref: '#/components/schemas/RevenueIdentityScope'
            - type: 'null'
        model_version:
          description: |
            The attribution model that produced this journey. A model change is a
            recompute under a new version, never a re-ingest. Null when unmatched.
          oneOf:
            - type: integer
            - type: 'null'
        window_days:
          description: |
            The attribution window in days (D2a, 30). Null when unmatched.
          oneOf:
            - type: integer
            - type: 'null'
        touchpoint_count:
          type: integer
          description: |
            The **true** number of touchpoints, even when `entries` was capped.
        journey_truncated:
          type: boolean
          description: |
            True when the stored journey hit its 50-touchpoint cap and the oldest
            were dropped. First touch is computed before the cap, so truncation
            never costs the model an input.
        first_touch:
          oneOf:
            - $ref: '#/components/schemas/RevenueTouch'
            - type: 'null'
        last_touch:
          oneOf:
            - $ref: '#/components/schemas/RevenueTouch'
            - type: 'null'
        entries:
          type: array
          description: |
            Session touchpoints and the order's money events, oldest first.
          items:
            $ref: '#/components/schemas/RevenueJourneyEntry'

    ImportRunPhase:
      type: string
      enum:
        - uploading
        - uploaded
        - validating
        - processing
        - ready_for_review
        - publishing
        - published
        - failed
        - discarded
        - superseded
        - rolled_back
      description: |
        Where the run is in its own lifecycle. `ready_for_review` waits for a
        human decision and can stay there indefinitely; `superseded` is a run
        that was published and then replaced by a later one, kept so a rollback
        has somewhere to go.

    ImportRunStatus:
      type: string
      enum: [queued, running, succeeded, failed_retryable, failed_terminal, cancelled]
      description: |
        The generic long-operation status derived from `phase` (docs snapshot 03
        §13), so a client that does not model the import lifecycle can still
        render progress. `ready_for_review` derives `running`: the preparation
        finished, but the operation the customer started has not.

    ImportRun:
      type: object
      additionalProperties: false
      description: |
        Every nullable field here is **required and nullable**: `null` is a
        statement about the run, never an omission a client has to guess at.
      required:
        [
          id,
          provider,
          status,
          phase,
          summary,
          cutover_date,
          error_code,
          created_at,
          finished_at,
          upload,
        ]
      properties:
        id:
          type: string
        provider:
          type: string
        status:
          $ref: '#/components/schemas/ImportRunStatus'
        phase:
          $ref: '#/components/schemas/ImportRunPhase'
        summary:
          description: |
            What staging found, and what the reviewer must see before publishing.
            Null until the run reaches `ready_for_review`.
          oneOf:
            - $ref: '#/components/schemas/ImportRunSummary'
            - type: 'null'
        cutover_date:
          description: |
            The calendar date (UTC) at which imported history stops and live data
            begins. Chosen at review time, so null before then.
          type: [string, 'null']
          format: date
        error_code:
          description: |
            A safe category on a failed run — never a provider message. Null
            otherwise.
          type: [string, 'null']
        created_at:
          $ref: '#/components/schemas/UtcInstant'
        finished_at:
          description: Null while the run is still live.
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        upload:
          description: |
            Where to PUT the archive, minted fresh on each read. Non-null **only**
            on `GET .../imports/{run_id}` while the run is `uploading`; the list
            read and the create response's `run` always carry `null` — the create
            response's own top-level `upload` is the one that starts the transfer,
            and a list that minted a signed URL per row would hand out credentials
            to a poll.
          oneOf:
            - $ref: '#/components/schemas/ImportUploadTarget'
            - type: 'null'

    ImportRunSummary:
      type: object
      description: |
        The review payload. Read it before publishing: `warnings` is where a
        provider export's losses are declared, and `proposed_cutover_date` is the
        value `POST .../publish` uses when the request omits one.
      required: [reports, date_range, warnings, proposed_cutover_date, total_rows]
      properties:
        reports:
          type: object
          description: |
            Keyed by report (`metrics`, `pages`, `sources`, `geography`,
            `devices`, `browsers`, `os`, `custom_events`). A report the archive
            did not contain is **absent**, which is a different statement from a
            report that contained no rows.
          additionalProperties:
            type: object
            required: [rows, chunks]
            properties:
              rows:
                type: integer
                format: int64
              chunks:
                description: |
                  How many batches the rows were staged in. Operational rather
                  than interesting — it is the unit a resumed import continues
                  from.
                type: integer
          propertyNames:
            type: string
        date_range:
          description: The span the archive covers. Null when nothing was staged.
          type: ['object', 'null']
          required: [from, to]
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        warnings:
          type: array
          description: |
            Things the import could not carry over. Show them: they are the
            difference between what the provider had and what the dashboard will
            show. Known codes today are `city_dropped` (imported geography has no
            city dimension), `report_not_staged` (a report this build does not
            read), `rows_at_or_after_cutover` (rows that fall on or past the
            proposed cutover and will therefore not be displayed),
            `dimension_truncated` (an over-long dimension value was cut to the
            byte budget), `unknown_columns` (CSV columns the adapter did not
            recognise were ignored) and `rows_outside_declared_range` (rows
            dated outside the file name's declared range). Treat unknown codes
            as displayable text keys rather than as an error.
          items:
            type: object
            required: [code, count]
            properties:
              code:
                type: string
              count:
                description: Affected rows, or `0` for a structural warning.
                type: integer
                format: int64
              detail:
                type: object
                additionalProperties: true
        proposed_cutover_date:
          description: |
            The default `POST .../publish` will use: the day after the last
            imported day, or the site's first live day when that is earlier
            (there is no clamp for a site with no live events). Null when the
            import staged nothing, in which case it cannot be published.
          type: [string, 'null']
          format: date
        total_rows:
          type: integer
          format: int64
      additionalProperties: true

    PublishImportRequest:
      type: object
      additionalProperties: false
      description: |
        Every field optional: `POST` with no body publishes with the proposed
        cutover.
      properties:
        cutover_date:
          type: string
          format: date
          description: |
            The day imported history stops and live data begins. Defaults to
            `summary.proposed_cutover_date`. May not be later than the day after
            the site's first live event.

    CreateImportRequest:
      type: object
      additionalProperties: false
      required: [provider, size_bytes, content_type]
      properties:
        provider:
          type: string
          description: An `id` from `GET /v1/imports/providers` whose `available` is true.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: |
            The archive's exact byte length. It is bound into the upload
            signature, so an approximate value produces an upload storage
            refuses.
        content_type:
          type: string
          enum: [application/zip]
          description: Also bound into the signature; only ZIP archives are accepted.

    ImportUploadTarget:
      type: object
      additionalProperties: false
      required: [method, url, expires_at, required_headers]
      description: |
        A single-PUT upload. There is no multipart plan: binding the exact length
        into one signature is a stronger guarantee than a part list can give, and
        the archive limit sits far below the protocol's single-PUT ceiling.
      properties:
        method:
          type: string
          enum: [PUT]
        url:
          type: string
          format: uri
          description: Pre-signed and short-lived. Treat it as a credential.
        expires_at:
          $ref: '#/components/schemas/UtcInstant'
        required_headers:
          type: object
          additionalProperties:
            type: string
          description: |
            Send every one of these verbatim. They are part of the signature, so
            a changed or omitted header makes the request fail to verify.

    CreateImportResponse:
      type: object
      additionalProperties: false
      required: [run, upload]
      properties:
        run:
          $ref: '#/components/schemas/ImportRun'
        upload:
          $ref: '#/components/schemas/ImportUploadTarget'

    ExportRun:
      type: object
      additionalProperties: false
      required:
        [
          id,
          status,
          phase,
          cutoff,
          pinned_import_run_id,
          error_code,
          created_at,
          started_at,
          finished_at,
          expires_at,
          manifest,
        ]
      description: |
        One export. `phase` is the export's own state and `status` is the generic
        long-operation vocabulary - render whichever your component understands.

        `expired` maps to `status: succeeded`: the export itself succeeded and
        what ran out is the seven-day life of its files. `phase` is what tells
        you the download is gone.
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed_retryable, failed_terminal, cancelled]
        phase:
          type: string
          enum: [queued, running, succeeded, failed, expired]
        cutoff:
          description: |
            Every exported event was accepted at or before this instant. Pinned
            when the export was requested, from the server clock.
          $ref: '#/components/schemas/UtcInstant'
        pinned_import_run_id:
          description: |
            The imported generation the export carries, or null when the site had
            published no import. Pinned in the same snapshot as `cutoff`.
          type: [string, 'null']
        error_code:
          description: A safe category on a failed export. Null otherwise.
          type: [string, 'null']
        created_at:
          $ref: '#/components/schemas/UtcInstant'
        started_at:
          description: Null while the export is still queued.
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        finished_at:
          description: Null while the export is still live.
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        expires_at:
          description: |
            When the files stop being downloadable, computed by the server as
            `finished_at` plus the deployment's export retention (seven days,
            the bucket's own lifecycle rule). Null until the export finishes.

            Render this rather than deriving it: a client that added its own
            "+7 days" would be inventing a deadline, and would keep offering a
            download after the objects were deleted. It is a prediction, not a
            stored state — an export past it may still read
            `phase: succeeded` until the next download attempt flips it to
            `expired` and answers `410`.
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        manifest:
          description: |
            A summary, never the file list. Null until the export succeeds.
          oneOf:
            - $ref: '#/components/schemas/ExportManifestSummary'
            - type: 'null'

    ExportManifestSummary:
      type: object
      additionalProperties: false
      required: [schema_version, chunks, rows, bytes]
      properties:
        schema_version:
          description: |
            The format version of the exported files, not of this API. Bumped
            when the shape of an exported row changes.
          type: integer
        chunks:
          type: integer
        rows:
          type: integer
          format: int64
        bytes:
          description: Total size of the gzipped files, excluding the manifest.
          type: integer
          format: int64

    ExportDownload:
      type: object
      additionalProperties: false
      required: [export_id, expires_at, files]
      properties:
        export_id:
          type: string
        expires_at:
          description: When every URL in `files` stops working.
          $ref: '#/components/schemas/UtcInstant'
        files:
          type: array
          description: |
            The manifest first, then every chunk. Chunk filenames are
            `events-YYYY-MM.ndjson.gz` (with `-p2`, `-p3` for a month split over
            the size cap), `imported-{report}.ndjson.gz` and `funnels.ndjson.gz`.
          items:
            $ref: '#/components/schemas/ExportDownloadFile'

    ExportDownloadFile:
      type: object
      additionalProperties: false
      required: [kind, filename, url, expires_at, rows, bytes, sha256]
      properties:
        kind:
          type: string
          enum: [manifest, chunk]
        filename:
          type: string
        url:
          type: string
          format: uri
          description: Pre-signed and short-lived. Treat it as a credential.
        expires_at:
          $ref: '#/components/schemas/UtcInstant'
        rows:
          description: Null for the manifest.
          type: [integer, 'null']
          format: int64
        bytes:
          description: Size of the gzipped file. Null for the manifest.
          type: [integer, 'null']
          format: int64
        sha256:
          description: |
            Digest of the file as stored, so a download can be verified without
            inflating it. Null for the manifest, whose digest cannot be inside
            itself.
          type: [string, 'null']

    RecentVisitorsMeta:
      type: object
      additionalProperties: false
      required: [requested_range, timezone, freshness, cached, truncated, provisional]
      description: |
        Metadata for the two recent-visitor reads (ADR-0024). Shaped like
        `FunnelMeta` rather than `AnalyticsMeta` because these operations have no
        rollup resolution to report — they read the event facts directly.
      properties:
        requested_range:
          $ref: '#/components/schemas/DateRange'
        timezone:
          $ref: '#/components/schemas/Timezone'
        freshness:
          $ref: '#/components/schemas/AnalyticsFreshness'
        cached:
          type: boolean
        truncated:
          type: boolean
          description: |
            True when the result filled its row cap — `limit` visitors, or 500
            page views on a trail. It means "there may be more behind this",
            and what was dropped is the *oldest* activity, since both reads
            order newest-first.
        provisional:
          type: boolean
          const: true
          description: |
            Always true. These reads sit at the leading edge of ingest, where
            sessions are not finalized and late events can still arrive — show
            them as a live view, not as a settled report.

    VisitorRevenue:
      type: object
      additionalProperties: false
      required: [amount_minor, currency, transaction_count]
      description: |
        Revenue attributed to this visitor identity **within the requested
        window** — not lifetime value. The window matters three times over:
        the list is at most 24 hours deep, the anonymous hash rotates at UTC
        midnight (yesterday's purchases sit under yesterday's hash), and
        attribution itself runs on a 30-day window. An identified visitor's
        row carries the revenue of both halves of their identity — the
        anonymous id and the `identify()` hash the attribution row may be
        keyed on (ADR-0033 CP4).

        **Served only to callers holding `revenue:read` (owner-only), and only
        on rows with at least one attributed, converted charge in the window —
        it is a marker, not a column.** For any other member the field is
        absent on every row — never `0`, because `0` is a claim about the
        business and a non-owner is not allowed to know it either way. Decide
        whether to render the revenue affordance from the caller's `role`
        (exactly as the Revenue card does), never by probing for the field:
        for an owner a missing marker means "no attributed revenue in this
        window", for anyone else it means "not yours to see".

        Only converted, attributed charges are counted: unmatched payments,
        refunds and disputes have no visitor and never appear here (they stay
        in the Revenue card's totals, so no money leaves the product), and a
        charge with no usable exchange rate stays in the summary's
        unconverted remainder rather than being folded in as zero.
      properties:
        amount_minor:
          type: integer
          format: int64
          description: |
            Gross charge amount in the site's reporting currency, minor units,
            summed over the visitor's attributed charges in the window.
        currency:
          type: string
          description: The site's reporting currency (ISO 4217).
        transaction_count:
          type: integer
          format: int32
          description: The attributed charges behind `amount_minor`.

    RecentVisitor:
      type: object
      additionalProperties: false
      required:
        - visitor
        - country
        - device_type
        - browser
        - os
        - first_seen
        - last_seen
        - pageviews
      properties:
        visitor:
          type: string
          description: |
            The D-102 anonymous hash, which rotates at UTC midnight
            (ADR-0036). An identified visitor is one row under this same hash;
            the customer's hashed user id is never a row identity here.
        country:
          type: string
          description: Two-letter country code, or empty when geo is unknown.
        device_type:
          type: string
        browser:
          type: string
        os:
          type: string
        first_seen:
          $ref: '#/components/schemas/UtcInstant'
        last_seen:
          $ref: '#/components/schemas/UtcInstant'
        pageviews:
          type: integer
          minimum: 0
        revenue:
          allOf:
            - $ref: '#/components/schemas/VisitorRevenue'
          description: |
            See `VisitorRevenue` for when this marker is served and what it
            counts. A visitor whose payment is inside the window while their
            page views are not can appear with `pageviews: 0` and a revenue
            marker; that is the window rule working, not a phantom row.

    AnalyticsRecentVisitorsResponse:
      type: object
      additionalProperties: false
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/RecentVisitorsMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecentVisitor'

    VisitorPageView:
      type: object
      additionalProperties: false
      required: [event_id, occurred_at, page_path, page_title, referrer_domain]
      properties:
        event_id:
          type: string
        occurred_at:
          $ref: '#/components/schemas/UtcInstant'
        page_path:
          type: string
        page_title:
          type: string
        referrer_domain:
          type: string
          description: |
            Canonical external referrer host, or the empty string when the view
            had no external source — including a navigation from another page
            of the same site (ADR-0028).

    VisitorSession:
      type: object
      additionalProperties: false
      required: [session_id, started_at, ended_at, pages]
      description: |
        One client-hinted session of a visitor's trail. `session_id` is empty for
        page views whose client sent no hint — they are collected into a single
        unattributed group rather than dropped.
      properties:
        session_id:
          type: string
        started_at:
          $ref: '#/components/schemas/UtcInstant'
        ended_at:
          $ref: '#/components/schemas/UtcInstant'
        pages:
          type: array
          description: Page views in the order they happened, oldest first.
          items:
            $ref: '#/components/schemas/VisitorPageView'

    AnalyticsVisitorResponse:
      type: object
      additionalProperties: false
      required: [meta, visitor, sessions]
      properties:
        meta:
          $ref: '#/components/schemas/RecentVisitorsMeta'
        visitor:
          type: string
          description: Echoed back, so a client can pair a response with its request.
        sessions:
          type: array
          description: Newest session first, by the instant the session started.
          items:
            $ref: '#/components/schemas/VisitorSession'
        revenue:
          allOf:
            - $ref: '#/components/schemas/VisitorRevenue'
          description: |
            See `VisitorRevenue` — the same window rule and the same
            owner-only marker semantics as on the list rows.
        revenue_events:
          type: array
          items:
            $ref: '#/components/schemas/RevenueJourneyEntry'
          description: |
            The money entries behind `revenue`, as the journey vocabulary the
            transaction view already renders (`display.kind: revenue_charge`),
            ordered by `occurred_at`, oldest first. Unconverted charges are
            listed too (rendered honestly in their original currency, with a
            null reporting amount) even though they stay out of the summed
            marker. Each entry's `properties` carries a `session_id` — the
            attribution row's **last-touch** session — because which session a
            payment happened *inside* is not measured anywhere: this is an
            approximation of the last-touch session, not an exact in-session
            position, and must not be rendered as one (exact in-session
            position is a named follow-up). The `session_id` may name a
            session outside the window — the marker then sits beside no
            visible session, which is the window rule, not a bug. Served under
            the same conditions as `revenue`; absent — not empty — for
            callers without `revenue:read`.

    SiteIngestSettings:
      type: object
      additionalProperties: false
      required:
        - config_version
        - timezone
        - redact_query_keys
        - interaction_sampling
        - heartbeat_interval_seconds
        - features
        - attributed_revenue
      description: |
        A site's tracker/ingest settings — the stored values `GET
        /v1/tracker/config` is projected from. A site with no settings row is
        served the product defaults, and this shape does not distinguish the two:
        what a browser gets is the same either way.
      properties:
        config_version:
          type: integer
          minimum: 1
          description: |
            The site's current configuration version, after this request. It
            moves on every accepted write and is what invalidates every cached
            copy of the tracker config (ADR-0008).
        timezone:
          $ref: '#/components/schemas/Timezone'
        redact_query_keys:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 64
          description: |
            Query keys stripped from URLs **in the browser**, before anything is
            sent. Stored lowercased and de-duplicated. Extends the server-side
            default list rather than replacing it.
        interaction_sampling:
          type: number
          minimum: 0
          maximum: 1
          description: Fraction of clicks reported as heatmap `interaction` signals.
        heartbeat_interval_seconds:
          type: integer
          minimum: 5
          maximum: 100
          description: |
            Realtime presence interval. The ceiling is derived from the presence
            window rather than chosen (ADR-0035 D8): three intervals must fit
            inside it, so a visitor survives two consecutive lost heartbeats.
        features:
          type: object
          additionalProperties: false
          required: [web_vitals, engagement, interactions, heartbeat]
          properties:
            web_vitals:
              type: boolean
            engagement:
              type: boolean
            interactions:
              type: boolean
            heartbeat:
              type: boolean
        attributed_revenue:
          type: boolean
          description: |
            Whether this site's browsers may send the revenue-linking hint —
            the `order_id` property of a `conversion` event (ADR-0064 D4a).
            Off by default, and not a substitute for consent: the obligation
            that comes with linking a visitor to an order is the site's.

    UpdateSiteIngestSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Every field is optional; absent means "leave it alone", never "reset to
        the default". An empty object is refused.
      properties:
        timezone:
          $ref: '#/components/schemas/Timezone'
        redact_query_keys:
          type: array
          maxItems: 200
          items:
            type: string
            minLength: 1
            maxLength: 64
        interaction_sampling:
          type: number
          minimum: 0
          maximum: 1
        heartbeat_interval_seconds:
          type: integer
          minimum: 5
          maximum: 100
        features:
          type: object
          additionalProperties: false
          description: Patchable flag by flag; an unnamed flag keeps its value.
          properties:
            web_vitals:
              type: boolean
            engagement:
              type: boolean
            interactions:
              type: boolean
            heartbeat:
              type: boolean
        attributed_revenue:
          type: boolean

    PublicDashboardSettings:
      type: object
      additionalProperties: false
      # The five ADR-0039 surfaces below are deliberately NOT in `required`,
      # the same departure `CustomEventRow` documents. The server always sends
      # all eight flags — `publicDashboardJson` has no branch that omits one —
      # so the runtime answer is identical. What optionality buys is that a
      # client compiled against the five-flag shape keeps compiling: this
      # response type is consumed by a frontend developed in parallel in this
      # same repository, and making a field required is a breaking change to
      # every object literal that constructs one.
      required: [enabled, share_slug, share_overview, share_geography, share_realtime]
      description: A site's public-dashboard sharing configuration (docs snapshot 02 §20).
      properties:
        enabled:
          type: boolean
          description: Master switch; off by default.
        share_slug:
          description: The opaque public slug, or null when never enabled.
          oneOf:
            - $ref: '#/components/schemas/ShareSlug'
            - type: 'null'
        share_overview:
          type: boolean
        share_geography:
          type: boolean
        share_realtime:
          type: boolean
          description: |
            Opt the public realtime stream into sharing (docs snapshot 02 §17,
            05 D-213). Effective only while `enabled` and the site is not
            `suspended`, like the other per-surface flags.
        share_timeseries:
          type: boolean
          description: |
            Opt the public traffic chart into sharing (ADR-0039). Effective only
            while `enabled` and the site is not `suspended`.
        share_sessions:
          type: boolean
          description: |
            Opt the public bounce-rate and visit-duration metrics into sharing
            (ADR-0039).
        share_pages:
          type: boolean
          description: |
            Opt the public top-pages breakdown into sharing (ADR-0039). This
            surface publishes the site's URL inventory; the opt-in **is** the
            privacy control for it, which is why there is no low-count
            suppression rule (ADR-0039, D3).
        share_sources:
          type: boolean
          description: Opt the public traffic-sources breakdown into sharing (ADR-0039).
        share_devices:
          type: boolean
          description: Opt the public device/browser/OS breakdown into sharing (ADR-0039).
        share_identity:
          type: boolean
          description: |
            Publish the site's name and favicon domain on the share page
            (ADR-0044, D3) — the ninth surface, and the only one that is not a
            board card.

            Off means `GET /v1/public/{slug}/site` omits `display_name` and
            `favicon_domain` **entirely** (they are absent, not `null`) while
            still serving `reporting_timezone` and `first_event_at`: an anonymous
            share still needs correct bucket boundaries and an "All time" anchor.
            Publish copy for the toggle should say what it publishes — the site's
            name and icon — not "identity".

    UpdatePublicDashboardRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        share_overview:
          type: boolean
          default: false
        share_geography:
          type: boolean
          default: false
        share_realtime:
          type: boolean
          default: false
          description: Opt the public realtime stream into sharing (docs snapshot 02 §17).
        share_timeseries:
          type: boolean
          default: false
        share_sessions:
          type: boolean
          default: false
        share_pages:
          type: boolean
          default: false
        share_sources:
          type: boolean
          default: false
        share_devices:
          type: boolean
          default: false
        share_identity:
          type: boolean
          default: false
          description: |
            Publish the site's name and favicon domain (ADR-0044). Like every
            other flag here it defaults to **false** on an omitted field, so a
            client that has not learned about this surface closes it rather than
            naming the owner's site.
        rotate_slug:
          type: boolean
          default: false
          description: When true, mint a fresh share slug, revoking the previous one.
      description: |
        A **full replace**, not a patch: every omitted `share_*` field is stored
        as `false`. That is deliberate and is the direction a missing field must
        fail in — a client that has not learned about a surface closes it rather
        than publishing it (ADR-0039, D2). Send the complete set of flags you
        want to be true.

    WidgetId:
      type: string
      description: |
        An opaque widget id (ADR-0045, D1). Unguessable, public, and **never an
        encoding of the `site_id`** — the same property the share slug is built
        for, minted the same way: 96 random bits in base36 behind a `w`.

        It is the widget's whole credential: holding it is permission to read that
        widget's one answer. It is also the id the management API uses, so the
        string in the dashboard's widget list is the string in the embed snippet —
        nothing has to be translated, and nothing leaks by the reuse, because the
        management path already requires membership of the site.

        There is no rotation. Rotating would invalidate a snippet already pasted
        into somebody's HTML, which is a delete and a create with extra steps.
      pattern: '^w[a-z0-9]{10,31}$'
      examples: ['w3f9xk21qm70c4bd']

    WidgetSurface:
      type: string
      description: |
        Which public read a widget publishes — one surface per widget, fixed at
        creation (ADR-0045, D2).

        These are exactly the surfaces an anonymous caller can already read behind
        an owner's share opt-in, which is what makes the list wide without making
        it a new data class (F-301; ADR-0039 D1). Nothing outside it is reachable
        through a widget: no custom events, no funnels, no revenue, no web vitals,
        no per-visitor rows.

        `realtime` is served as an ordinary cacheable snapshot poll rather than as
        an SSE stream, and its payload is `PublicRealtimeSnapshot` — one integer
        and a timestamp (ADR-0024, D7).
      enum:
        - overview
        - timeseries
        - sessions
        - pages
        - sources
        - devices
        - geography
        - realtime

    WidgetRange:
      type: string
      description: |
        The window a widget reports, as a **relative** key resolved on every read
        (ADR-0045, D10). A widget is a living embed; an absolute frozen range
        belongs to a report, and one that ages silently is worse than one that
        says its date.

        The vocabulary is the dashboard's own interval list, so "Last 7 days" on a
        widget is the same window as "Last 7 days" in the owner's dashboard.
        Calendar-anchored keys (`today`, `yesterday`) and every other key are cut
        in the **site's** reporting timezone, `UTC` when the site has not
        configured one — a widget has no viewer whose clock could be asked.

        `all` is anchored at the site's first event, never at its creation date,
        so a widget's "All time" starts where the public share's does (ADR-0044,
        D7). A site that has never ingested an event has no anchor and renders
        empty rather than being given an invented one.

        Required for the seven historical surfaces; **refused for `realtime`**,
        which has no range.
      enum: [today, yesterday, 24h, 7d, 30d, 90d, 6mo, 12mo, all]

    WidgetOrigin:
      type: string
      description: |
        One entry in a widget's origin allowlist: an exact serialized origin,
        `scheme://host[:port]`, lowercased — or the single value `*`.

        Compared as a whole string, never by prefix or suffix:
        `https://app.getopen.so` and `https://evil-app.getopen.so` are different
        origins and a suffix test accepts both.

        `*` means "render anywhere" and is accepted **only alone**; sent alongside
        another entry it is `VALIDATION_FAILED`, because a list containing `*`
        means `*` while looking like a restriction.
      minLength: 1
      maxLength: 253
      pattern: '^(\*|https?://[a-z0-9.\-]+(:[0-9]{1,5})?)$'
      examples: ['https://shop.example.com']

    Widget:
      type: object
      additionalProperties: false
      required:
        - id
        - surface
        - title
        - range
        - limit
        - allowed_origins
        - enabled
        - embed_url
        - embed_snippet
        - created_by_user_id
        - created_at
        - updated_at
      description: |
        An embeddable single-answer view of a site's analytics (ADR-0045; docs
        snapshot 02 §20). Configuration only — a widget never carries numbers, and
        what it publishes is read anonymously at `GET /v1/widget/{widget_id}`.
      properties:
        id:
          $ref: '#/components/schemas/WidgetId'
        surface:
          $ref: '#/components/schemas/WidgetSurface'
        title:
          type: [string, 'null']
          maxLength: 80
          description: |
            An owner-authored label rendered inside the embed, or `null` for none.

            Deliberately not the site's name: publishing a widget is not
            publishing whose site it is (ADR-0044, D1), and a title is a string
            the owner typed **in order to publish it**, which is a different act
            from having named their site in their own dashboard.
        range:
          description: |
            The window this widget reports, or `null` on a `realtime` widget,
            which has none.
          oneOf:
            - $ref: '#/components/schemas/WidgetRange'
            - type: 'null'
        limit:
          type: [integer, 'null']
          minimum: 1
          maximum: 50
          description: |
            How many rows a breakdown widget shows — `pages`, `sources`,
            `devices`, `geography` — and `null` on every other surface.

            Capped at 50 where the public reads allow 500: five hundred rows in a
            sidebar on somebody else's page is bytes nobody asked for.
        allowed_origins:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WidgetOrigin'
          description: |
            Where a browser may render this widget. **Empty means nowhere**
            (ADR-0045, D4) — unlike ingest, where a tracker must accept a site's
            own pages we have never heard of, a widget is created for a page the
            owner is looking at, so an omission fails closed.

            Enforced twice, and neither is an authentication boundary: the JSON
            read echoes `Access-Control-Allow-Origin` only for a listed origin,
            and the iframe document answers
            `Content-Security-Policy: frame-ancestors` with this list
            (`'none'` when it is empty). Whoever holds the id can read the JSON
            from anywhere; this list decides where a *browser* will paint it.
        enabled:
          type: boolean
          description: |
            The reversible revoke. `false` makes every read of this widget the
            same `404` an invented id gets — immediately at the origin, and within
            the response's `max-age` at any cache holding a copy.
        embed_url:
          type: string
          format: uri
          description: |
            The absolute URL of the embed document for this widget —
            `{api base}/embed/{widget_id}`, served by the api itself (ADR-0045
            D13: the document must answer `frame-ancestors` from the widget's
            own origin allowlist, which only the api holds).
        embed_snippet:
          type: string
          description: |
            The exact `<iframe>` tag we recommend, ready to paste — returned
            beside `embed_url` rather than left to the client to assemble, so the
            copy button in the dashboard is not a second place where the
            attributes of a supported embed are decided.
        created_by_user_id:
          type: [string, 'null']
          description: Null once the creating user's account is gone.
        created_at:
          $ref: '#/components/schemas/UtcInstant'
        updated_at:
          $ref: '#/components/schemas/UtcInstant'

    CreateWidgetRequest:
      type: object
      additionalProperties: false
      required: [surface, allowed_origins]
      description: |
        `allowed_origins` is required and has no default: an embed's allowlist
        must be a choice rather than an omission. `[]` is an explicit "nowhere
        yet".

        The bounds are the ones the public read enforces, so a widget that saves
        is a widget that renders — `range` is required except on `realtime`, and
        `limit` is accepted only on the four breakdown surfaces.
      properties:
        surface:
          $ref: '#/components/schemas/WidgetSurface'
        title:
          type: [string, 'null']
          maxLength: 80
        range:
          description: Required for every surface except `realtime`, which refuses it.
          oneOf:
            - $ref: '#/components/schemas/WidgetRange'
            - type: 'null'
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          description: |
            Accepted only on `pages`, `sources`, `devices` and `geography`; sent
            with any other surface it is `VALIDATION_FAILED` rather than a
            silently ignored field.
        allowed_origins:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WidgetOrigin'
        enabled:
          type: boolean
          default: true

    UpdateWidgetRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        A partial update; an empty body is refused rather than treated as a no-op.

        **`surface` is absent on purpose and cannot be changed** (ADR-0045, D2):
        it is the one property whose change alters what is published rather than
        how much of it, and an embed already pasted into a page would start
        publishing something else without that page being touched. Changing a
        surface is creating a widget.
      properties:
        title:
          type: [string, 'null']
          maxLength: 80
        range:
          oneOf:
            - $ref: '#/components/schemas/WidgetRange'
            - type: 'null'
        limit:
          type: [integer, 'null']
          minimum: 1
          maximum: 50
        allowed_origins:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WidgetOrigin'
        enabled:
          type: boolean

    PublicWidget:
      type: object
      additionalProperties: false
      required: [surface, title, range, limit]
      description: |
        What an anonymous reader is told about the widget itself: the four fields
        the owner configured, and nothing about the site, the account or us.

        No id (the caller already has it), no origins (a list of the owner's other
        pages is not the reader's business), no `enabled` (a disabled widget
        answers `404`), no timestamps.
      properties:
        surface:
          $ref: '#/components/schemas/WidgetSurface'
        title:
          type: [string, 'null']
          description: The owner's label for this embed, or `null`.
        range:
          description: |
            The configured window, or `null` on `realtime`. What was actually
            served is in `data.meta.requested_range`/`effective_range`, in the
            timezone `data.meta.timezone` names.
          oneOf:
            - $ref: '#/components/schemas/WidgetRange'
            - type: 'null'
        limit:
          type: [integer, 'null']
          description: The row cap on a breakdown surface, `null` elsewhere.

    PublicWidgetResponse:
      type: object
      additionalProperties: false
      required: [widget, data]
      description: |
        The widget read's two-key envelope (ADR-0045, D3).

        **`data` is a public share response, unchanged.** Every one of the eight
        shapes is exactly what `/v1/public/{share_slug}/…` serves for the same
        surface — same rows, same `PublicAnalyticsMeta`, no `freshness`, no
        `layering`, no `billable_events` — so one component renders a share card
        and a widget from one code path.

        **Branch on `widget.surface`, never on the shape of `data`.**
        `PublicPagesResponse`, `PublicSourcesResponse` and
        `PublicDevicesResponse` are all `{meta, items}` and cannot be told apart
        by inspection; that is why this envelope exists at all rather than the
        route returning the bare public response.
      properties:
        widget:
          $ref: '#/components/schemas/PublicWidget'
        data:
          description: |
            The payload for `widget.surface`, in that surface's public schema:

            | `widget.surface` | `data`                       |
            | ---------------- | ---------------------------- |
            | `overview`       | `PublicOverviewResponse`     |
            | `timeseries`     | `PublicTimeseriesResponse`   |
            | `sessions`       | `PublicSessionsResponse`     |
            | `pages`          | `PublicPagesResponse`        |
            | `sources`        | `PublicSourcesResponse`      |
            | `devices`        | `PublicDevicesResponse`      |
            | `geography`      | `PublicGeographyResponse`    |
            | `realtime`       | `PublicRealtimeSnapshot`     |
          oneOf:
            - $ref: '#/components/schemas/PublicOverviewResponse'
            - $ref: '#/components/schemas/PublicTimeseriesResponse'
            - $ref: '#/components/schemas/PublicSessionsResponse'
            - $ref: '#/components/schemas/PublicPagesResponse'
            - $ref: '#/components/schemas/PublicSourcesResponse'
            - $ref: '#/components/schemas/PublicDevicesResponse'
            - $ref: '#/components/schemas/PublicGeographyResponse'
            - $ref: '#/components/schemas/PublicRealtimeSnapshot'

    AssistantMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      description: |
        One turn of the client-held conversation (ADR-0046, D7 and D12).

        **Two roles, and no others.** `system` and `tool` are refused rather than
        stripped: the system prompt is the server's, and a `tool` message is
        produced only by the server's own dispatch into `/v1/read/*`. A forged
        tool result would be a way to tell the model that a site the caller
        cannot read had a million visitors, and to have that appear in a
        transcript under our name.
      properties:
        role:
          type: string
          enum: [user, assistant]
          description: |
            `user` for something the person typed, `assistant` for something this
            endpoint previously streamed back.
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: |
            The message text. The cap is `ASSISTANT_MAX_MESSAGE_CHARS`' default:
            a question, not a document. `user` text is scrubbed of
            credential-shaped substrings before the prompt is assembled, so a
            pasted key never reaches the provider (ADR-0046, D8).

    AssistantQuestionRequest:
      type: object
      additionalProperties: false
      required: [messages]
      description: |
        The bounded conversation to answer. The server stores no conversation, so
        this array is the whole of what the model is shown besides the
        server-owned system prompt and the tool results it fetches itself.

        The last message must have `role: user` — it is the question. Earlier
        entries are context. Over the count, the per-message cap or the total
        payload cap is `400 VALIDATION_FAILED`.
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 20
          description: |
            Oldest first, ending with the new `user` message. The cap is
            `ASSISTANT_MAX_MESSAGES`' default — ten exchanges, past which a
            conversation has drifted off the question it started from and a new
            one costs nothing.
          items:
            $ref: '#/components/schemas/AssistantMessage'

    AssistantUsage:
      type: object
      additionalProperties: false
      required:
        - available
        - window_hours
        - limit
        - used
        - remaining
        - input_tokens
        - output_tokens
        - retry_after_seconds
      description: |
        The caller's assistant spend over the rolling window, and the limit it is
        measured against (ADR-0046, D5).

        `used + remaining` equals `limit` except when `limit` has been lowered
        under a window a caller had already spent into, where `remaining` is `0`
        and `used` may exceed it. Reporting the real count rather than clamping it
        is what makes the ledger answer "how much is this being used" honestly.
      properties:
        available:
          type: boolean
          description: |
            Whether this deployment has a model provider configured at all. False
            where `OPENAI_API_KEY` is unset — the routes stay mounted and answer
            `SERVICE_UNAVAILABLE`, so a caller who asks is told why, but a client
            should ask this first and render the assistant as unavailable rather
            than offering a control whose only outcome is an error.
        window_hours:
          type: integer
          minimum: 1
          description: |
            The width of the rolling window, in hourly buckets. `24` today; it is
            reported rather than assumed so a client never hardcodes "per day".
        limit:
          type: integer
          minimum: 0
          description: |
            Questions allowed in the window, from
            `ASSISTANT_DAILY_QUESTION_LIMIT` (default 20; F-306). A named
            configuration value rather than a literal, because F-306 expects the
            limit to vary by plan later.
        used:
          type: integer
          minimum: 0
          description: |
            Questions charged in the window. A question is charged at accept —
            after validation, before the provider call — so a malformed request
            costs nothing and a failed generation still costs a slot.
        remaining:
          type: integer
          minimum: 0
          description: Questions left before the next one is refused with `429`.
        input_tokens:
          type: integer
          minimum: 0
          description: |
            Prompt tokens spent in the window, summed from the ledger. A
            measurement, not a budget: nothing refuses on it in v1.
        output_tokens:
          type: integer
          minimum: 0
          description: Generated tokens in the window, on the same footing.
        retry_after_seconds:
          type: [integer, 'null']
          minimum: 0
          description: |
            Seconds until the oldest bucket ages out, when `remaining` is `0`;
            `null` otherwise. The same number the `429`'s `Retry-After` carries,
            and it is true because the window is genuinely rolling.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional client-generated key that makes a retried create safe (docs
        snapshot 02 §18). Omitting it is allowed and the endpoint then behaves
        normally, with no ledger row.

        A replay with the same key and the same payload returns the first
        response verbatim. The same key with a different payload — or while the
        first request is still in flight — is `409 IDEMPOTENCY_CONFLICT`; a
        request that failed releases its key, so the caller may correct the
        payload and retry with it.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    SiteIdPath:
      name: site_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SiteId'
    ImportRunIdPath:
      name: run_id
      in: path
      required: true
      description: An import run id from `POST`/`GET .../imports`.
      schema:
        type: string
    ExportIdPath:
      name: export_id
      in: path
      required: true
      description: An export id from `POST`/`GET .../exports`.
      schema:
        type: string
    ShareSlugPath:
      name: share_slug
      in: path
      required: true
      description: Opaque public share slug. Never an internal `site_id`.
      schema:
        $ref: '#/components/schemas/ShareSlug'
    WidgetIdPath:
      name: widget_id
      in: path
      required: true
      description: |
        Opaque widget id. Never an internal `site_id`, and the same id on the
        public read and on the management routes.
      schema:
        $ref: '#/components/schemas/WidgetId'
    SiteSelector:
      name: X-OA-Site
      in: header
      required: false
      description: |
        Which site this request is about (ADR-0043, D3).

        **Required with an OAuth token, refused with a private key**, and neither
        is a technicality:

        - A token belongs to a *person* with several sites, so the request has to
          say which one. Omitted, `400 VALIDATION_FAILED` naming this header —
          there is no "your first site" default, because a CLI that silently
          reports on the wrong site is worse than one that asks.
        - A key *is* a site. Sending this with a key is `400 VALIDATION_FAILED`
          rather than being ignored: a caller that names a site is asserting
          something, and one that agrees by accident today would disagree
          tomorrow when somebody points the plugin at the wrong site.

        The site is authorized **per request, from live membership**, not from a
        grant frozen at consent time. So a user removed from a site loses it on
        their very next request, with no token revocation and no new mechanism —
        and a site they were never in answers `SITE_NOT_FOUND`, the same answer a
        malformed id gets, so the two stay indistinguishable.

        A header rather than a query parameter so it never mixes with the
        analytics parameters these routes already parse, and so the same URL
        means the same query for both credential kinds.
      schema:
        type: string
    RangeFrom:
      name: from
      in: query
      required: true
      description: Half-open range start, ISO-8601 UTC.
      schema:
        $ref: '#/components/schemas/UtcInstant'
    RangeTo:
      name: to
      in: query
      required: true
      description: Half-open range end (exclusive), ISO-8601 UTC.
      schema:
        $ref: '#/components/schemas/UtcInstant'
    QueryTimezone:
      name: timezone
      in: query
      required: true
      description: IANA timezone the calendar boundaries are expressed in.
      schema:
        $ref: '#/components/schemas/Timezone'
    Compare:
      name: compare
      in: query
      required: false
      description: When true, also return the equal-length preceding period.
      schema:
        type: boolean
        default: false
    TimeseriesResolution:
      name: resolution
      in: query
      required: false
      description: |
        Force the bucket grain. Absent = automatic selection. A grain the
        range/timezone cannot honestly serve is refused with
        `RESOLUTION_NOT_AVAILABLE`.
      schema:
        type: string
        enum: [minute, hour, day, week]
    RevenueResolution:
      name: resolution
      in: query
      required: false
      description: |
        Forces the revenue bucket grain. `hour` or `day` only — those are the two
        rollups revenue has (ADR-0033, D7). `minute` and `week` are
        `VALIDATION_FAILED`; a grain the range or timezone cannot honestly serve
        is `RESOLUTION_NOT_AVAILABLE`. Omitted, the grain is chosen from the span
        and the timezone. `meta.resolution` always reports what was served.
      schema:
        type: string
        enum: [hour, day]

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        An opaque cursor from a previous response's `next_cursor`. Omit it for
        the first page. Its encoding is a server implementation detail; a
        malformed value is `VALIDATION_FAILED`, never a silent restart.
      schema:
        type: string
        minLength: 1
        maxLength: 512

    PageLimit:
      name: limit
      in: query
      required: false
      description: Page size, 1–200. Defaults to 50.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    OverviewResolution:
      name: resolution
      in: query
      required: false
      description: |
        Force the rollup the totals are read from. Absent = automatic selection.
        Only `hour` and `day` exist here: overview has just those two source
        rollups, `minute` would add nothing to a total that is already summed
        over the whole range, and `week` is a bucketing concept with no meaning
        for a single unbucketed figure. A grain the range/timezone cannot
        honestly serve is refused with `RESOLUTION_NOT_AVAILABLE`.
      schema:
        type: string
        enum: [hour, day]
    TopNLimit:
      name: limit
      in: query
      required: false
      description: Maximum rows to return for a top-N report.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    AnalyticsFilters:
      name: filters
      in: query
      required: false
      description: |
        A **session-scoped** filter set (ADR-0075), as a URL-encoded JSON array
        of `{dimension, operator, values}`.

        ## The grain rule, in one sentence

        **A filter selects sessions, and the report then describes everything
        those sessions did.**

        A visitor who arrives from YouTube and reads five pages shows five pages
        under `Source: youtube.com`, not one. Only the landing pageview carries
        the referrer, so filtering pageviews instead would report that YouTube
        sends people who bounce — the opposite of the truth. The same rule holds
        on every surface: this parameter means the same thing on the dashboard,
        on `/v1/read` and through MCP.

        ## Grammar

        - `dimension` — one of `referrer_domain`, `country`, `city`,
          `device_type`. The vocabulary is **closed**: an unknown dimension is a
          `VALIDATION_FAILED` naming it in `details.dimension`, never a silently
          ignored clause.
        - `operator` — `eq` (exactly one value) or `in` (up to 20). Absent means
          `in`.
        - `values` — strings, at most 128 characters each. Matched exactly, on
          the value the SESSION ENTRY carried.

        Clauses are combined with **AND only**. There is no OR across
        dimensions, no negation, no regex and no free text in v1. Within one
        dimension the values are an OR, which is what `in` is; two clauses on
        the same dimension are merged into one rather than intersected to
        nothing.

        ## What a filtered read costs and cannot do

        A filtered read is answered from the event and session facts rather than
        from a rollup, so it is capped at **92 days** — a longer range is
        `RANGE_TOO_LARGE`, named and immediate, never a timeout. It is also
        **live-only**: a staged provider day carries no session for a
        session-scoped filter to select, so a range overlapping imported days
        comes back with `meta.partial: true`.

        Events that carry no client session hint — a server-side SDK call, a
        widget write — belong to no session and are therefore outside every
        filtered read by construction, which is why a filtered total can sit
        below the unfiltered one by more than the filter alone explains.

        Custom events and performance do not accept a filter yet; sending one is
        `VALIDATION_FAILED` naming the report.
      schema:
        type: string
      example: '[{"dimension":"country","operator":"in","values":["US","CA"]}]'
    PagesSort:
      name: sort
      in: query
      required: false
      description: |
        Which measure decides the top-N cut on the pages report (ADR-0075,
        D-E2).

        **Sorting is a server parameter and not a client concern**, because the
        cut and the sort are one decision: a client that re-sorted a top-100-by-
        views page by `exits` would present that page's busiest exits as "the
        site's busiest exits", and for any site with a long tail those are
        different sets. The column header has to change the request.

        `views` is the default and leaves the read byte-identical to what it was
        before this parameter existed. `entrances` and `exits` let the session
        read drive the cut instead, and a path that only the session read
        returned enters the list with `views: 0`.
      schema:
        type: string
        enum: [views, entrances, exits]
        default: views
    RecentWindowHours:
      name: hours
      in: query
      required: false
      description: |
        How many hours back the recent-visitor window reaches. Capped well below
        the other read ranges because these operations read the event facts per
        visitor rather than a rollup.
      schema:
        type: integer
        minimum: 1
        maximum: 24
        default: 2
    RecentVisitorsLimit:
      name: limit
      in: query
      required: false
      description: Maximum visitors to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    VisitorHash:
      name: hash
      in: query
      required: true
      description: |
        A `visitor` value taken from a `recent-visitors` row or a realtime feed
        event — always the D-102 anonymous hash (ADR-0036). Opaque, site-scoped
        and rotating at UTC midnight, so it is not a durable handle on a person.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    FunnelSteps:
      name: steps
      in: query
      required: true
      description: |
        Ordered funnel step keys, as repeated `steps=` parameters (2–8). Each key
        matches a pageview's path or another event's name.
      schema:
        type: array
        minItems: 2
        maxItems: 8
        items:
          type: string
          minLength: 1
          maxLength: 512
      style: form
      explode: true
    FunnelWindowMs:
      name: window_ms
      in: query
      required: true
      description: Conversion window in milliseconds; a unit's steps must fall within it.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 2592000000
    FunnelScope:
      name: scope
      in: query
      required: false
      description: The aggregation unit — resolved visitor identity, or that identity plus the client session hint.
      schema:
        type: string
        enum: [visitor, session]
        default: visitor

  responses:
    Unauthenticated:
      description: No valid session or token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SiteNotFound:
      description: No such site is visible to the caller (`SITE_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ShareNotFound:
      description: No opted-in public share resolves from this slug (`NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    WidgetNotFound:
      description: |
        Nothing resolves from this widget id (`NOT_FOUND`).

        **One indistinguishable answer for four different facts** (ADR-0045, D7;
        the ADR-0039 D2 idiom): no such widget; the widget is `enabled: false`;
        the widget was deleted; the site is `suspended`, `deleting` or
        `deleted`. The body is byte-identical in all four cases apart from
        `request_id` —
        `{"error":{"code":"NOT_FOUND","message":"No such widget","request_id":"…","details":{}}}`.

        A widget id sits in the HTML of a page anyone can view, so a
        distinguishable "this site stopped paying" would publish a customer's
        billing state to their own readers. Docs snapshot 02 §20 requires the
        billing gate to close a widget in the backend; this is what that looks
        like on the wire.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SiteSuspended:
      description: |
        The site is `suspended` and every read of its analytics is closed
        until an operator restores it (`SITE_SUSPENDED`). The recovery
        endpoints — the site itself, its members, its credentials — stay open.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenOrSuspended:
      description: |
        One status, two codes, because HTTP has one 403 and these operations
        can meet either: the caller lacks the capability this operation needs
        (`FORBIDDEN`), or the site is `suspended` and its analytics are closed
        (`SITE_SUSPENDED`). The client branches on `error.code`, which is what
        the code catalog is for.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MissingScopeOrSuspended:
      description: |
        One status, two codes, for the reason `ForbiddenOrSuspended` carries
        two: the credential is valid but does not carry the scope this read
        needs (`FORBIDDEN`, ADR-0042 D3), or the site it is bound to is
        `suspended` and its analytics are closed (`SITE_SUSPENDED`). The gate
        is the site's, not the door's.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AnalyticsBadRange:
      description: |
        The range failed validation, the range/timezone/grain combination has no
        rollup that can answer it, or — on `/v1/read` only — the declared range is
        wider than that surface's ceiling (`VALIDATION_FAILED` /
        `RESOLUTION_NOT_AVAILABLE` / `RANGE_TOO_LARGE`).

        The three share a status and are told apart by `error.code`, which is what
        a client should branch on. `RANGE_TOO_LARGE` (ADR-0043, D7) carries
        `details.requested_days` and `details.max_days`, so narrowing and paging
        needs no guessing. It is deliberately **not** `VALIDATION_FAILED` — the
        request is well-formed and the recovery is exact rather than a hunt for a
        typo — and deliberately not `RATE_LIMITED`, because nothing about waiting
        helps and a `Retry-After` would be a lie.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AnalyticsUnavailable:
      description: |
        The query gateway could not be reached or failed (`SERVICE_UNAVAILABLE`).
        Never returned as an empty 200 (AGENTS.md).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated, but lacking the required capability.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MissingScope:
      description: |
        The key is valid but does not carry the scope this read needs
        (`FORBIDDEN`). Deliberately not a `401`: authentication succeeded and it
        is the permission that is absent, so an integrator is not sent off to
        re-check a token that is fine (ADR-0042, D3). The recovery is to mint a
        key with `analytics:read`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: Request failed schema or semantic validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AssistantUnavailable:
      description: |
        The assistant could not be served (ADR-0046, D6 and D10). Two codes, told
        apart by `error.code`, because the two recoveries are different people's:

        - `SERVICE_UNAVAILABLE` — this deployment has no model provider
          configured (`OPENAI_API_KEY` is unset). An operator problem, and a
          permanent one until they act. The routes stay **mounted** and say so
          rather than being absent: an unmounted `/v1` path answers `401`, which
          would reach a browser as "you are signed out".
        - `PROVIDER_UNAVAILABLE` — the provider was unreachable, timed out, or
          answered a 5xx. Retryable, and the caller's own question is unchanged.

        Returned as an ordinary JSON envelope when the failure happens **before**
        the stream opens. Once `200 text/event-stream` has been written the
        status is spent, and the same envelope travels in-band as an `error`
        event instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ImportInProgress:
      description: |
        The site already has a non-terminal import, or this run has moved past
        the phase the action needs (`IMPORT_IN_PROGRESS`).
        `details.import_run_id` names the run and `details.phase`, where it
        applies, says where it is.

        On the endpoints that accept `Idempotency-Key`, the same status also
        carries `IDEMPOTENCY_CONFLICT`: the key was replayed with a different
        request body, or the first request carrying it is still in flight. That
        one is a client-side collision — re-send with a fresh key — and is
        unrelated to the state of any import.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ExportInProgress:
      description: |
        The site already has a live export, or this export has not succeeded and
        cannot be downloaded (`EXPORT_IN_PROGRESS`). `details.export_id` names
        the export and `details.phase`, where it applies, says where it is.

        On the create endpoint the same status also carries
        `IDEMPOTENCY_CONFLICT`: the `Idempotency-Key` was replayed with a
        different body, or the first request carrying it is still in flight. That
        one is a client-side collision - re-send with a fresh key - and is
        unrelated to the state of any export.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ExportExpired:
      description: |
        The export's files have passed their seven-day life and are gone
        (`EXPORT_EXPIRED`). Permanent: request a new export rather than retrying.
        The export row and its audit trail survive, so `GET .../exports/{id}`
        still answers with `phase: expired`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RevenueCredentialRejected:
      description: |
        The provider rejected the credential during the live probe
        (`REVENUE_CREDENTIAL_REJECTED`) — a revoked or mistyped key, or a
        restricted key missing the read permissions the adapter needs. **Nothing
        was stored**, and an existing connection is unchanged.

        Not retryable and not a field-shape problem: the request was well-formed
        and the value was what the customer meant to send. The remedy is in the
        provider's own dashboard. `details.provider` names which one said no.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ObjectStorageUnavailable:
      description: |
        Object storage did not answer, or this deployment has no bucket
        configured (`PROVIDER_UNAVAILABLE`). Retryable: nothing was written and
        nothing was lost. `details.reason` carries the port's classification for
        the operator reading it beside the log line.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

security:
  - sessionCookie: []
